eda el socket sin necesitarlo."],"rubric":[{"pts":2,"t":"Sensor por pipe con formato y rangos"},{"pts":3,"t":"Procesador: parsea y aplica los 3 umbrales"},{"pts":2,"t":"Envía solo alertas y espera el ACK"},{"pts":2,"t":"Base: registra con hora y responde"},{"pts":1,"t":"Cierres ordenados y wait()"}],"lang":"c","pruebas":{"compilar":[{"src":["i1_base.c"],"out":"base"},{"src":["i1_procesador.c"],"out":"procesador"}],"pasos":[{"tipo":"iniciar","nombre":"Tu base Ceres","cmd":"./base","puerto":6001,"log":"base.out","critico":true},{"tipo":"ejecutar","nombre":"Tu procesador con su sensor (~16 s)","cmd":"./procesador","timeout":30,"guardar":"salida.txt"},{"tipo":"esperar","segundos":0.5},{"tipo":"python","nombre":"Alertas esperadas vs recibidas","archivo":"prueba/i1.py"}],"archivos":{"prueba/i1.py":"import re\nfrom cognition_prueba import *\ns = leer_archivo(\"salida.txt\"); base = leer_archivo(\"base.out\")\nvitales = re.findall(r\"VITAL O2=([\\d.]+) CO2=([\\d.]+) TEMP=([\\d.]+)\", s)\ncheck(len(vitales) >= 6, \"El procesador leyó las lecturas del sensor por el pipe (%d)\" % len(vitales), \"El procesador no muestra las lecturas VITAL (vi %d)\" % len(vitales))\nesperadas = sum((float(o) < 85) + (float(c) > 3) + (float(t) > 22) for o, c, t in vitales)\nrecibidas = len(re.findall(r\"ALERTA_(O2|CO2|TEMP)\", base))\ncheck(recibidas == esperadas, \"La base recibió exactamente las %d alertas esperadas\" % esperadas, \"Según las lecturas correspondían %d alertas, la base registró %d\" % (esperadas, recibidas))\nterminar()\n"}}},{"id":"I2","group":"cert","n":"I2 ⭐⭐⭐","topic":"integracion","lvl":3,"min":30,"title":"Flota MCRN — pipe + socket + RPC","statement":"<p>Cada nave tiene un sensor (hijo) y un validador (padre) unidos por pipe. El sensor genera velocidad (0–1000 km/s), distancia_objetivo (0–500 km) y combustible (0–100 %). El validador se conecta por TCP al cuartel (puerto 8010) y llama por RPC <code>CALL solicitar_reabastecimiento &lt;nave&gt; &lt;combustible&gt;</code> si combustible &lt; 20 %, y <code>CALL solicitar_ordenes &lt;nave&gt; &lt;dist&gt;</code> si distancia &lt; 50 km. El cuartel (fork por cliente) responde <code>RESULT REBASTECER_EN &lt;base&gt;</code> o <code>RESULT ATACAR|RETIRARSE</code>.</p><p><code>./i2_nave Donnager &amp; ./i2_nave Scirocco &amp; ./i2_nave Tachi &amp;</code></p>","files":[{"name":"i2_cuartel.c","code":"/* i2_cuartel.c — cuartel MCRN: servidor RPC concurrente */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 8010\n\nvoid atender(int fd) {\n//@TODO 1 | Responder las dos funciones RPC\n    char buf[256], fn[48], nave[32], resp[96];\n    float v;\n    int n;\n    const char *bases[] = { \"Tycho\", \"Ceres\", \"Marte\" };\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        if (sscanf(buf, \"CALL %47s %31s %f\", fn, nave, &v) != 3) { send(fd, \"RESULT ERROR\\n\", 13, 0); continue; } //§\n        if (strcmp(fn, \"solicitar_reabastecimiento\") == 0) //§\n            snprintf(resp, sizeof resp, \"RESULT REBASTECER_EN %s\\n\", bases[rand() % 3]); //§\n        else if (strcmp(fn, \"solicitar_ordenes\") == 0) //§\n            snprintf(resp, sizeof resp, \"RESULT %s\\n\", rand() % 2 ? \"ATACAR\" : \"RETIRARSE\"); //§\n        else\n            snprintf(resp, sizeof resp, \"RESULT ERROR\\n\");\n        printf(\"[CUARTEL] %s(%s, %.1f) -> %s\", fn, nave, v, resp + 7);\n        fflush(stdout);\n        send(fd, resp, strlen(resp), 0); //§\n    }\n//@END\n}\n\nint main(void) {\n//@TODO 2 | Servidor concurrente con fork()\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; } //§\n    listen(srv, 10); //§\n    signal(SIGCHLD, SIG_IGN); //§\n    while (1) {\n        int cli = accept(srv, NULL, NULL); //§\n        if (cli < 0) continue;\n        if (fork() == 0) { //§\n            close(srv); //§\n            srand(getpid());\n            atender(cli); //§\n            close(cli);\n            exit(0);\n        }\n        close(cli); //§\n    }\n//@END\n}\n"},{"name":"i2_nave.c","code":"/* i2_nave.c — sensor (hijo) -> validador (padre) -> RPC al cuartel */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/wait.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 8010\n#define LECTURAS 10\n\nint sock;\n\n/* Stub RPC genérico */\nint rpc_call(const char *fn, const char *nave, float v, char *out, int n) {\n//@TODO 1 | Stub: CALL <fn> <nave> <valor>\\n -> extraer lo que va después de RESULT\n    char msg[128];\n    snprintf(msg, sizeof msg, \"CALL %s %s %.1f\\n\", fn, nave, v); //§\n    send(sock, msg, strlen(msg), 0); //§\n    int r = recv(sock, msg, sizeof(msg) - 1, 0); //§\n    if (r <= 0) return -1;\n    msg[r] = '\\0';\n    if (strncmp(msg, \"RESULT \", 7) != 0) return -1; //§\n    snprintf(out, n, \"%s\", msg + 7); //§\n    out[strcspn(out, \"\\n\")] = '\\0';\n    return 0;\n//@END\n}\n\nvoid sensor(int wfd) {\n    srand(getpid());\n    float comb = 50 + rand() % 30, dist = 250 + rand() % 200;\n    for (int i = 0; i < LECTURAS; i++) {\n        float vel = rand() % 1001;\n        comb -= 3 + rand() % 6;  if (comb < 0) comb = 0;\n        dist -= 25 + rand() % 40; if (dist < 0) dist = 0;\n        char msg[96];\n        int len = snprintf(msg, sizeof msg, \"SENSOR vel=%.0f dist=%.0f comb=%.0f\\n\", vel, dist, comb);\n        write(wfd, msg, len);\n        usleep(400000);\n    }\n    close(wfd);\n    exit(0);\n}\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) { fprintf(stderr, \"Uso: %s <nombre_nave> [ip]\\n\", argv[0]); return 1; }\n    const char *nave = argv[1];\n    int p[2];\n//@TODO 2 | pipe + fork del sensor, conexión al cuartel\n    pipe(p); //§\n    if (fork() == 0) { close(p[0]); sensor(p[1]); } //§\n    close(p[1]); //§\n    sock = socket(AF_INET, SOCK_STREAM, 0); //§\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET;\n    srv.sin_port = htons(PORT);\n    inet_pton(AF_INET, argc > 2 ? argv[2] : \"127.0.0.1\", &srv.sin_addr);\n    if (connect(sock, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; } //§\n//@END\n//@TODO 3 | Validador: leer el pipe y llamar por RPC según las reglas\n    FILE *in = fdopen(p[0], \"r\"); //§\n    char linea[128], res[64];\n    float vel, dist, comb;\n    while (fgets(linea, sizeof linea, in)) { //§\n        if (sscanf(linea, \"SENSOR vel=%f dist=%f comb=%f\", &vel, &dist, &comb) != 3) continue; //§\n        if (comb < 20 && rpc_call(\"solicitar_reabastecimiento\", nave, comb, res, sizeof res) == 0) //§\n            printf(\"[%s] combustible %.0f%% -> %s\\n\", nave, comb, res);\n        if (dist < 50 && rpc_call(\"solicitar_ordenes\", nave, dist, res, sizeof res) == 0) //§\n            printf(\"[%s] objetivo a %.0f km -> %s\\n\", nave, dist, res);\n    }\n    fclose(in);\n    close(sock);\n    wait(NULL);\n//@END\n    return 0;\n}\n"}],"hints":["Es I1 + R1: reutiliza el patrón pipe/fork y escribe un stub RPC.","Un solo stub genérico rpc_call(fn, nave, valor) sirve para las dos funciones."],"think":["Nave: pipe, fork del sensor, connect al cuartel, fgets del pipe, if por cada regla → rpc_call.","Stub: snprintf CALL, send, recv, verificar el prefijo \"RESULT \" y copiar el resto.","Cuartel: fork por cliente, sscanf \"CALL %s %s %f\" y responder según la función."],"errors":["srand() en el padre antes de fork: todos los hijos generan la misma secuencia \"aleatoria\"."],"rubric":[{"pts":2,"t":"Sensor → validador por pipe"},{"pts":2,"t":"Reglas de combustible y distancia"},{"pts":3,"t":"Stub RPC"},{"pts":3,"t":"Cuartel concurrente con las 2 funciones"}],"lang":"c","pruebas":{"compilar":[{"src":["i2_cuartel.c"],"out":"cuartel"},{"src":["i2_nave.c"],"out":"i2_nave"}],"pasos":[{"tipo":"iniciar","nombre":"Tu cuartel","cmd":"./cuartel","puerto":8010,"log":"cuartel.out","critico":true},{"tipo":"python","nombre":"RPC del cuartel y 2 naves a la vez","archivo":"prueba/i2.py","timeout":30}],"archivos":{"prueba/i2.py":"import subprocess\nfrom cognition_prueba import *\nc = Linea(conectar(8010))\nc.enviar(\"CALL solicitar_reabastecimiento Donnager 12.0\\n\"); r = c.leer() or \"\"\ncheck(r.startswith(\"RESULT REBASTECER_EN \"), \"El cuartel responde solicitar_reabastecimiento\", \"solicitar_reabastecimiento: recibí %r\" % r)\nc.enviar(\"CALL solicitar_ordenes Donnager 30.0\\n\"); r = c.leer() or \"\"\ncheck(r in (\"RESULT ATACAR\", \"RESULT RETIRARSE\"), \"El cuartel responde solicitar_ordenes con ATACAR o RETIRARSE\", \"solicitar_ordenes: recibí %r\" % r)\nnaves = [subprocess.Popen([\"./i2_nave\", n], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True) for n in (\"Donnager\", \"Scirocco\")]\nsalidas = []\nfor p in naves:\n    try: salidas.append(p.communicate(timeout=20)[0])\n    except subprocess.TimeoutExpired: p.kill(); salidas.append(None)\ncheck(all(x is not None for x in salidas), \"Dos naves corren a la vez y terminan\", \"Alguna nave no terminó en 20 s\")\ncheck(any(\"REBASTECER_EN\" in (x or \"\") or \"ATACAR\" in (x or \"\") or \"RETIRARSE\" in (x or \"\") for x in salidas), \"Las naves recibieron respuestas RPC del cuartel\", \"Ninguna nave mostró una respuesta del cuartel\")\nterminar()\n"}}},{"id":"I3","group":"cert","n":"I3 ⭐⭐⭐","topic":"integracion","lvl":3,"min":40,"title":"Puertas del Anillo — sistema de 3 capas","statement":"<p><b>Nodo</b>: cada 3 s envía <code>GATE_STATUS &lt;gate&gt; &lt;estado&gt; &lt;timestamp&gt;</code> al hub (puerto 9001), con estado INACTIVA, EXPLORANDO, ACTIVA o INESTABLE (aleatorio con peso). <b>Hub</b>: hasta 5 nodos (fork por cliente); guarda el último estado de cada gate. Si ≥3 están ACTIVA, envía <code>ALERT NIVEL_3 &lt;n&gt; gates activas</code> a Laconia (puerto 9002). Si un nodo se desconecta, su gate pasa a INACTIVA. <b>Laconia</b>: ante NIVEL_3 responde <code>RESULT PROTOCOLO_OSIRIS_ACTIVADO</code> e imprime la alerta.</p>","files":[{"name":"i3_laconia.c","code":"/* i3_laconia.c — comando central: recibe alertas del hub */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 9002\n\nint main(void) {\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 5);\n    printf(\"[LACONIA] escuchando en %d\\n\", PORT);\n    fflush(stdout);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n//@TODO 1 | Atender ALERT NIVEL_3 y responder RESULT PROTOCOLO_OSIRIS_ACTIVADO\n        char buf[256];\n        int n, activas;\n        while ((n = recv(cli, buf, sizeof(buf) - 1, 0)) > 0) { //§\n            buf[n] = '\\0'; //§\n            if (sscanf(buf, \"ALERT NIVEL_3 %d\", &activas) == 1) { //§\n                time_t t = time(NULL);\n                printf(\"[LACONIA %.8s] ¡ALERTA NIVEL 3! %d gates activas\\n\", ctime(&t) + 11, activas); //§\n                fflush(stdout);\n                send(cli, \"RESULT PROTOCOLO_OSIRIS_ACTIVADO\\n\", 33, 0); //§\n            } else {\n                send(cli, \"RESULT ERROR\\n\", 13, 0);\n            }\n        }\n        close(cli);\n//@END\n    }\n}\n"},{"name":"i3_hub.c","code":"/* i3_hub.c — hub regional: fork por nodo + pipe hijos→padre para agregar estados */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <sys/select.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT_HUB 9001\n#define PORT_LACONIA 9002\n#define MAX_GATES 5\n\n/* Con fork() cada hijo tiene su propia memoria: el estado de TODAS las gates\n   lo guarda el padre, y los hijos le informan cada cambio por una pipe. */\ntypedef struct { char gate[32]; char estado[16]; } Cambio;   /* < PIPE_BUF: write atómico */\n\nCambio gates[MAX_GATES];\nint n_gates = 0;\nint alerta_enviada = 0;\n\n/* HIJO: lee GATE_STATUS del nodo y reenvía al padre */\nvoid atender_nodo(int fd, int pfd) {\n//@TODO 1 | Leer líneas del socket y avisar al padre; al desconectar, INACTIVA\n    FILE *in = fdopen(fd, \"r\");             /* fdopen también sirve para sockets */ //§\n    char linea[128];\n    Cambio c = { \"\", \"\" };\n    long ts;\n    while (fgets(linea, sizeof linea, in)) { //§\n        if (sscanf(linea, \"GATE_STATUS %31s %15s %ld\", c.gate, c.estado, &ts) == 3) //§\n            write(pfd, &c, sizeof c); //§\n    }\n    if (c.gate[0]) {                        /* el nodo se desconectó */ //§\n        strcpy(c.estado, \"INACTIVA\"); //§\n        write(pfd, &c, sizeof c); //§\n    }\n    fclose(in);\n//@END\n}\n\n/* PADRE: llamada a Laconia (stub RPC) */\nvoid alertar_laconia(int activas) {\n    int s = socket(AF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in l;\n    memset(&l, 0, sizeof l);\n    l.sin_family = AF_INET;\n    l.sin_port = htons(PORT_LACONIA);\n    inet_pton(AF_INET, \"127.0.0.1\", &l.sin_addr);\n    if (connect(s, (struct sockaddr *)&l, sizeof l) < 0) { perror(\"laconia\"); close(s); return; }\n    char msg[64], resp[96];\n    snprintf(msg, sizeof msg, \"ALERT NIVEL_3 %d gates activas\\n\", activas);\n    send(s, msg, strlen(msg), 0);\n    int n = recv(s, resp, sizeof(resp) - 1, 0);\n    if (n > 0) { resp[n] = '\\0'; printf(\"[HUB] Laconia responde: %s\", resp); }\n    close(s);\n}\n\n/* PADRE: actualizar tabla y decidir si alertar */\nvoid registrar(const Cambio *c) {\n//@TODO 2 | Agregación: último estado por gate; alerta al cruzar a >= 3 ACTIVA\n    int i;\n    for (i = 0; i < n_gates; i++) if (strcmp(gates[i].gate, c->gate) == 0) break; //§\n    if (i == n_gates) { if (n_gates == MAX_GATES) return; n_gates++; } //§\n    gates[i] = *c; //§\n    int activas = 0;\n    for (int k = 0; k < n_gates; k++) if (strcmp(gates[k].estado, \"ACTIVA\") == 0) activas++; //§\n    printf(\"[HUB] %s -> %s (activas: %d)\\n\", c->gate, c->estado, activas);\n    if (activas >= 3 && !alerta_enviada) {  /* solo al cruzar el umbral, no en cada mensaje */ //§\n        alertar_laconia(activas); //§\n        alerta_enviada = 1; //§\n    } else if (activas < 3) {\n        alerta_enviada = 0; //§\n    }\n    fflush(stdout);\n//@END\n}\n\nint main(void) {\n    int p[2];\n    pipe(p);\n    signal(SIGCHLD, SIG_IGN);\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT_HUB);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, MAX_GATES);\n    printf(\"[HUB] escuchando en %d\\n\", PORT_HUB);\n    fflush(stdout);\n//@TODO 3 | select() sobre el socket de escucha y la pipe de los hijos\n    while (1) {\n        fd_set rd;\n        FD_ZERO(&rd);\n        FD_SET(srv, &rd); //§\n        FD_SET(p[0], &rd); //§\n        select((srv > p[0] ? srv : p[0]) + 1, &rd, NULL, NULL, NULL); //§\n        if (FD_ISSET(srv, &rd)) {\n            int cli = accept(srv, NULL, NULL); //§\n            if (fork() == 0) { //§\n                close(srv); close(p[0]); //§\n                atender_nodo(cli, p[1]); //§\n                exit(0);\n            }\n            close(cli); //§\n        }\n        if (FD_ISSET(p[0], &rd)) {\n            Cambio c;\n            if (read(p[0], &c, sizeof c) == sizeof c) registrar(&c); //§\n        }\n    }\n//@END\n}\n"},{"name":"i3_nodo.c","code":"/* i3_nodo.c — una puerta del anillo: ./i3_nodo <nombre_gate> [ip_hub] */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT_HUB 9001\n#ifndef PERIODO\n#define PERIODO 3\n#endif\n#define EVENTOS 6\n\n/* Aleatorio con peso: ACTIVA es más probable */\nconst char *estado_aleatorio(void) {\n    int r = rand() % 100;\n    if (r < 20) return \"INACTIVA\";\n    if (r < 40) return \"EXPLORANDO\";\n    if (r < 85) return \"ACTIVA\";\n    return \"INESTABLE\";\n}\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) { fprintf(stderr, \"Uso: %s <nombre_gate> [ip_hub]\\n\", argv[0]); return 1; }\n    srand(time(NULL) ^ getpid());\n    int fd = socket(AF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in hub;\n    memset(&hub, 0, sizeof hub);\n    hub.sin_family = AF_INET;\n    hub.sin_port = htons(PORT_HUB);\n    inet_pton(AF_INET, argc > 2 ? argv[2] : \"127.0.0.1\", &hub.sin_addr);\n    if (connect(fd, (struct sockaddr *)&hub, sizeof hub) < 0) { perror(\"connect\"); return 1; }\n//@TODO 1 | Enviar \"GATE_STATUS <gate> <estado> <timestamp>\\n\" cada 3 s\n    for (int i = 0; i < EVENTOS; i++) {\n        char msg[96];\n        snprintf(msg, sizeof msg, \"GATE_STATUS %s %s %ld\\n\", argv[1], estado_aleatorio(), (long)time(NULL)); //§\n        send(fd, msg, strlen(msg), 0); //§\n        sleep(PERIODO); //§\n    }\n    close(fd);                  /* el hub marcará esta gate como INACTIVA */ //§\n//@END\n    return 0;\n}\n"}],"qs":[{"q":"El hub usa fork() por nodo, pero debe agregar el estado de TODAS las gates. ¿Cómo se resuelve?","a":"Los hijos no comparten memoria: si cada hijo guardara la tabla, ninguno vería las otras gates. La solución usa el patrón del Ej. 12 de Lamport: los hijos <b>informan cada cambio al padre por una pipe</b> (struct de tamaño fijo, write atómico) y el padre mantiene la tabla única y decide la alerta. El padre hace select() entre el socket de escucha y la pipe."},{"q":"¿Por qué alertar solo al cruzar el umbral y no en cada mensaje?","a":"Si 3 gates siguen activas, cada GATE_STATUS volvería a disparar la alerta e inundaría a Laconia. Con un flag que se activa al cruzar a ≥3 y se reinicia al bajar de 3, se envía una alerta por episodio."}],"hints":["Orden de ejecución: Laconia, luego el hub, luego los nodos.","fdopen(fd, \"r\") también funciona con sockets y permite usar fgets.","Al salir del loop de fgets, el nodo se desconectó: el hijo avisa INACTIVA."],"think":["Nodo: loop de EVENTOS con estado ponderado (rand() % 100 en rangos), send y sleep.","Hub (hijo): fgets sobre el socket → write de un Cambio{gate, estado} a la pipe; al terminar, Cambio INACTIVA.","Hub (padre): select(srv, pipe); al leer un Cambio, actualizar la tabla, contar ACTIVA y alertar si cruza 3 (stub: connect, send, recv).","Laconia: servidor iterativo que responde a ALERT NIVEL_3."],"errors":["Guardar el estado en los hijos del hub.","Enviar la alerta en cada mensaje mientras haya ≥3 activas."],"rubric":[{"pts":2,"t":"Nodo con estados ponderados y formato correcto"},{"pts":3,"t":"Hub: fork + pipe hacia el padre"},{"pts":2,"t":"Tabla de último estado + INACTIVA al desconectar"},{"pts":2,"t":"Alerta a Laconia al cruzar a ≥3"},{"pts":1,"t":"Laconia responde e imprime"}],"lang":"c","pruebas":{"compilar":[{"src":["i3_laconia.c"],"out":"i3_laconia"},{"src":["i3_hub.c"],"out":"i3_hub"},{"src":["i3_nodo.c"],"out":"i3_nodo"}],"pasos":[{"tipo":"python","nombre":"Hub (con nodos y Laconia simulados), tu Laconia y tu nodo","archivo":"prueba/i3.py","timeout":40}],"archivos":{"prueba/i3.py":"\"\"\"Simula Laconia y los nodos para probar tu hub; luego prueba tu Laconia y tu nodo por separado.\"\"\"\nimport socket, subprocess, threading, time\nfrom cognition_prueba import *\nalertas = []\ndef laconia_falsa():\n    srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); srv.bind((\"127.0.0.1\", 9002)); srv.listen(5); srv.settimeout(12)\n    try:\n        while True:\n            c, _ = srv.accept(); l = Linea(c); m = l.leer()\n            if m: alertas.append(m); l.enviar(\"RESULT PROTOCOLO_OSIRIS_ACTIVADO\\n\")\n            c.close()\n    except OSError: pass\n    srv.close()\nthreading.Thread(target=laconia_falsa, daemon=True).start(); time.sleep(0.3)\nhub = subprocess.Popen([\"./i3_hub\"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)\ntry:\n    nodos = [Linea(conectar(9001)) for _ in range(4)]\n    def estado(i, e): nodos[i].enviar(\"GATE_STATUS Gate-%d %s %d\\n\" % (i, e, int(time.time())))\n    estado(0, \"ACTIVA\"); estado(1, \"ACTIVA\"); estado(2, \"EXPLORANDO\"); time.sleep(0.6)\n    check(not alertas, \"Con 2 gates activas no hay alerta\", \"Alertó con solo 2 gates activas: %s\" % alertas)\n    estado(2, \"ACTIVA\"); time.sleep(0.8)\n    check(len(alertas) == 1 and \"NIVEL_3\" in alertas[0] and \"3\" in alertas[0], \"Con 3 gates activas el hub alerta a Laconia: %s\" % (alertas[:1]), \"Con 3 gates activas esperaba 1 alerta 'ALERT NIVEL_3 3 ...', recibí %s\" % alertas)\n    estado(3, \"ACTIVA\"); estado(0, \"ACTIVA\"); time.sleep(0.8)\n    check(len(alertas) == 1, \"No repite la alerta mientras siga sobre el umbral\", \"Repitió la alerta (%d alertas): debería alertar solo al cruzar el umbral\" % len(alertas))\n    nodos[0].s.close(); nodos[3].s.close(); time.sleep(0.8)\n    estado(2, \"ACTIVA\"); time.sleep(0.4)\n    nodos += [Linea(conectar(9001)), Linea(conectar(9001))]\n    nodos[4].enviar(\"GATE_STATUS Gate-9 ACTIVA 1\\n\"); time.sleep(0.8)\n    check(len(alertas) == 2, \"Al desconectarse nodos su gate pasa a INACTIVA y la alerta vuelve a dispararse al recuperar 3\", \"Tras desconectar 2 nodos y volver a 3 activas esperaba una nueva alerta (total 2), hubo %d\" % len(alertas))\nfinally:\n    import os, signal\n    os.killpg(hub.pid, signal.SIGKILL)\ntime.sleep(0.5)\nlac = subprocess.Popen([\"./i3_laconia\"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)\ntry:\n    c = Linea(conectar(9002)); c.enviar(\"ALERT NIVEL_3 3 gates activas\\n\"); r = c.leer()\n    check(r == \"RESULT PROTOCOLO_OSIRIS_ACTIVADO\", \"Tu Laconia responde RESULT PROTOCOLO_OSIRIS_ACTIVADO\", \"Tu Laconia respondió %r\" % r)\nfinally:\n    import os, signal\n    os.killpg(lac.pid, signal.SIGKILL)\nsrv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); srv.bind((\"127.0.0.1\", 9001)); srv.listen(1); srv.settimeout(5)\nnodo = subprocess.Popen([\"./i3_nodo\", \"Gate-X\"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)\ntry:\n    c, _ = srv.accept(); l = Linea(c); m = l.leer(timeout=4)\n    partes = (m or \"\").split()\n    check(len(partes) == 4 and partes[0] == \"GATE_STATUS\" and partes[1] == \"Gate-X\" and partes[2] in (\"INACTIVA\", \"EXPLORANDO\", \"ACTIVA\", \"INESTABLE\") and partes[3].isdigit(),\n          \"Tu nodo envía 'GATE_STATUS <gate> <estado> <timestamp>'\", \"Tu nodo envió %r\" % m)\nexcept socket.timeout:\n    falla(\"Tu nodo no se conectó al hub (puerto 9001)\")\nfinally:\n    import os, signal\n    os.killpg(nodo.pid, signal.SIGKILL); srv.close()\nterminar()\n"}}},{"id":"X1","group":"extra","n":"Extra 1","topic":"fallos","lvl":1,"min":6,"title":"Quórum y split-brain","statement":"<p>Un clúster usa <b>quórum = mayoría</b> para evitar split-brain. Implementa:</p>\n <ul><li><code>bool has_quorum(int alive, int cluster_size)</code></li>\n <li><code>int max_failures(int cluster_size)</code>: cuántos nodos pueden caer y aún haber quórum.</li>\n <li><code>int side_with_quorum(int size_a, int size_b)</code>: ante una partición en dos lados, retorna 0 si opera A, 1 si opera B, -1 si ninguno.</li></ul>","files":[{"name":"quorum.c","code":"/* Quórum y split-brain */\n#include <stdio.h>\n#include <stdbool.h>\n\nbool has_quorum(int alive, int cluster_size) {\n//@TODO 1 | Implementar has_quorum\n    return alive >= cluster_size / 2 + 1; //§\n//@END\n}\n\nint max_failures(int cluster_size) {\n//@TODO 2 | Implementar max_failures\n    return cluster_size - (cluster_size / 2 + 1); //§\n//@END\n}\n\nint side_with_quorum(int size_a, int size_b) {\n//@TODO 3 | Implementar side_with_quorum\n    int total = size_a + size_b;\n    if (has_quorum(size_a, total)) return 0; //§\n    if (has_quorum(size_b, total)) return 1; //§\n    return -1; //§\n//@END\n}\n\nint main(void) {\n    printf(\"%d\\n\", has_quorum(3, 5));\n    printf(\"%d\\n\", max_failures(5));\n    printf(\"%d\\n\", side_with_quorum(3, 2));\n    printf(\"%d\\n\", side_with_quorum(2, 2));\n    return 0;\n}\n"}],"out":"1\n2\n0\n-1","hints":["Quórum = (N/2) + 1 con división entera.","Máximo de fallos = N menos el quórum.","En la partición, el total es la suma de los dos lados y cada lado se compara contra ese total, no contra su propio tamaño."],"think":["N=5 → quórum 3. Con 3 vivos opera; con 2, no.","Fallos tolerados con N=5: 5−3 = 2.","Partición 3|2: A tiene 3 ≥ 3, opera. Partición 2|2 con N=4: quórum 3, nadie lo alcanza → ninguno opera (por eso se prefieren números impares).","Reutiliza has_quorum en side_with_quorum en vez de repetir la fórmula."],"errors":["Usar alive > N/2 con N par (da resultados sutilmente distintos); usa la fórmula N/2+1.","Comparar cada lado contra su propio tamaño en vez del total."],"rubric":[{"pts":3,"t":"has_quorum correcto"},{"pts":3,"t":"max_failures correcto"},{"pts":3,"t":"side_with_quorum usa el total y cubre los tres casos"},{"pts":1,"t":"Salida predicha: 1, 2, 0, -1"}],"lang":"c","pruebas":{"compilar":[{"src":["quorum.c"],"out":"quorum"}],"pasos":[{"tipo":"ejecutar","nombre":"Tu programa produce la salida esperada","cmd":"./quorum","espera":{"salida":"1\n2\n0\n-1"}}],"archivos":{}}},{"id":"X2","group":"extra","n":"Extra 2","topic":"consistencia","lvl":2,"min":12,"title":"Escritura y lectura con quórum","statement":"<p>Un KV store tiene 3 réplicas (<code>NREP</code>) y usa quórum con <code>W=2</code> y <code>R=2</code>. Implementa:</p>\n <ul><li><code>bool put_quorum(const char *key, const char *value)</code>: escribe en réplicas hasta lograr W acks.</li>\n <li><code>bool get_quorum(const char *key, KVPair *result)</code>: lee de R réplicas alcanzables y devuelve el valor con mayor <code>version</code>.</li></ul>\n <p>Pregunta: ¿por qué con W=2, R=2, N=3 una lectura siempre ve la última escritura?</p>","files":[{"name":"kv_quorum.c","code":"/* Escritura y lectura con quórum */\n#include <stdbool.h>\n#include <string.h>\n\n#define NREP 3\n#define W 2\n#define R 2\n\ntypedef struct {\n    char key[64];\n    char value[256];\n    int version;\n} KVPair;\n\n/* Ya implementadas (no las modifiques): */\nbool send_write(int replica, const char *key, const char *value);        /* true = ack */\nbool read_from_replica(int replica, const char *key, KVPair *out);       /* true = respondió */\n\nbool put_quorum(const char *key, const char *value) {\n//@TODO 1 | Implementar put_quorum\n    int acks = 0;\n    for (int i = 0; i < NREP; i++) {\n        if (send_write(i, key, value)) acks++; //§\n        if (acks >= W) return true; //§\n    }\n    return false;\n//@END\n}\n\nbool get_quorum(const char *key, KVPair *result) {\n//@TODO 2 | Implementar get_quorum\n    int count = 0;\n    KVPair latest;\n    memset(&latest, 0, sizeof(latest));\n    for (int i = 0; i < NREP && count < R; i++) {\n        KVPair tmp;\n        if (!read_from_replica(i, key, &tmp)) continue; //§\n        if (count == 0 || tmp.version > latest.version) latest = tmp; //§\n        count++; //§\n    }\n    if (count < R) return false; //§\n    *result = latest;\n    return true;\n//@END\n}\n\n"}],"hints":["put: cuenta acks y corta apenas llegas a W. get: cuenta lecturas exitosas y compara versiones.","En get, una réplica caída (read_from_replica = false) no cuenta: usa continue.","Si al terminar el for count < R, no hubo quórum de lectura → false."],"think":["put_quorum: for sobre las réplicas, acumulando acks; return true al alcanzar W; si el for termina, false.","get_quorum: guarda el mejor candidato por version. La primera lectura exitosa inicializa latest (count == 0).","Teoría: W + R > N (2+2 > 3). Todo conjunto de 2 réplicas se solapa con cualquier otro de 2 → al menos una réplica leída tiene la última escritura, y la version la identifica."],"errors":["Contar acks de réplicas caídas.","No distinguir \"réplica caída\" de \"valor vacío\".","Devolver el primer valor leído sin comparar versiones."],"rubric":[{"pts":2,"t":"put: recorre réplicas y cuenta acks"},{"pts":2,"t":"put: retorna true al llegar a W y false si no"},{"pts":3,"t":"get: ignora réplicas que no responden"},{"pts":3,"t":"get: se queda con la mayor version"},{"pts":2,"t":"get: verifica count >= R antes de entregar"},{"pts":2,"t":"Explica W + R > N (intersección de quórums)"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x2.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x2.c":"/* Prueba del Extra 2: réplicas simuladas */\n#include <stdio.h>\n#include \"../kv_quorum.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nint vivo[NREP] = {1, 1, 1}, escrituras = 0;\nKVPair datos[NREP];\nbool send_write(int r, const char *key, const char *value) {\n    if (!vivo[r]) return false;\n    escrituras++;\n    strcpy(datos[r].key, key); strcpy(datos[r].value, value); datos[r].version++;\n    return true;\n}\nbool read_from_replica(int r, const char *key, KVPair *out) {\n    (void)key;\n    if (!vivo[r]) return false;\n    *out = datos[r];\n    return true;\n}\nint main(void) {\n    KVPair k;\n    CHECK(put_quorum(\"x\", \"1\"), \"Con las 3 réplicas vivas la escritura tiene quórum\");\n    CHECK(escrituras == 2, \"Corta apenas logra W=2 acks (no escribe de más)\");\n    vivo[0] = 0;\n    CHECK(put_quorum(\"x\", \"2\"), \"Con 1 réplica caída todavía hay quórum de escritura\");\n    vivo[1] = 0;\n    CHECK(!put_quorum(\"x\", \"3\"), \"Con 2 réplicas caídas NO hay quórum: retorna false\");\n    vivo[0] = vivo[1] = 1;\n    datos[0].version = 5; strcpy(datos[0].value, \"nuevo\");\n    datos[1].version = 2; strcpy(datos[1].value, \"viejo\");\n    CHECK(get_quorum(\"x\", &k) && strcmp(k.value, \"nuevo\") == 0, \"La lectura entrega el valor con mayor version\");\n    vivo[0] = 0; datos[2].version = 9; strcpy(datos[2].value, \"ultimo\");\n    CHECK(get_quorum(\"x\", &k) && strcmp(k.value, \"ultimo\") == 0, \"Si una réplica no responde, lee de las otras\");\n    vivo[1] = 0;\n    CHECK(!get_quorum(\"x\", &k), \"Con una sola réplica viva no hay quórum de lectura (R=2)\");\n    return 0;\n}\n"}}},{"id":"X3","group":"extra","n":"Extra 3","topic":"cap","lvl":2,"min":10,"title":"Coordinador de Two-Phase Commit","statement":"<p>Implementa el coordinador de <b>2PC</b>: <code>bool two_phase_commit(const char *key, const char *value)</code>.</p>\n <p><b>Fase 1 (PREPARE):</b> pregunta a todas las réplicas. <b>Fase 2:</b> si todas votaron YES, ordena COMMIT; si no, ABORT. Retorna si se confirmó.</p>\n <p>Pregunta: ¿qué pasa si una réplica no responde en la fase 1? ¿Por qué 2PC sacrifica disponibilidad?</p>","files":[{"name":"two_phase_commit.c","code":"/* Coordinador de Two-Phase Commit */\n#include <stdbool.h>\n\n#define N_REPLICAS 3\n\ntypedef enum { NO = 0, YES = 1 } Voto;\n\n/* Ya implementadas: */\nVoto send_prepare(int replica, const char *key, const char *value);\nvoid send_commit(int replica, const char *key, const char *value);\nvoid send_abort(int replica);\n\nbool two_phase_commit(const char *key, const char *value) {\n//@TODO 1 | Implementar two_phase_commit\n    int votes_yes = 0;\n    \n    /* FASE 1: PREPARE */\n    for (int i = 0; i < N_REPLICAS; i++) {\n        if (send_prepare(i, key, value) == YES) votes_yes++; //§\n    }\n    \n    /* FASE 2: COMMIT o ABORT */\n    if (votes_yes == N_REPLICAS) { //§\n        for (int i = 0; i < N_REPLICAS; i++) send_commit(i, key, value); //§\n        return true; //§\n    }\n    for (int i = 0; i < N_REPLICAS; i++) send_abort(i); //§\n    return false; //§\n//@END\n}\n\n"}],"hints":["Dos bucles de red: uno para preguntar (prepare) y otro para ejecutar la decisión.","COMMIT solo si votes_yes == N_REPLICAS (unanimidad, no mayoría).","Si no hay unanimidad, el camino es ABORT a todas."],"think":["Cuenta los YES en la fase 1.","Decisión: todos YES → commit a todas y true. Cualquier otro caso → abort a todas y false.","Teoría: si una réplica no responde, se cuenta como NO (o el coordinador queda esperando) y se aborta. 2PC exige unanimidad: una sola réplica caída bloquea o aborta toda escritura → elige consistencia sobre disponibilidad (CP)."],"errors":["Usar mayoría en vez de unanimidad.","Enviar commit solo a quienes votaron YES.","Olvidar el abort a las réplicas cuando falla."],"rubric":[{"pts":3,"t":"Fase 1 envía prepare a todas y cuenta YES"},{"pts":3,"t":"Commit solo con unanimidad"},{"pts":2,"t":"Abort a todas en caso contrario"},{"pts":1,"t":"Retorna true/false según corresponda"},{"pts":3,"t":"Explica por qué 2PC sacrifica disponibilidad"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x3.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x3.c":"/* Prueba del Extra 3: participantes simulados */\n#include <stdio.h>\n#include \"../two_phase_commit.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nVoto voto[N_REPLICAS];\nint prepares, commits, aborts;\nVoto send_prepare(int r, const char *k, const char *v) { (void)k; (void)v; prepares++; return voto[r]; }\nvoid send_commit(int r, const char *k, const char *v) { (void)r; (void)k; (void)v; commits++; }\nvoid send_abort(int r) { (void)r; aborts++; }\nvoid reset(Voto a, Voto b, Voto c) { voto[0] = a; voto[1] = b; voto[2] = c; prepares = commits = aborts = 0; }\nint main(void) {\n    reset(YES, YES, YES);\n    bool r = two_phase_commit(\"x\", \"10\");\n    CHECK(r && prepares == 3, \"Fase 1: pregunta a las 3 réplicas\");\n    CHECK(commits == 3 && aborts == 0, \"Todos votan YES: COMMIT a las 3 y ningún ABORT\");\n    reset(YES, NO, YES);\n    r = two_phase_commit(\"x\", \"10\");\n    CHECK(!r && commits == 0 && aborts == 3, \"Un solo NO: ABORT a todas (unanimidad, no mayoría)\");\n    reset(NO, NO, NO);\n    r = two_phase_commit(\"x\", \"10\");\n    CHECK(!r && aborts == 3, \"Todos NO: ABORT y retorna false\");\n    return 0;\n}\n"}}},{"id":"X4","group":"extra","n":"Extra 4","topic":"fallos","lvl":2,"min":12,"title":"Monitor de heartbeats","statement":"<p>Cada nodo envía heartbeats. Implementa en el monitor:</p>\n <ul><li><code>void on_heartbeat(int node_id)</code>: registra el instante y, si el nodo estaba marcado como caído, lo revive avisando a <code>handle_node_recovery</code>.</li>\n <li><code>void check_nodes(int num_nodes)</code>: marca como caído a todo nodo vivo que lleve más de <code>TIMEOUT</code> segundos sin heartbeat, imprime <code>Node %d detected as DOWN (timeout: %ds)</code> y llama a <code>handle_node_failure</code>.</li></ul>\n <p>Pregunta: ¿qué problema trae un timeout muy corto? ¿y uno muy largo?</p>","files":[{"name":"heartbeats.c","code":"/* Monitor de heartbeats */\n#include <stdio.h>\n#include <stdbool.h>\n#include <time.h>\n\n#define MAX_NODES 8\n#define TIMEOUT 3\n\ntypedef struct {\n    int node_id;\n    time_t last_heartbeat;\n    bool is_alive;\n} NodeStatus;\n\nNodeStatus nodes[MAX_NODES];\n\nvoid handle_node_failure(int id);     /* ya implementadas */\nvoid handle_node_recovery(int id);\n\nvoid on_heartbeat(int node_id) {\n//@TODO 1 | Implementar on_heartbeat\n    nodes[node_id].last_heartbeat = time(NULL); //§\n    if (!nodes[node_id].is_alive) { //§\n        nodes[node_id].is_alive = true; //§\n        handle_node_recovery(node_id); //§\n    }\n//@END\n}\n\nvoid check_nodes(int num_nodes) {\n//@TODO 2 | Implementar check_nodes\n    time_t now = time(NULL);\n    for (int i = 0; i < num_nodes; i++) {\n        int silence = (int)(now - nodes[i].last_heartbeat); //§\n        if (silence > TIMEOUT && nodes[i].is_alive) { //§\n            nodes[i].is_alive = false; //§\n            printf(\"Node %d detected as DOWN (timeout: %ds)\\n\", i, silence); //§\n            handle_node_failure(i); //§\n        }\n    }\n//@END\n}\n\n"}],"hints":["on_heartbeat siempre actualiza last_heartbeat; la recuperación es un extra condicional.","check_nodes: calcula cuánto silencio lleva cada nodo restando tiempos con time().","Evita avisar de la caída varias veces: solo si is_alive es true y recién ahí lo pones en false."],"think":["Heartbeat recibido → la hora actual es el nuevo last_heartbeat. Si estaba caído, revive.","En el monitor: now − last_heartbeat es el silencio. Si supera TIMEOUT y el nodo figuraba vivo → falla detectada una sola vez.","Teoría: timeout corto = detección rápida pero falsos positivos (un nodo lento parece muerto). Timeout largo = pocos falsos positivos pero detección tardía. No se puede distinguir nodo caído, lento o red particionada."],"errors":["Marcar caído sin comprobar is_alive (spam de alertas).","Olvidar actualizar last_heartbeat al revivir.","Usar >= en vez de > cuando el enunciado dice \"más de\"."],"rubric":[{"pts":2,"t":"on_heartbeat actualiza last_heartbeat"},{"pts":3,"t":"on_heartbeat detecta y gestiona la recuperación"},{"pts":2,"t":"check_nodes calcula el silencio"},{"pts":3,"t":"check_nodes evita notificar dos veces (is_alive)"},{"pts":2,"t":"Marca caído, imprime y llama a handle_node_failure"},{"pts":2,"t":"Trade-off de timeouts explicado"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x4.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x4.c":"/* Prueba del Extra 4: heartbeats con relojes manipulados */\n#include <stdio.h>\n#include \"../heartbeats.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nint fallas_avisadas[MAX_NODES], recuperaciones[MAX_NODES];\nvoid handle_node_failure(int id) { fallas_avisadas[id]++; }\nvoid handle_node_recovery(int id) { recuperaciones[id]++; }\nint main(void) {\n    time_t ahora = time(NULL);\n    for (int i = 0; i < 3; i++) { nodes[i].node_id = i; nodes[i].is_alive = true; nodes[i].last_heartbeat = ahora; }\n    nodes[1].last_heartbeat = ahora - 10;           /* nodo 1 lleva 10 s sin heartbeat */\n    nodes[2].last_heartbeat = ahora - 2;            /* nodo 2 solo 2 s */\n    check_nodes(3);\n    CHECK(!nodes[1].is_alive && fallas_avisadas[1] == 1, \"Detecta como caído al nodo con 10 s de silencio\");\n    CHECK(nodes[0].is_alive && nodes[2].is_alive, \"No marca a nodos dentro del timeout\");\n    check_nodes(3);\n    CHECK(fallas_avisadas[1] == 1, \"No vuelve a avisar la misma caída\");\n    on_heartbeat(1);\n    CHECK(nodes[1].is_alive && recuperaciones[1] == 1, \"Un heartbeat revive al nodo y avisa la recuperación\");\n    CHECK(nodes[1].last_heartbeat >= ahora, \"on_heartbeat actualiza last_heartbeat\");\n    on_heartbeat(0);\n    CHECK(recuperaciones[0] == 0, \"Un heartbeat de un nodo vivo no cuenta como recuperación\");\n    return 0;\n}\n"}}},{"id":"X5","group":"extra","n":"Extra 5","topic":"raft","lvl":3,"min":15,"title":"Raft: otorgar o negar un voto","statement":"<p>Implementa <code>bool on_request_vote(RaftNode *n, const RequestVoteArgs *args)</code> con las reglas de Raft:</p>\n <ol><li>Si el term del candidato es menor al actual, rechaza.</li><li>Si el term es mayor, el nodo actualiza su term, olvida su voto y pasa a FOLLOWER.</li>\n <li>Solo un voto por term: rechaza si ya votó por otro.</li><li>El log del candidato debe estar al menos tan actualizado (compara último term; si empatan, último índice).</li></ol>\n <p>Si concede el voto, registra <code>voted_for</code>.</p>","files":[{"name":"raft_voto.c","code":"/* Raft: otorgar o negar un voto */\n#include <stdbool.h>\n\ntypedef enum { FOLLOWER, CANDIDATE, LEADER } RaftState;\n\ntypedef struct {\n    RaftState state;\n    int current_term;\n    int voted_for;        /* -1 = aún no vota en este term */\n    int last_log_index;\n    int last_log_term;\n} RaftNode;\n\ntypedef struct {\n    int term;\n    int candidate_id;\n    int last_log_index;\n    int last_log_term;\n} RequestVoteArgs;\n\nbool on_request_vote(RaftNode *n, const RequestVoteArgs *args) {\n//@TODO 1 | Implementar on_request_vote\n    if (args->term < n->current_term) return false; //§\n    if (args->term > n->current_term) { //§\n        n->current_term = args->term; //§\n        n->voted_for = -1; //§\n        n->state = FOLLOWER; //§\n    }\n    if (n->voted_for != -1 && n->voted_for != args->candidate_id) return false; //§\n    /* el log del candidato debe estar al menos tan actualizado */\n    if (args->last_log_term < n->last_log_term) return false; //§\n    if (args->last_log_term == n->last_log_term && args->last_log_index < n->last_log_index) return false; //§\n    n->voted_for = args->candidate_id; //§\n    return true; //§\n//@END\n}\n\n"}],"hints":["Ordena las reglas como filtros: cada if descarta un caso y retorna false.","Cuando el term del candidato es mayor, primero actualizas tu estado y recién después evalúas el resto.","\"Log más actualizado\": primero gana el mayor último term; si hay empate de term, gana el mayor índice."],"think":["Regla 1: term menor → false inmediato.","Regla 2: term mayor → te actualizas (current_term, voted_for = -1, FOLLOWER) y sigues evaluando.","Regla 3: voto único por term; si ya votaste por el mismo candidato sigue siendo válido (reintentos).","Regla 4: compara logs. Esto garantiza Leader Completeness: un candidato con log desactualizado no puede ganar.","Si todo pasa: voted_for = candidate_id y true."],"errors":["Comparar solo last_log_index ignorando el term.","No resetear voted_for al ver un term mayor (quedas \"ya votó\" en un term nuevo).","Rechazar al mismo candidato que reintenta."],"rubric":[{"pts":2,"t":"Rechaza si args->term < current_term"},{"pts":3,"t":"Actualiza term, voted_for y estado ante term mayor"},{"pts":3,"t":"Un voto por term (acepta reintento del mismo candidato)"},{"pts":4,"t":"Compara último term y desempata por índice"},{"pts":2,"t":"Registra voted_for y retorna true"},{"pts":2,"t":"Orden lógico de las reglas"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x5.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x5.c":"/* Prueba del Extra 5: casos de RequestVote */\n#include <stdio.h>\n#include \"../raft_voto.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nRaftNode nodo(int term, int voted, int li, int lt) { RaftNode n = { FOLLOWER, term, voted, li, lt }; return n; }\nRequestVoteArgs pide(int term, int cand, int li, int lt) { RequestVoteArgs a = { term, cand, li, lt }; return a; }\nint main(void) {\n    RaftNode n; RequestVoteArgs a;\n    n = nodo(5, -1, 4, 3); a = pide(4, 2, 9, 3);\n    CHECK(!on_request_vote(&n, &a), \"Rechaza a un candidato con term menor\");\n    n = nodo(5, -1, 4, 3); a = pide(5, 2, 4, 3);\n    CHECK(on_request_vote(&n, &a) && n.voted_for == 2, \"Concede si no ha votado y el log está igual de actualizado; registra voted_for\");\n    a = pide(5, 3, 4, 3);\n    CHECK(!on_request_vote(&n, &a), \"Un voto por term: rechaza a otro candidato en el mismo term\");\n    a = pide(5, 2, 4, 3);\n    CHECK(on_request_vote(&n, &a), \"Acepta el reintento del mismo candidato\");\n    n = nodo(5, 1, 4, 3); a = pide(6, 2, 4, 3);\n    CHECK(on_request_vote(&n, &a) && n.current_term == 6 && n.voted_for == 2, \"Term mayor: actualiza su term, olvida el voto anterior y vota\");\n    n = nodo(5, -1, 4, 3); n.state = LEADER; a = pide(6, 2, 1, 2);\n    CHECK(!on_request_vote(&n, &a) && n.current_term == 6 && n.state == FOLLOWER, \"Term mayor pero log viejo: se vuelve FOLLOWER y actualiza term, pero NO vota\");\n    n = nodo(5, -1, 7, 3); a = pide(5, 2, 6, 3);\n    CHECK(!on_request_vote(&n, &a), \"Mismo último term pero log más corto: rechaza\");\n    n = nodo(5, -1, 7, 3); a = pide(5, 2, 2, 4);\n    CHECK(on_request_vote(&n, &a), \"Último term mayor gana aunque el log sea más corto\");\n    return 0;\n}\n"}}},{"id":"X6","group":"extra","n":"Extra 6","topic":"raft","lvl":3,"min":15,"title":"Raft: consistency check de AppendEntries","statement":"<p>El log de Raft usa índices desde 1; <code>log[0]</code> es un centinela con term 0. Implementa:</p>\n <ul><li><code>bool log_matches(const RaftNode *n, int prev_log_index, int prev_log_term)</code></li>\n <li><code>bool on_append_entries(RaftNode *n, const AppendEntriesArgs *args)</code>: rechaza si el term del líder es viejo o si el log no coincide; si coincide, escribe las entradas desde <code>prev_log_index + 1</code> (sobrescribiendo lo que haya) y avanza el <code>commit_index</code> sin pasarse de su último índice.</li></ul>\n <p>(Versión simplificada del curso.) Pregunta: ¿qué dice la Log Matching Property?</p>","files":[{"name":"raft_append.c","code":"/* Raft: consistency check de AppendEntries */\n#include <stdbool.h>\n\n#define MAX_LOG 128\n\ntypedef struct { int term; int cmd; } LogEntry;\n\ntypedef struct {\n    int current_term;\n    LogEntry log[MAX_LOG];   /* log[0] = centinela (term 0) */\n    int last_log_index;\n    int commit_index;\n} RaftNode;\n\ntypedef struct {\n    int term;\n    int prev_log_index;\n    int prev_log_term;\n    int n_entries;\n    LogEntry entries[8];\n    int leader_commit;\n} AppendEntriesArgs;\n\nbool log_matches(const RaftNode *n, int prev_log_index, int prev_log_term) {\n//@TODO 1 | Implementar log_matches\n    if (prev_log_index > n->last_log_index) return false; //§\n    return n->log[prev_log_index].term == prev_log_term; //§\n//@END\n}\n\nbool on_append_entries(RaftNode *n, const AppendEntriesArgs *args) {\n//@TODO 2 | Implementar on_append_entries\n    if (args->term < n->current_term) return false; //§\n    n->current_term = args->term;\n    \n    if (!log_matches(n, args->prev_log_index, args->prev_log_term)) return false; //§\n    \n    for (int k = 0; k < args->n_entries; k++) {\n        int idx = args->prev_log_index + 1 + k; //§\n        n->log[idx] = args->entries[k]; //§\n        n->last_log_index = idx; //§\n    }\n    \n    if (args->leader_commit > n->commit_index) { //§\n        n->commit_index = args->leader_commit < n->last_log_index ? args->leader_commit : n->last_log_index; //§\n    }\n    return true;\n//@END\n}\n\n"}],"hints":["log_matches responde: ¿tengo esa entrada previa y su term es el que dice el líder?","Primero comprueba que el índice exista (no pases el último índice) y recién después mira log[idx].term.","commit_index = min(leader_commit, último índice propio)."],"think":["Consistency check: si no tengo la entrada prev_log_index, o su term difiere, rechazo (el líder retrocederá y reintentará).","Con el centinela, prev_log_index = 0 siempre coincide (term 0 = 0).","Al aceptar, las entradas nuevas se escriben desde prev_log_index+1; lo conflictivo se sobrescribe.","Log Matching: si dos logs tienen una entrada con el mismo índice y term, entonces tienen el mismo comando y todas las entradas anteriores son idénticas."],"errors":["Leer log[prev_log_index] antes de comprobar que existe.","Usar max en vez de min para el commit_index.","Escribir las entradas desde prev_log_index en vez de prev_log_index + 1."],"rubric":[{"pts":3,"t":"log_matches comprueba existencia del índice"},{"pts":2,"t":"log_matches compara el term"},{"pts":2,"t":"Rechaza term viejo y actualiza current_term"},{"pts":3,"t":"Rechaza si no hay coincidencia"},{"pts":3,"t":"Escribe entradas desde prev_log_index+1 y actualiza last_log_index"},{"pts":1,"t":"commit_index = min(leader_commit, último índice)"},{"pts":2,"t":"Enuncia la Log Matching Property"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x6.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x6.c":"/* Prueba del Extra 6: AppendEntries */\n#include <stdio.h>\n#include <string.h>\n#include \"../raft_append.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nvoid cargar(RaftNode *n, const int *terms, int k, int term_actual) {\n    memset(n, 0, sizeof *n); n->current_term = term_actual;\n    for (int i = 1; i <= k; i++) { n->log[i].term = terms[i - 1]; n->log[i].cmd = 100 + i; }\n    n->last_log_index = k;\n}\nint main(void) {\n    RaftNode n; AppendEntriesArgs a;\n    int f[] = {1, 1, 2};                     /* follower: índices 1..3 con terms 1,1,2 */\n    cargar(&n, f, 3, 2);\n    CHECK(log_matches(&n, 0, 0), \"prev_log_index 0 (centinela) siempre coincide\");\n    CHECK(log_matches(&n, 2, 1), \"Coincide si log[2].term == 1\");\n    CHECK(!log_matches(&n, 3, 3), \"No coincide si el term difiere\");\n    CHECK(!log_matches(&n, 5, 1), \"No coincide si el follower no tiene esa entrada (índice fuera)\");\n    memset(&a, 0, sizeof a); a.term = 1;\n    CHECK(!on_append_entries(&n, &a), \"Rechaza un AppendEntries de un líder con term viejo\");\n    memset(&a, 0, sizeof a); a.term = 3; a.prev_log_index = 2; a.prev_log_term = 1;\n    a.n_entries = 2; a.entries[0].term = 3; a.entries[0].cmd = 7; a.entries[1].term = 3; a.entries[1].cmd = 8; a.leader_commit = 10;\n    CHECK(on_append_entries(&n, &a), \"Acepta cuando prev coincide\");\n    CHECK(n.log[3].term == 3 && n.log[3].cmd == 7 && n.log[4].cmd == 8, \"Escribe desde prev_log_index + 1, sobrescribiendo el conflicto\");\n    CHECK(n.last_log_index == 4, \"Actualiza last_log_index\");\n    CHECK(n.commit_index == 4, \"commit_index = min(leader_commit, último índice)\");\n    CHECK(n.current_term == 3, \"Adopta el term del líder\");\n    memset(&a, 0, sizeof a); a.term = 3; a.prev_log_index = 4; a.prev_log_term = 2;\n    CHECK(!on_append_entries(&n, &a), \"Rechaza si el term en prev_log_index no coincide (el líder retrocederá)\");\n    return 0;\n}\n"}}},{"id":"X7","group":"extra","n":"Extra 7","topic":"raft","lvl":3,"min":12,"title":"Raft: iniciar y ganar una elección","statement":"<p>Implementa los dos pasos de una elección en el candidato:</p>\n <ul><li><code>void on_election_timeout(RaftNode *n)</code>: incrementa el term, se vuelve CANDIDATE, vota por sí mismo, reinicia su timeout y pide votos a todos los demás.</li>\n <li><code>void on_request_vote_reply(RaftNode *n, const RequestVoteReply *r)</code>: si sigue siendo candidato y obtiene <b>mayoría</b> de votos, se convierte en LEADER y envía heartbeats.</li></ul>\n <p>Pregunta: ¿por qué los timeouts de elección son aleatorios?</p>","files":[{"name":"raft_eleccion.c","code":"/* Raft: iniciar y ganar una elección */\n#include <stdbool.h>\n\n#define CLUSTER_SIZE 5\n\ntypedef enum { FOLLOWER, CANDIDATE, LEADER } RaftState;\n\ntypedef struct {\n    RaftState state;\n    int id;\n    int current_term;\n    int voted_for;\n    int votes_received;\n} RaftNode;\n\ntypedef struct { int term; bool vote_granted; } RequestVoteReply;\n\n/* Ya implementadas: */\nvoid send_request_vote(int dest, int term, int candidate_id);\nvoid send_heartbeats_to_all(void);\nvoid reset_election_timeout(void);\n\nvoid on_election_timeout(RaftNode *n) {\n//@TODO 1 | Implementar on_election_timeout\n    n->current_term++; //§\n    n->state = CANDIDATE; //§\n    n->voted_for = n->id; //§\n    n->votes_received = 1; //§\n    reset_election_timeout();\n    for (int dest = 0; dest < CLUSTER_SIZE; dest++) {\n        if (dest != n->id) send_request_vote(dest, n->current_term, n->id); //§\n    }\n//@END\n}\n\nvoid on_request_vote_reply(RaftNode *n, const RequestVoteReply *r) {\n//@TODO 2 | Implementar on_request_vote_reply\n    if (n->state != CANDIDATE) return; //§\n    if (r->vote_granted) n->votes_received++; //§\n    if (n->votes_received > CLUSTER_SIZE / 2) { //§\n        n->state = LEADER; //§\n        send_heartbeats_to_all(); //§\n    }\n//@END\n}\n\n"}],"hints":["Los 5 pasos de la elección están en orden en el enunciado: term, estado, voto propio, timeout, pedir votos.","No te pidas el voto a ti mismo: ya votaste (votes_received empieza en 1).","Mayoría estricta: votos > CLUSTER_SIZE / 2."],"think":["Timeout: term++ → CANDIDATE → votas por ti (voted_for = id, votes = 1) → reinicias timer → RequestVote a los demás.","Respuesta: si ya no eres candidato (otro líder apareció) ignora. Si te dan el voto, suma. Con mayoría pasas a LEADER y mandas heartbeats de inmediato para imponer autoridad.","Timeouts aleatorios (ej. 150-300 ms): reducen la probabilidad de que dos followers se vuelvan candidatos a la vez y repitan el split vote para siempre."],"errors":["Empezar votes_received en 0 (olvidar el voto propio).","Usar >= CLUSTER_SIZE / 2 (con 5 nodos 2 votos no es mayoría).","Enviar RequestVote a sí mismo."],"rubric":[{"pts":3,"t":"Incrementa term y pasa a CANDIDATE"},{"pts":2,"t":"Vota por sí mismo (votes_received = 1)"},{"pts":2,"t":"Pide votos a todos los demás"},{"pts":2,"t":"Ignora respuestas si ya no es candidato"},{"pts":3,"t":"Mayoría estricta y paso a LEADER con heartbeats"},{"pts":2,"t":"Explica la aleatoriedad del timeout"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/x7.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/x7.c":"/* Prueba del Extra 7: elección con red simulada */\n#include <stdio.h>\n#include \"../raft_eleccion.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nint pedidos[CLUSTER_SIZE], heartbeats, resets;\nvoid send_request_vote(int dest, int term, int id) { (void)term; (void)id; pedidos[dest]++; }\nvoid send_heartbeats_to_all(void) { heartbeats++; }\nvoid reset_election_timeout(void) { resets++; }\nint main(void) {\n    RaftNode n = { FOLLOWER, 2, 4, -1, 0 };\n    on_election_timeout(&n);\n    CHECK(n.current_term == 5 && n.state == CANDIDATE, \"Incrementa el term y pasa a CANDIDATE\");\n    CHECK(n.voted_for == 2 && n.votes_received == 1, \"Vota por sí mismo (votes_received = 1)\");\n    int otros = 0; for (int i = 0; i < CLUSTER_SIZE; i++) if (i != 2) otros += pedidos[i];\n    CHECK(otros == CLUSTER_SIZE - 1 && pedidos[2] == 0, \"Pide voto a los 4 demás y no a sí mismo\");\n    CHECK(resets == 1, \"Reinicia su timeout de elección\");\n    RequestVoteReply si = { 5, true }, no = { 5, false };\n    on_request_vote_reply(&n, &si);\n    CHECK(n.state == CANDIDATE, \"Con 2 votos de 5 todavía no es líder\");\n    on_request_vote_reply(&n, &no);\n    CHECK(n.votes_received == 2, \"Un voto negado no suma\");\n    on_request_vote_reply(&n, &si);\n    CHECK(n.state == LEADER && heartbeats == 1, \"Con 3 de 5 (mayoría estricta) pasa a LEADER y envía heartbeats\");\n    on_request_vote_reply(&n, &si);\n    CHECK(heartbeats == 1, \"Si ya no es candidato, ignora respuestas tardías\");\n    return 0;\n}\n"}}}],"tarjetas":[{"id":"u01","t":"pipes","q":"¿Qué es un pipe y qué retorna pipe(fd)? ¿Cuál extremo es cuál?","a":"Canal <b>unidireccional</b> en memoria entre procesos emparentados. <code>pipe(fd)</code> crea <b>fd[0] = lectura</b> y <b>fd[1] = escritura</b> (truco: 0 como stdin, 1 como stdout). Se crea <b>antes</b> de fork() para que ambos procesos hereden los descriptores."},{"id":"u02","t":"pipes","q":"¿Por qué hay que cerrar los extremos del pipe que no se usan después de fork()?","a":"read() solo retorna <b>0 (EOF)</b> cuando <b>todos</b> los extremos de escritura están cerrados. Si el lector conserva una copia abierta de fd[1], nunca recibe EOF y se queda bloqueado para siempre. Además se evita gastar descriptores."},{"id":"u03","t":"pipes","q":"¿Qué retorna fork() y qué copia?","a":"Retorna <b>0 en el hijo</b>, el <b>PID del hijo en el padre</b> y −1 si hay error. El hijo obtiene una <b>copia</b> de la memoria (las variables NO se comparten después) y hereda los descriptores abiertos (sí comparten pipes y sockets). Ojo: también copia el buffer de printf sin vaciar → usa fflush(stdout) antes de fork()."},{"id":"u04","t":"pipes","q":"¿Qué es un proceso zombi y cómo se evita en un servidor con fork()?","a":"Un hijo que <b>terminó</b> pero cuyo padre aún no leyó su estado con wait(): queda en la tabla de procesos. En un servidor: <code>signal(SIGCHLD, SIG_IGN)</code> o <code>waitpid(-1, NULL, WNOHANG)</code> en el loop."},{"id":"u05","t":"pipes","q":"¿Para qué sirve select() y cómo se usa?","a":"Espera hasta que <b>alguno</b> de varios descriptores esté listo, sin bloquearse en uno solo. Patrón: FD_ZERO, FD_SET de cada fd, <code>select(maxfd+1, &amp;rd, NULL, NULL, timeout)</code>, y luego FD_ISSET para ver cuáles leer. Hay que <b>reconstruir</b> el fd_set en cada vuelta."},{"id":"u06","t":"sockets","q":"Secuencia de llamadas de un servidor TCP y de un cliente TCP.","a":"<b>Servidor:</b> socket → (setsockopt SO_REUSEADDR) → bind → listen → accept (retorna un <b>nuevo</b> fd por cliente) → recv/send → close. <b>Cliente:</b> socket → connect → send/recv → close."},{"id":"u07","t":"sockets","q":"¿Por qué hay que manejar el retorno de recv() y null-terminar el buffer?","a":"recv retorna <b>&gt;0</b> bytes leídos, <b>0</b> si el otro lado cerró y <b>−1</b> si hay error. No agrega \u0000: hay que hacer <code>buf[n] = '\\0'</code> antes de usarlo como string. Y como TCP es un <b>flujo</b>, un recv puede traer medio mensaje o varios: para protocolos por líneas se usa un buffer acumulador."},{"id":"u08","t":"sockets","q":"¿Qué hacen htons() e inet_pton()?","a":"<b>htons</b>: convierte el puerto al orden de bytes de red (big-endian). <b>inet_pton</b>: convierte una IP en texto (\"127.0.0.1\") a binario dentro de sin_addr. Olvidar htons es un error clásico: te conectas a otro puerto."},{"id":"u09","t":"sockets","q":"En un servidor concurrente con fork(), ¿qué descriptores cierra cada proceso?","a":"El <b>hijo</b> cierra el socket de escucha (srv), porque no acepta clientes. El <b>padre</b> cierra el socket del cliente (cli), porque no habla con él. Si no, se filtran descriptores y la conexión no se cierra de verdad."},{"id":"u10","t":"rpc","q":"¿Qué es RPC? ¿Qué hacen el stub y el skeleton?","a":"<b>Remote Procedure Call</b>: llamar a una función que se ejecuta en otra máquina como si fuera local. El <b>stub</b> (cliente) serializa los argumentos, envía, espera y deserializa el resultado. El <b>skeleton</b> (servidor) recibe, parsea, llama a la función real y responde. Protocolo típico del curso: <code>CALL f args</code> → <code>RESULT valor</code>."},{"id":"u11","t":"rpc","q":"¿Qué es una dispatch table?","a":"Un arreglo de structs <code>{nombre, puntero a función}</code>. El servidor busca el nombre recibido y llama a la función por su puntero. Agregar una función remota es agregar una entrada; todas comparten la misma firma."},{"id":"u12","t":"rpc","q":"flock(): LOCK_SH vs LOCK_EX y por qué se usa con fork().","a":"<b>LOCK_SH</b>: compartido, varios lectores a la vez. <b>LOCK_EX</b>: exclusivo, un solo escritor y ningún lector. Con fork() las variables no se comparten, así que el estado común va a un <b>archivo</b> y flock evita las condiciones de carrera. Leer, modificar y escribir bajo el mismo LOCK_EX evita perder actualizaciones."},{"id":"c01","t":"lamport","q":"¿Por qué no existe un reloj global en un sistema distribuido? ¿Qué es el clock drift?","a":"Cada nodo tiene su <b>propio reloj físico</b> y no hay uno compartido. Los relojes no avanzan igual (los osciladores de cuarzo varían con la temperatura): <b>clock drift</b>, típicamente ~1 s cada 11-12 días. Por eso no se confía en la hora absoluta: interesa el <b>orden</b> de los eventos."},{"id":"c02","t":"lamport","q":"Define la relación happened-before (A → B). ¿Cuándo dos eventos son concurrentes?","a":"A → B si: (1) <b>mismo proceso</b> y A ocurre antes que B; (2) A es el <b>envío</b> y B la <b>recepción</b> del mismo mensaje; (3) <b>transitividad</b>: A→B y B→C ⇒ A→C. Si no se cumple ninguna, A ∥ B (<b>concurrentes</b>)."},{"id":"c03","t":"lamport","q":"Escribe las 3 reglas del algoritmo de Lamport.","a":"L parte en 0.<br>• <b>Local:</b> L = L + 1.<br>• <b>Envío:</b> L = L + 1 y el mensaje lleva L.<br>• <b>Recepción</b> con timestamp T: <b>L = max(L, T) + 1</b>."},{"id":"c04","t":"lamport","q":"¿Qué garantiza Lamport y qué NO garantiza?","a":"Garantiza: si A → B entonces C(A) &lt; C(B). <b>No</b> garantiza el inverso: C(A) &lt; C(B) <b>no implica</b> A → B (pueden ser concurrentes). Su talón de Aquiles: <b>no detecta concurrencia</b>."},{"id":"c05","t":"lamport","q":"¿Por qué en la recepción se usa max(L, T) + 1 y no T + 1?","a":"Porque el reloj local podría ir más adelante que T. Con T + 1 el reloj <b>retrocedería</b> y se rompería la garantía A→B ⇒ C(A)&lt;C(B). El max asegura que el receptor quede <b>por delante</b> tanto de su pasado como del emisor."},{"id":"c06","t":"lamport","q":"¿Cómo se obtiene un orden total con Lamport? Si dos eventos tienen el mismo timestamp, ¿qué sabemos?","a":"Se ordena por <b>(C, PID)</b>: menor timestamp primero, desempate por menor PID. Si dos eventos tienen el <b>mismo C</b>, <b>no pueden estar relacionados causalmente</b> (A→B exige C(A)&lt;C(B)): son concurrentes. El orden total no es único si cambias la regla de desempate."},{"id":"c07","t":"lamport","q":"¿Cuándo conviene Lamport y cuándo vector clocks?","a":"<b>Lamport:</b> basta un orden total, poco espacio/ancho de banda (logs de eventos, el chat). <b>Vector clocks:</b> hay que <b>detectar concurrencia</b> y resolver conflictos (Git, DynamoDB, CRDTs)."},{"id":"c08","t":"lamport","q":"¿Cómo aplica Lamport al chat distribuido?","a":"El servidor mantiene su reloj, actualiza con <code>max(server, recibido)+1</code> en cada acción y las encola en una cola de prioridad por timestamp. Beneficios: <b>orden total determinístico</b>, reproducible para debugging, todos los clientes ven el mismo orden."},{"id":"c09","t":"vector","q":"En un vector clock V[1..N], ¿qué significan V[i] y V[j] (j≠i) en el proceso i?","a":"<b>V[i]</b>: número de eventos que el proceso i ha ejecutado. <b>V[j]</b>: número de eventos del proceso j que i <b>sabe que ocurrieron</b> (conocimiento causal)."},{"id":"c10","t":"vector","q":"Escribe las 3 reglas de los vector clocks.","a":"V inicia en [0,…,0].<br>• <b>Local:</b> V[i]++.<br>• <b>Envío:</b> V[i]++ y se envía V.<br>• <b>Recepción</b> con vector W: V[i]++ y para todo j≠i: <b>V[j] = max(V[j], W[j])</b>."},{"id":"c11","t":"vector","q":"¿Cómo se comparan dos vectores? ¿Cuándo son concurrentes?","a":"V1 ≤ V2 si V1[i] ≤ V2[i] <b>para todo i</b>. V1 &lt; V2 si V1 ≤ V2 y V1 ≠ V2. <b>V1 ∥ V2</b> si ni V1 &lt; V2 ni V2 &lt; V1 (alguna componente mayor en cada uno)."},{"id":"c12","t":"vector","q":"¿Qué ventaja garantiza un vector clock sobre Lamport y cuál es su costo?","a":"Garantía <b>bidireccional</b>: A → B ⟺ VC(A) &lt; VC(B). Detecta causalidad Y concurrencia. Costo: un vector de <b>N enteros</b> por mensaje/evento (más espacio y overhead: trade-off precisión vs overhead)."},{"id":"c13","t":"consistencia","q":"¿Qué es la consistencia? ¿Por qué es difícil?","a":"Garantía de que todas las réplicas de un dato <b>convergen al mismo valor</b> y que las lecturas reflejan las escrituras de forma predecible. Es difícil por: múltiples réplicas, escrituras concurrentes, latencia variable, fallos de nodos y <b>particiones de red</b>."},{"id":"c14","t":"consistencia","q":"Caso bancario: R. A=$150, R. B=$70, R. C=$100 antes de replicar (depósito +50 en A, retiro −30 en B). ¿Qué pasa?","a":"Replicación incompleta: <b>ninguna réplica tiene el valor correcto</b> ($100+50−30 = <b>$120</b>). Cada una vio solo parte de las escrituras. Ilustra la necesidad de un modelo de consistencia (p.ej. fuerte para transacciones financieras)."},{"id":"c15","t":"consistencia","q":"Consistencia fuerte: definición, implementación típica, pros y contras.","a":"Toda lectura ve la <b>escritura más reciente</b> (linealizabilidad; equivale a un sistema con una sola copia). Se implementa con <b>2PC</b>. ✓ Fácil de razonar, sin conflictos. ✗ <b>Alta latencia</b> (espera a todas), <b>bloqueo</b> si una réplica no responde, no tolera particiones. Uso: finanzas, inventario."},{"id":"c16","t":"consistencia","q":"Consistencia eventual: definición, ejemplo, pros y contras.","a":"Si dejan de llegar escrituras, <b>eventualmente</b> todas las réplicas convergen (no dice cuándo). Ejemplo: <b>DNS</b>. Escritura local y propagación asíncrona. ✓ Baja latencia, alta disponibilidad, escalable. ✗ Lecturas viejas, conflictos que resolver. Uso: redes sociales, carritos, DNS."},{"id":"c17","t":"consistencia","q":"Consistencia causal: definición, ejemplo y cómo se implementa.","a":"Las escrituras <b>causalmente relacionadas</b> se ven en el mismo orden en todas las réplicas; las concurrentes pueden verse en distinto orden. Ej. chat: la respuesta de Bob nunca se ve antes del mensaje de Alice. Se implementa con <b>vector clocks</b>: aplicar una escritura solo si sus causas ya fueron aplicadas."},{"id":"c18","t":"consistencia","q":"Estrategias para reconciliar escrituras concurrentes en consistencia eventual.","a":"1) <b>LWW</b> (last-write-wins): gana el timestamp mayor; simple, pero pierde datos. 2) <b>Vector clocks + merge</b> de la aplicación: detecta el conflicto, no pierde datos, requiere lógica. 3) <b>CRDTs</b>: estructuras que se mezclan solas (ej. G-Counter: merge = max)."},{"id":"c19","t":"consistencia","q":"Carrito de Amazon (DynamoDB): ¿qué prioriza y cómo resuelve conflictos?","a":"Prioriza <b>disponibilidad sobre consistencia</b>: mejor un carrito con ítems extra que perder una venta. Usa <b>vector clocks</b> para detectar el conflicto, muestra el <b>merge</b> de todos los ítems y el usuario resuelve. Es AP con consistencia eventual."},{"id":"c20","t":"consistencia","q":"¿Qué modelos se recomiendan para cada parte del chat distribuido y por qué?","a":"<b>Strong</b>: historial de mensajes, usuario activo, mensajes privados (todos deben ver lo mismo; servidor único como coordinador; latencia &lt;100 ms aceptable). <b>Eventual</b>: notificaciones de sistema (no afectan el flujo del chat)."},{"id":"c21","t":"cap","q":"Enuncia el teorema CAP con las tres propiedades.","a":"Brewer (2000): solo se pueden garantizar <b>2 de 3</b>. <b>C</b>onsistency: toda lectura ve la escritura más reciente. <b>A</b>vailability: toda petición recibe respuesta (éxito o fallo). <b>P</b>artition tolerance: el sistema sigue funcionando pese a la pérdida de mensajes. En la práctica, con partición hay que elegir entre C y A."},{"id":"c22","t":"cap","q":"CP vs AP: estrategia ante una partición y ejemplos de sistemas.","a":"<b>CP</b>: el lado minoritario rechaza escrituras → consistencia garantizada, disponibilidad reducida. Ej.: HBase, MongoDB (por defecto), Google Spanner. <b>AP</b>: ambos lados aceptan escrituras y reconcilian después (eventual). Ej.: Cassandra, DynamoDB, Riak."},{"id":"c23","t":"cap","q":"¿Qué agrega PACELC a CAP?","a":"CAP solo habla de cuando hay partición. PACELC (Abadi, 2012): si hay <b>P</b>artición, elige <b>A</b>vailability o <b>C</b>onsistency; <b>E</b>lse (operación normal), elige <b>L</b>atency o <b>C</b>onsistency. Moraleja: no hay solución única."},{"id":"c24","t":"cap","q":"Describe las dos fases de 2PC.","a":"<b>Fase 1 PREPARE:</b> el coordinador pregunta a los participantes si pueden commitear; responden Sí/No. <b>Fase 2:</b> si <b>todos</b> dijeron Sí → COMMIT; si no → ABORT. Garantiza atomicidad (todo o nada) pero es lento y bloqueante."},{"id":"c25","t":"replicacion","q":"¿Por qué replicar? Tres razones.","a":"<b>Disponibilidad</b> (si un nodo falla, otros sirven), <b>rendimiento</b> (réplicas cercanas reducen latencia, se reparte la lectura) y <b>escalabilidad</b> (más carga → más réplicas)."},{"id":"c26","t":"replicacion","q":"Primary-Backup: cómo funciona, ventajas y desventajas.","a":"Solo el <b>primary</b> acepta escrituras y envía un log de cambios a los backups (leen). ✓ Simple, sin conflictos de escritura, consistencia más fácil. ✗ Primary = <b>cuello de botella</b>; si cae hay downtime hasta el failover (5-30 s). Uso: MySQL, PostgreSQL, Redis."},{"id":"c27","t":"replicacion","q":"Multi-Master: cómo funciona, ventajas y desventajas.","a":"<b>Cualquier</b> nodo acepta escrituras y se replica bidireccionalmente. ✓ Sin cuello de botella, alta disponibilidad, buena para geografía distribuida. ✗ <b>Conflictos de escritura</b> que deben resolverse, más complejo. Uso: Cassandra, CouchDB, Riak."},{"id":"c28","t":"replicacion","q":"Failover en primary-backup: ¿cómo se detecta y qué criterios se usan para elegir el nuevo primary?","a":"Se detecta por <b>timeout de heartbeat</b>. Criterios: el backup <b>más actualizado</b> (log más completo), mayor <b>prioridad</b> configurada, y <b>ID más bajo</b> como desempate determinístico."},{"id":"c29","t":"replicacion","q":"Replicación por log: ¿qué verifica un backup antes de aplicar una entrada?","a":"Que sea la siguiente en secuencia: <code>entry->seq_num == last_applied + 1</code>. Si no, <b>pide las entradas faltantes</b>. Luego aplica la operación y actualiza <code>last_applied</code>."},{"id":"c30","t":"fallos","q":"¿Por qué es imposible distinguir un nodo caído de uno lento?","a":"Si A no recibe respuesta de B, puede ser: B caído, B muy lento, red particionada o mensaje perdido. <b>No hay forma de saberlo con certeza</b>: se hacen suposiciones y se usan <b>timeouts</b>."},{"id":"c31","t":"fallos","q":"Heartbeats y el dilema de los timeouts.","a":"Heartbeat: mensaje periódico \"estoy vivo\"; si no llega en T segundos se asume el fallo. <b>Timeout corto:</b> detección rápida, muchos falsos positivos. <b>Largo:</b> pocos falsos positivos, detección lenta."},{"id":"c32","t":"fallos","q":"¿Qué son los timeouts adaptativos?","a":"Se ajusta el timeout según el historial de latencia: media móvil exponencial de la latencia y de la desviación; <b>timeout = media + 4·desviación</b>. Si la red es consistentemente lenta, el timeout sube solo."},{"id":"c33","t":"fallos","q":"Tres estrategias de recuperación ante fallos.","a":"1) <b>Checkpointing</b>: snapshot periódico + replay del log desde el checkpoint. 2) <b>Log replay</b>: reaplicar todas las operaciones (completo pero lento; se combina con checkpoints). 3) <b>State transfer</b>: copiar el estado completo de otra réplica (más rápido; requiere réplica disponible y actualizada)."},{"id":"c34","t":"fallos","q":"¿Qué es el split-brain y cómo se evita?","a":"Ante una <b>partición</b>, ambos lados creen que el otro murió y ambos se declaran primary → <b>dos primaries</b>. Se evita con <b>quórum</b>: solo el lado con <b>mayoría</b> de nodos puede operar o elegir primary."},{"id":"c35","t":"fallos","q":"Quórum: fórmula, ejemplo con N=5 y por qué conviene un N impar.","a":"<b>Quórum = ⌊N/2⌋ + 1</b>. Con N=5, quórum = 3; tolera 2 caídas. Con partición 3|2, solo el lado de 3 opera. Con N par (p.ej. 4, partición 2|2) puede que nadie tenga mayoría: se prefiere N impar (3, 5, 7)."},{"id":"c36","t":"fallos","q":"Redis Sentinel: SDOWN, ODOWN y failover.","a":"Los sentinels hacen PING al primary. <b>SDOWN</b> (subjective down): un sentinel no recibe PONG. <b>ODOWN</b> (objective down): una <b>mayoría</b> de sentinels concuerda (quórum). Luego votan por el backup más actualizado, lo promueven y reconfiguran los demás. Downtime típico 15-30 s."},{"id":"c37","t":"raft","q":"¿Qué es el problema del consenso y qué 4 propiedades exige?","a":"Varios procesos deben acordar un <b>único valor</b>. Propiedades: <b>Termination</b> (los correctos eventualmente deciden), <b>Agreement</b> (todos deciden lo mismo), <b>Validity</b> (el valor fue propuesto por alguien), <b>Integrity</b> (cada proceso decide a lo más una vez)."},{"id":"c38","t":"raft","q":"Teorema FLP: enunciado y cómo lo esquivan los sistemas reales.","a":"No existe algoritmo <b>determinístico</b> que garantice consenso en un sistema <b>asíncrono</b> con al menos un proceso que puede fallar. Salidas: sistemas síncronos (timeouts conocidos), algoritmos probabilísticos, o detectores de fallos no perfectos (timeouts como \"guess\"). Raft asume timeouts y fallas detectables."},{"id":"c39","t":"raft","q":"Los 3 estados de un nodo Raft y sus transiciones.","a":"<b>Follower</b> (estado inicial) →(timeout sin heartbeat)→ <b>Candidate</b> →(mayoría de votos)→ <b>Leader</b>. Candidate →(pierde o descubre un líder/term mayor)→ Follower. Leader →(descubre term mayor)→ Follower."},{"id":"c40","t":"raft","q":"¿Qué es un term en Raft y qué propiedades tiene?","a":"Período en que un líder está en control. Cada term <b>comienza con una elección</b>; hay <b>como máximo 1 líder por term</b>; puede no haber líder (elección fallida / split vote); los terms son consecutivos y crecientes. Si un nodo ve un term mayor: actualiza el suyo, pasa a follower y resetea voted_for."},{"id":"c41","t":"raft","q":"¿Por qué los timeouts de elección son aleatorios (150-300 ms)?","a":"Para que normalmente <b>un solo</b> follower expire primero, se haga candidato y gane. Evita que varios candidatos empaten repetidamente (<b>split vote</b>); si ocurre, un nuevo term con timeouts aleatorios lo resuelve probablemente."},{"id":"c42","t":"raft","q":"¿Cuándo un follower concede su voto (RequestVote)?","a":"(1) <code>args.term ≥ current_term</code>; (2) no ha votado en este term o ya votó por ese mismo candidato (<b>un voto por term</b>); (3) el <b>log del candidato</b> está al menos tan actualizado como el suyo (mayor último term, o mismo term y mayor índice)."},{"id":"c43","t":"raft","q":"Resultados posibles de una elección en Raft.","a":"1) <b>Gana</b>: obtiene mayoría (&gt; N/2) → LEADER y envía heartbeats. 2) <b>Otro gana</b>: recibe AppendEntries con term ≥ el suyo → vuelve a FOLLOWER. 3) <b>Split vote</b>: nadie alcanza mayoría → timeout → nueva elección con term incrementado."},{"id":"c44","t":"raft","q":"Pasos de la replicación de log hasta el commit.","a":"1) Cliente → líder. 2) El líder <b>agrega la entrada</b> a su log. 3) Envía <b>AppendEntries</b> a los followers. 4) Espera ACK de <b>mayoría</b>. 5) <b>Commit</b> (commit_index) y aplica a la máquina de estados. 6) Responde al cliente. 7) Notifica el commit a los followers en el siguiente AppendEntries."},{"id":"c45","t":"raft","q":"AppendEntries: para qué se usa y qué campos clave lleva.","a":"Dos usos: <b>heartbeat</b> (sin entradas, mantiene autoridad) y <b>replicación</b>. Campos: term, leader_id, <b>prev_log_index</b>, <b>prev_log_term</b>, entries[], leader_commit. El follower rechaza si su log no tiene <code>prev_log_index</code> con ese <code>prev_log_term</code>."},{"id":"c46","t":"raft","q":"Log Matching Property y cómo se reparan logs inconsistentes.","a":"Si dos logs tienen una entrada con el <b>mismo índice y term</b>, entonces almacenan el mismo comando y los logs son <b>idénticos en todo lo anterior</b>. Reparación: el follower rechaza, el líder <b>retrocede</b> prev_log_index hasta encontrar coincidencia y el follower <b>sobrescribe</b> lo conflictivo con las entradas del líder."},{"id":"c47","t":"raft","q":"Las 5 safety properties de Raft.","a":"1) <b>Election Safety</b>: a lo más un líder por term. 2) <b>Leader Append-Only</b>: el líder nunca borra/sobrescribe su log. 3) <b>Log Matching</b>. 4) <b>Leader Completeness</b>: lo commiteado estará en los líderes futuros (por la restricción de voto). 5) <b>State Machine Safety</b>: nadie aplica un comando distinto en el mismo índice."},{"id":"c48","t":"raft","q":"¿Por qué Raft es más simple que Paxos? ¿En qué 3 subproblemas se descompone?","a":"Solo el <b>líder propone</b> (en Paxos cualquiera puede), lo que reduce estados y facilita razonar. Subproblemas: <b>Leader Election</b> (heartbeats, timeouts, mayoría), <b>Log Replication</b> (AppendEntries + consistency check) y <b>Safety</b> (restricciones de voto y commit)."}]}];
/* ===== Lógica pura (sin DOM) ===== */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---- Código con bloques //@TODO … //@END y líneas clave //§ ---- */
function parseCode(src) {
  const out = []; let blk = null;
  for (const raw of src.replace(/\r/g, '').split('\n')) {
    const m = raw.match(/^\s*(?:\/\/|#|--)@TODO\s+([^|]+?)\s*\|\s*(.*)$/);
    if (m) { blk = { label: m[1], desc: m[2], lines: [] }; out.push({ blk }); continue; }
    if (/^\s*(?:\/\/|#|--)@END\s*$/.test(raw)) { blk = null; continue; }
    const key = /(?:\/\/|#|--)§\s*$/.test(raw), t = raw.replace(/\s*(?:\/\/|#|--)§\s*$/, '');
    if (blk) blk.lines.push({ t, key }); else out.push({ t });
  }
  return out;
}
/* mode: 'sol' (completo), 'alto' (oculta líneas clave), 'medio' (oculta el bloque entero) */
const CMT = { python: ['# ', ''], sql: ['-- ', ''] };
function renderCode(src, mode, lang) {
  const [co, cc] = CMT[lang] || ['/* ', ' */'];
  const res = [];
  for (const it of parseCode(src)) {
    if (!it.blk) { res.push(it.t); continue; }
    const b = it.blk, first = b.lines.find(l => l.t.trim()) || { t: '' }, ind = first.t.match(/^\s*/)[0];
    res.push(ind + co + (mode === 'sol' ? '▼ TODO ' : 'TODO ') + b.label + ': ' + b.desc + cc);
    if (mode === 'sol') b.lines.forEach(l => res.push(l.t));
    else if (mode === 'alto') b.lines.forEach(l => res.push(l.key ? l.t.match(/^\s*/)[0] + co + '???' + cc : l.t));
    else res.push('');
  }
  return res.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd();
}
function countTodos(src) { return parseCode(src).filter(i => i.blk).length; }
function countKeys(src) { return parseCode(src).reduce((a, i) => a + (i.blk ? i.blk.lines.filter(l => l.key).length : 0), 0); }

/* ---- Diagrama fijo (ejercicios de la guía) ---- */
function staticDiagram(d) {
  const lane = 72, top = 34, r = 14, left = 50;
  const W = Math.max(...d.evs.map(e => e.x)) + 50, H = top + (d.procs.length - 1) * lane + 34;
  const pos = {}; d.evs.forEach(e => pos[e.k] = { x: e.x, y: top + e.p * lane });
  let s = `<svg class="diag" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Diagrama espacio-tiempo"><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow-head"/></marker></defs>`;
  d.procs.forEach((p, i) => s += `<line class="lane" x1="${left - 6}" x2="${W - 6}" y1="${top + i * lane}" y2="${top + i * lane}"/><text class="lbl" x="8" y="${top + i * lane + 4}">${esc(p)}</text>`);
  (d.msgs || []).forEach(([a, b, l]) => {
    const A = pos[a], B = pos[b], dd = Math.hypot(B.x - A.x, B.y - A.y), ux = (B.x - A.x) / dd, uy = (B.y - A.y) / dd;
    s += `<line class="msg" x1="${A.x + ux * r}" y1="${A.y + uy * r}" x2="${B.x - ux * (r + 2)}" y2="${B.y - uy * (r + 2)}" marker-end="url(#arr2)"/>`;
    if (l) s += `<text class="mlbl" x="${(A.x + B.x) / 2 + 8}" y="${(A.y + B.y) / 2 - 4}">${esc(l)}</text>`;
  });
  d.evs.forEach(e => {
    const P = pos[e.k], cls = e.cls || (e.v === '?' ? 'ask' : 'given');
    s += `<g class="ev ${cls}" transform="translate(${P.x},${P.y})"><circle r="${r}"/><text>${esc(e.v)}</text><text class="evk" y="-21">${esc(e.k)}</text></g>`;
  });
  return s + '</svg>';
}
/* ---- Resaltado de sintaxis (multi-lenguaje) ---- */
const LANGS = {
