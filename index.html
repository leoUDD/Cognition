  c: { com: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/, pre: /^[ \t]*#\w+/m, kw: 'int char void float double long short bool struct typedef enum const unsigned signed static extern return if else for while do switch case break default sizeof continue goto NULL' },
  cpp: { com: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/, pre: /^[ \t]*#\w+/m, kw: 'int char void float double long bool auto class struct public private protected virtual template typename namespace using const static return if else for while do switch case break default new delete nullptr this true false' },
  java: { com: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/, kw: 'int char void float double long boolean class interface extends implements public private protected static final new return if else for while do switch case break default this null true false import package try catch throw throws' },
  js: { com: /\/\*[\s\S]*?\*\/|\/\/[^\n]*/, kw: 'const let var function return if else for while do switch case break default new class extends this null undefined true false async await import export from of in typeof' },
  python: { com: /#[^\n]*/, kw: 'def return if elif else for while in not and or is None True False class import from as with try except finally raise lambda yield pass break continue global nonlocal print' },
  sql: { com: /--[^\n]*|\/\*[\s\S]*?\*\//, kw: 'select from where group by order having join left right inner outer on as insert into values update set delete create table primary key foreign references not null and or in is distinct count sum avg min max limit union' , ci: true }
};
function highlight(code, lang) {
  const L = LANGS[lang] || LANGS.c;
  const parts = [L.com.source, '"(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\''];
  if (L.pre) parts.push(L.pre.source);
  parts.push('\\b(?:' + L.kw.split(' ').join('|') + ')\\b', '\\b\\d+(?:\\.\\d+)?\\b');
  const re = new RegExp(parts.map(p => '(' + p + ')').join('|'), 'g' + (L.ci ? 'i' : '') + (L.pre ? 'm' : ''));
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(code.slice(last, m.index));
    const i = m.slice(1).findIndex(x => x !== undefined);
    const cls = L.pre ? ['c', 's', 'p', 'k', 'n'][i] : ['c', 's', 'k', 'n'][i];
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}



/* ===== Sincronización con el servidor (Vercel /api/progress) =====
   Estrategia: last-write-wins por updatedAt (la misma idea de la Unidad 2). */
const SYNC_KEY = 'cognition-sync';
const SY = { code: null, status: 'local', timer: null, busy: false, pendingCode: '', confirm: false, msg: '' };
try { SY.code = localStorage.getItem(SYNC_KEY) || localStorage.getItem('cuaderno-redes-sync'); } catch (e) { }
const SYNC_LABEL = { local: 'solo este navegador', sync: 'sincronizando…', ok: 'sincronizado', offline: 'sin conexión', noserver: 'servidor sin configurar' };
function setSync(st, msg) { SY.status = st; SY.msg = msg || ''; const el = document.getElementById('syncchip'); if (el) { el.textContent = SYNC_LABEL[st]; el.className = 'syncchip ' + (st === 'ok' ? 'ok' : st === 'offline' || st === 'noserver' ? 'err' : ''); } }
function newCode() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789', b = new Uint8Array(12);
  crypto.getRandomValues(b);
  return Array.from(b, x => abc[x % abc.length]).join('').replace(/(.{4})(?=.)/g, '$1-');
}
async function apiProgress(method, code, body) {
  const r = await fetch('/api/progress?code=' + encodeURIComponent(code), {
    method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 503) throw Object.assign(new Error('noserver'), { kind: 'noserver' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function syncPull() {
  if (!SY.code || SY.busy) return;
  SY.busy = true; setSync('sync');
  try {
    const { data } = await apiProgress('GET', SY.code);
    if (data && (data.updatedAt || 0) > (S.updatedAt || 0)) { S = normalizar(data); activarCurso(S.curso); saveLocal(); render(); }
    else if (!data || (S.updatedAt || 0) > (data.updatedAt || 0)) await apiProgress('PUT', SY.code, S);
    setSync('ok');
  } catch (e) { setSync(e.kind === 'noserver' ? 'noserver' : 'offline'); }
  SY.busy = false;
}
function syncSchedule() {
  if (!SY.code) return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(async () => {
    setSync('sync');
    try { await apiProgress('PUT', SY.code, S); setSync('ok'); } catch (e) { setSync(e.kind === 'noserver' ? 'noserver' : 'offline'); }
  }, 1200);
}
function syncSetCode(code) { SY.code = code; try { code ? localStorage.setItem(SYNC_KEY, code) : localStorage.removeItem(SYNC_KEY); } catch (e) { } }
async function syncConnect(code, adoptRemote) {
  syncSetCode(code); setSync('sync');
  try {
    const { data } = await apiProgress('GET', code);
    if (data && adoptRemote) { S = normalizar(data); activarCurso(S.curso); saveLocal(); }
    else { S.updatedAt = Date.now(); saveLocal(); await apiProgress('PUT', code, S); }
    setSync('ok'); toast('Conectado');
  } catch (e) { setSync(e.kind === 'noserver' ? 'noserver' : 'offline'); }
  render();
}
window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncPull(); });
function syncCard() {
  const st = `<span class="syncchip ${SY.status === 'ok' ? 'ok' : SY.status === 'offline' || SY.status === 'noserver' ? 'err' : ''}">${SYNC_LABEL[SY.status]}</span>`;
  if (SY.code) return `<section class="card stack" style="gap:10px"><div class="row spread"><h2 style="margin:0">Sincronización</h2>${st}</div>
    <p class="muted small" style="margin:0">Tu código. Ingrésalo en otro dispositivo para continuar ahí. Gana la versión guardada más reciente (last-write-wins), así que usa un dispositivo a la vez.</p>
    <div class="row"><span class="code-big">${esc(SY.code)}</span><button class="btn sm" data-act="syCopy">Copiar</button><button class="btn sm" data-act="syNow">Sincronizar ahora</button><button class="btn sm" data-act="syOff">Desconectar este dispositivo</button></div>
    ${SY.status === 'noserver' ? '<div class="callout warn small">La página funciona, pero el servidor no tiene base de datos conectada. Revisa el paso 3 del README.</div>' : ''}
    ${SY.status === 'offline' ? '<div class="callout warn small">No se pudo contactar al servidor. Tu progreso se guarda en este navegador y se subirá cuando vuelva la conexión.</div>' : ''}</section>`;
  return `<section class="card stack" style="gap:10px"><div class="row spread"><h2 style="margin:0">Sincronización</h2>${st}</div>
    <p class="muted small" style="margin:0">Para usar tu progreso en el PC y en el celular, crea un código aquí y luego ingrésalo en el otro dispositivo.</p>
    <div class="row"><button class="btn primary" data-act="syNew">Crear código</button><span class="muted small">o</span>
    <input type="text" id="sycode" placeholder="abcd-efgh-jkmn" value="${esc(SY.pendingCode)}" autocomplete="off" style="font-family:var(--f-mono);width:170px" aria-label="Código de sincronización"><button class="btn" data-act="syJoin">Conectar</button></div>
    ${SY.confirm ? `<div class="callout warn small">Se reemplazará el progreso de este navegador por el guardado en <b>${esc(SY.pendingCode)}</b>. <button class="btn sm" data-act="syJoinYes">Sí, conectar</button> <button class="btn sm" data-act="syJoinNo">Cancelar</button></div>` : ''}</section>`;
}

/* ===== Estado y persistencia (ligera, por navegador) ===== */
const KEY = 'cognition-v2', OLD_KEYS = ['cuaderno-redes-v1'];
const DAILY = 40;
const TITULOS_BASE = ['Aprendiz', 'Practicante', 'Competente', 'Avanzado', 'Experto', 'Maestro'];
/* Estado global (XP, racha) + progreso separado por ramo en S.cursos[id] */
function defaults() { return { v: 2, xp: 0, streak: 0, lastDay: '', dayXp: 0, dayKey: '', updatedAt: 0, curso: null, cursos: {} }; }
function cursoVacio() { return { cards: {}, papel: {}, topics: {}, exams: {} }; }
/* Acepta el formato antiguo (v1, un solo ramo) y lo migra al ramo "redes" */
function normalizar(datos) {

/* ---- redes/modulos/logica.js ---- */
/* Lógica de los módulos de Redes (escenarios de relojes y drills). Usa rnd/pick/shuffle/esc del motor. */
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';
/* ---- Escenarios de eventos distribuidos ---- */
function genScenario(nProc, nEv) {
  for (let attempt = 0; attempt < 500; attempt++) {
    const evs = [], pending = [];
    while (evs.length < nEv) {
      const remaining = nEv - evs.length;
      let p, type, msg = null;
      if (pending.length >= remaining) { msg = pending.shift(); p = msg.to; type = 'recv'; }
      else {
        p = rnd(nProc);
        const inbox = pending.filter(m => m.to === p);
        const r = Math.random();
        if (inbox.length && r < 0.5) { msg = inbox[0]; pending.splice(pending.indexOf(msg), 1); type = 'recv'; }
        else if (r < 0.82 && pending.length + 1 <= remaining - 1) type = 'send';
        else type = 'local';
      }
      const ev = { id: evs.length, p, type, letter: LETTERS[evs.length] };
      if (type === 'send') {
        let q = rnd(nProc - 1); if (q >= p) q++;
        const m = { from: p, to: q, send: ev.id };
        ev.to = q; ev.msg = m; pending.push(m);
      }
      if (type === 'recv') { ev.from = msg.send; ev.fromProc = msg.from; msg.recv = ev.id; evs[msg.send].recvId = ev.id; }
      evs.push(ev);
    }
    const counts = Array(nProc).fill(0); evs.forEach(e => counts[e.p]++);
    const msgs = evs.filter(e => e.type === 'send').length;
    if (counts.every(c => c >= 2) && msgs >= 3) return { nProc, evs };
  }
  throw new Error('no scenario');
}

function computeAll(sc) {
  const n = sc.nProc, C = Array(n).fill(0), V = Array.from({ length: n }, () => Array(n).fill(0));
  sc.evs.forEach(e => {
    e.preL = C[e.p]; e.preV = V[e.p].slice();
    if (e.type === 'recv') {
      const src = sc.evs[e.from]; e.T = src.L; e.W = src.V.slice();
      C[e.p] = Math.max(C[e.p], e.T) + 1;
      V[e.p][e.p]++;
      for (let j = 0; j < n; j++) if (j !== e.p) V[e.p][j] = Math.max(V[e.p][j], e.W[j]);
    } else { C[e.p]++; V[e.p][e.p]++; }
    e.L = C[e.p]; e.V = V[e.p].slice();
  });
  /* happened-before: ancestros por evento */
  const last = Array(n).fill(-1);
  sc.evs.forEach(e => {
    const preds = [];
    if (last[e.p] >= 0) preds.push(last[e.p]);
    if (e.type === 'recv') preds.push(e.from);
    e.preds = preds;
    e.anc = new Set();
    preds.forEach(q => { e.anc.add(q); sc.evs[q].anc.forEach(x => e.anc.add(x)); });
    last[e.p] = e.id;
  });
  return sc;
}
/* relación entre x e y: 'a' x→y, 'd' y→x, 'c' concurrentes */
function relation(sc, x, y) {
  if (sc.evs[y].anc.has(x)) return 'a';
  if (sc.evs[x].anc.has(y)) return 'd';
  return 'c';
}
/* camino causal de a a b (lista de ids) */
function findPath(sc, a, b) {
  const prev = { [b]: null }, queue = [b];
  while (queue.length) {
    const cur = queue.shift();
    if (cur === a) { const path = []; let c = a; while (c !== null) { path.push(c); c = prev[c]; } return path; }
    for (const q of sc.evs[cur].preds) if (!(q in prev)) { prev[q] = cur; queue.push(q); }
  }
  return null;
}
function genPairs(sc, k) {
  const all = [];
  for (let i = 0; i < sc.evs.length; i++) for (let j = i + 1; j < sc.evs.length; j++) all.push([i, j]);
  const conc = shuffle(all.filter(([i, j]) => relation(sc, i, j) === 'c'));
  const caus = shuffle(all.filter(([i, j]) => relation(sc, i, j) !== 'c'));
  const chosen = conc.slice(0, Math.ceil(k / 2)).concat(caus.slice(0, k - Math.min(conc.length, Math.ceil(k / 2))));
  return shuffle(chosen).map(([i, j]) => Math.random() < 0.5 ? { x: i, y: j } : { x: j, y: i })
    .map(p => ({ ...p, rel: relation(sc, p.x, p.y) }));
}
/* un único timestamp incorrecto, en un evento del que nada depende */
function genError(sc) {
  const lastOf = {}; sc.evs.forEach(e => lastOf[e.p] = e);
  const cands = Object.values(lastOf).filter(e => e.type !== 'send');
  if (!cands.length) return null;
  const e = pick(cands);
  let wrong; do { wrong = e.L + pick([-2, -1, 1, 2, 3]); } while (wrong < 1 || wrong === e.L);
  return { ev: e.id, wrong, correct: e.L, rule: e.type === 'recv' ? 'recv' : 'seq' };
}
const fmtV = v => '[' + v.join(',') + ']';
function stepsLamport(sc) {
  return sc.evs.map(e => {
    const P = 'P' + (e.p + 1);
    if (e.type === 'local') return `<b>${e.letter}</b> (${P}, interno): ${e.preL} + 1 = <b>${e.L}</b>`;
    if (e.type === 'send') return `<b>${e.letter}</b> (${P}, envía a P${e.to + 1}): ${e.preL} + 1 = <b>${e.L}</b>; el mensaje lleva ts=${e.L}`;
    return `<b>${e.letter}</b> (${P}, recibe de <b>${sc.evs[e.from].letter}</b> con T=${e.T}): max(${e.preL}, ${e.T}) + 1 = <b>${e.L}</b>`;
  });
}
function stepsVector(sc) {
  return sc.evs.map(e => {
    const P = 'P' + (e.p + 1);
    if (e.type === 'local') return `<b>${e.letter}</b> (${P}, interno): ${fmtV(e.preV)} → V[${e.p + 1}]++ = <b>${fmtV(e.V)}</b>`;
    if (e.type === 'send') return `<b>${e.letter}</b> (${P}, envía a P${e.to + 1}): ${fmtV(e.preV)} → V[${e.p + 1}]++ = <b>${fmtV(e.V)}</b>; el mensaje lleva ese vector`;
    return `<b>${e.letter}</b> (${P}, recibe de <b>${sc.evs[e.from].letter}</b> con W=${fmtV(e.W)}): V[${e.p + 1}]++ y máximo componente a componente de ${fmtV(e.preV)} y W = <b>${fmtV(e.V)}</b>`;
  });
}

function genQuorumDrill() {
  const N = pick([3, 4, 5, 6, 7, 9]); const q = Math.floor(N / 2) + 1;
  return { N, q, f: N - q };
}
function genPartitionDrill() {
  const N = pick([5, 5, 6, 7, 9]); const a = 1 + rnd(N - 1), b = N - a; const q = Math.floor(N / 2) + 1;
  const ans = a >= q ? 'A' : b >= q ? 'B' : 'N';
  return { N, a, b, q, ans };
}
function raftVote(node, args) {
  let term = node.term, voted = node.voted;
  if (args.term < term) return { grant: false, why: `Rechaza: term del candidato (${args.term}) &lt; term actual (${term}).` };
  const bump = args.term > term;
  if (bump) { term = args.term; voted = -1; }
  if (voted !== -1 && voted !== args.cand) return { grant: false, why: `Rechaza: ya votó por el nodo ${voted} en este term (un voto por term).${bump ? '' : ''}` };
  if (args.lastTerm < node.lastTerm) return { grant: false, why: `Rechaza: el último term del log del candidato (${args.lastTerm}) es menor que el suyo (${node.lastTerm}); log menos actualizado.` };
  if (args.lastTerm === node.lastTerm && args.lastIdx < node.lastIdx) return { grant: false, why: `Rechaza: mismo último term (${node.lastTerm}) pero el log del candidato es más corto (índice ${args.lastIdx} &lt; ${node.lastIdx}).` };
  return { grant: true, why: `Concede: term ${args.term} ≥ ${node.term}${bump ? ' (actualiza su term y borra su voto)' : ''}, no hay voto previo contrario y el log del candidato está al menos tan actualizado.` };
}
function genVoteDrill() {
  const node = { id: 1 + rnd(4), term: 2 + rnd(4), voted: -1, lastTerm: 1 + rnd(3), lastIdx: 3 + rnd(4) };
  const cand = (node.id + 1 + rnd(3)) % 5;
  const args = { term: node.term + pick([0, 1, 1]), cand, lastTerm: node.lastTerm, lastIdx: node.lastIdx + pick([0, 1, 2]) };
  if (Math.random() < 0.5) node.voted = pick([-1, cand]); 
  const bad = Math.random() < 0.65 ? rnd(4) : -1;
  if (bad === 0) args.term = node.term - 1;
  if (bad === 1) { node.voted = (cand + 1 + rnd(3)) % 5; args.term = node.term; }
  if (bad === 2) args.lastTerm = node.lastTerm - 1;
  if (bad === 3) { args.lastTerm = node.lastTerm; args.lastIdx = node.lastIdx - 1; }
  if (args.term < 1) args.term = 1;
  return { node, args, res: raftVote(node, args) };
}
function genLogDrill() {
  const m = 5 + rnd(3), k = 1 + rnd(m - 2);
  const L = []; let t = 1;
  for (let i = 1; i <= m; i++) { if (i === k + 1 || Math.random() < 0.35) t++; L.push(t); }
  const e = 1 + rnd(2), tf = L[k - 1] + rnd(L[k] - L[k - 1]); /* en [L[k], L[k+1]-1] */
  const F = L.slice(0, k); for (let i = 0; i < e; i++) F.push(tf);
  return { L, F, k, del: e, send: m - k };
}

const LAB = { mode: 'lamport', diff: 'normal', sc: null, answers: {}, checked: false, awarded: false, pairs: [], err: null, sel: null, rule: '', fix: '', res: null };
const DIFF = { facil: { n: 8, hints: 3 }, normal: { n: 10, hints: 1 }, examen: { n: 12, hints: 0 } };
function labNew() {
  LAB.sc = computeAll(genScenario(3, DIFF[LAB.diff].n));
  LAB.answers = {}; LAB.checked = false; LAB.awarded = false; LAB.sel = null; LAB.rule = ''; LAB.fix = ''; LAB.res = null;
  if (LAB.mode === 'clasificar') { LAB.pairs = genPairs(LAB.sc, 6); LAB.pairs.forEach(p => p.pick = ''); }
  if (LAB.mode === 'error') { LAB.err = null; while (!LAB.err) { LAB.sc = computeAll(genScenario(3, DIFF[LAB.diff].n)); LAB.err = genError(LAB.sc); } }
}
function givenSet() { const s = new Set(), h = DIFF[LAB.diff].hints; for (let p = 0; p < h; p++) { const e = LAB.sc.evs.find(x => x.p === p); if (e) s.add(e.id); } return s; }
function svgDiagram(sc, o) {

  const W = left + sc.evs.length * step + 14, H = top + (sc.nProc - 1) * lane + 40;
  const X = i => left + i * step + step / 2 - 6, Y = p => top + p * lane;
  let s = `<svg class="diag" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Diagrama espacio-tiempo"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrow-head"/></marker></defs>`;
  for (let p = 0; p < sc.nProc; p++) s += `<line class="lane" x1="${left - 12}" x2="${W - 6}" y1="${Y(p)}" y2="${Y(p)}"/><text class="lbl" x="12" y="${Y(p) + 4}">P${p + 1}</text>`;
  sc.evs.forEach(e => {

const parseNums = s => (String(s).match(/-?\d+/g) || []).map(Number);
VIEWS.relojes = () => {

Object.assign(ACT, {
  labMode(el) { LAB.mode = el.dataset.v; labNew(); render(); },
  labDiff(el) { LAB.diff = el.dataset.v; labNew(); render(); },
  labNew() { labNew(); render(); },
  evclick(el) { if (LAB.checked) return; LAB.sel = +el.dataset.ev; render(); },
  pairPick(el) { LAB.pairs[+el.dataset.i].pick = el.dataset.v; render(); },
  rulePick(el) { LAB.rule = el.dataset.v; render(); },
  labCheck() {
    const sc = LAB.sc, m = LAB.mode; let ok = 0, tot = 0;
    if (m === 'lamport' || m === 'vector') {
      const gv = givenSet(); LAB.res = {};
      sc.evs.forEach(e => {
        if (gv.has(e.id)) return; tot++;
        const a = LAB.answers[e.id] ?? '';
        const good = m === 'lamport' ? (a.trim() !== '' && parseInt(a, 10) === e.L && /^\s*\d+\s*$/.test(a)) : (() => { const v = parseNums(a); return v.length === 3 && v.every((x, i) => x === e.V[i]); })();

    } else if (m === 'clasificar') {
      LAB.pairs.forEach(p => { tot++; if (p.pick === p.rel) ok++; });
      LAB.checked = true;
      if (!LAB.awarded) { LAB.awarded = true; LAB.pairs.forEach(p => record('lamport', p.pick === p.rel)); addXp(ok * 6 + (ok === tot ? 15 : 0)); }
    } else {
      const er = LAB.err, e = sc.evs[er.ev], a = LAB.sel === er.ev, b = LAB.rule === er.rule, c = parseInt(LAB.fix, 10) === er.correct;
      const why = e.type === 'recv' ? `Era una recepción de <b>${sc.evs[e.from].letter}</b> con T=${e.T}: max(${e.preL}, ${e.T}) + 1 = <b>${er.correct}</b>.` : `Era un evento ${e.type === 'send' ? 'de envío' : 'interno'}: ${e.preL} + 1 = <b>${er.correct}</b>.`;
      LAB.res = { html: `<h3>${a && b && c ? 'Perfecto' : 'Resultado'}</h3><ul class="clean"><li>Evento con error: <b>${e.letter}</b> (marcaste ${LAB.sel === null ? 'ninguno' : sc.evs[LAB.sel].letter}) ${a ? '✓' : '✗'}</li><li>Regla violada: ${er.rule === 'recv' ? 'Regla 4 (recepción)' : 'Regla 2 (interno/envío)'} ${b ? '✓' : '✗'}</li><li>Valor correcto: ${er.correct} ${c ? '✓' : '✗'}</li></ul><p>${why} Estaba escrito ${er.wrong}.</p>` };
