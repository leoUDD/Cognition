ico) return 2; //§\n        if (v < u->alerta) return 1; //§\n    }\n    return 0;\n}\n//@END\n\nvoid handle_sonda(int fd) {\n    char buf[BUF_SIZE];\n//@TODO A.1 | Recibir CONNECT, validar el ID y responder HELLO o REJECT\n    char id[16], resp[BUF_SIZE];\n    Umbral *u = NULL;\n    int n = recv(fd, buf, sizeof(buf) - 1, 0); //§\n    if (n <= 0) return; //§\n    buf[n] = '\\0'; //§\n    if (sscanf(buf, \"CONNECT %15s\", id) != 1) return; //§\n    for (int i = 0; i < 4; i++)\n        if (strcmp(umbrales[i].id, id) == 0) u = &umbrales[i]; //§\n    if (u == NULL) {\n        snprintf(resp, sizeof resp, \"REJECT %s\\n\", id); //§\n        send(fd, resp, strlen(resp), 0); //§\n        return;\n    }\n    snprintf(resp, sizeof resp, \"HELLO %s\\n\", id); //§\n    send(fd, resp, strlen(resp), 0); //§\n    printf(\"[BASE] %s conectada\\n\", id);\n//@END\n//@TODO A.2 | Loop TELEM: validar checksum, ACK/NACK, evaluar y ALERT\n    const char *nivel_txt[] = { \"NORMAL\", \"ALERTA\", \"CRITICO\" };\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        char tid[16], valor[32], cs[8], calc[3];\n        int seq;\n        if (sscanf(buf, \"TELEM %15s %d %31s %7s\", tid, &seq, valor, cs) != 4) continue; //§\n        if (strcmp(checksum(valor, calc), cs) != 0) { //§\n            snprintf(resp, sizeof resp, \"NACK %s %d\\n\", tid, seq); //§\n            send(fd, resp, strlen(resp), 0);\n            continue;\n        }\n        int nivel = evaluar(u, atof(valor)); //§\n        int len = snprintf(resp, sizeof resp, \"ACK %s %d\\n\", tid, seq); //§\n        if (nivel > 0) /* ACK + ALERT en un solo send: TCP no separa mensajes */\n            snprintf(resp + len, sizeof resp - len, \"ALERT %s %s valor=%s\\n\", tid, nivel_txt[nivel], valor); //§\n        send(fd, resp, strlen(resp), 0); //§\n        printf(\"[BASE] %s seq=%d valor=%s -> %s\\n\", tid, seq, valor, nivel_txt[nivel]);\n    }\n//@END\n}\n\nint main(void) {\n//@TODO A.3 | socket, bind, listen y fork() por cada sonda\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    int opt = 1;\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof opt);\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET; //§\n    addr.sin_addr.s_addr = INADDR_ANY; //§\n    addr.sin_port = htons(PORT); //§\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); exit(1); } //§\n    listen(srv, 8); //§\n    signal(SIGCHLD, SIG_IGN);                   /* evita zombis */ //§\n    printf(\"[BASE] escuchando en %d\\n\", PORT);\n    while (1) {\n        int cli = accept(srv, NULL, NULL); //§\n        if (cli < 0) continue;\n        fflush(stdout);\n        if (fork() == 0) { //§\n            close(srv);                         /* el hijo no acepta conexiones */ //§\n            handle_sonda(cli); //§\n            close(cli);\n            exit(0); //§\n        }\n        close(cli);                             /* el padre no habla con la sonda */ //§\n    }\n//@END\n    return 0;\n}\n"}],"qs":[{"q":"¿Por qué la solución manda ACK y ALERT en un solo send()?","a":"TCP es un <b>flujo de bytes</b>, no respeta los límites de los mensajes. Dos send() seguidos pueden llegar juntos en un recv() o separados, y el cliente (que hace un recv por lectura) podría imprimir el ALERT con la lectura siguiente. Juntarlos en un buffer hace la respuesta predecible."},{"q":"¿Por qué se valida el checksum sobre el valor como string y no sobre el float?","a":"checksum() suma los bytes del <b>texto</b> que envió la sonda (\"3.60\"). Si lo conviertes a float y lo vuelves a imprimir, el texto puede cambiar (\"3.6\", \"3.600000\") y el checksum no coincide."}],"hints":["A.1: recv, null-terminar, sscanf(\"CONNECT %15s\") y buscar el id en umbrales[].","A.2: lee el valor con %s (no %f) para poder calcular el checksum sobre el mismo texto.","A.3 es el patrón de siempre: socket → bind → listen → loop accept → fork."],"think":["A.1: si recv ≤ 0 retornar. Buscar el id en umbrales; si no está → REJECT y return; si está → HELLO y guardar el puntero al Umbral.","A.2: while recv > 0: sscanf \"TELEM %s %d %s %s\". checksum(valor) ≠ cs → NACK. Si no, nivel = evaluar(u, atof(valor)), ACK y, si nivel > 0, ALERT.","evaluar(): si mayor, comparar primero con crítico y luego con alerta (el orden importa); si menor, igual pero con <.","A.3: SO_REUSEADDR, signal(SIGCHLD, SIG_IGN) contra zombis; el hijo cierra srv y el padre cierra cli."],"errors":["Comparar primero con el umbral de alerta: un valor crítico quedaría como ALERTA.","No hacer buf[n] = '\\0' antes de sscanf.","No cerrar srv en el hijo ni cli en el padre.","Definir evaluar() dentro de handle_sonda() (C estándar no permite funciones anidadas)."],"rubric":[{"pts":5,"t":"A.1: recv + null-terminación + parseo de CONNECT"},{"pts":5,"t":"A.1: busca el ID en umbrales[]"},{"pts":5,"t":"A.1: responde HELLO o REJECT con el formato exacto"},{"pts":5,"t":"A.2: loop recv con condición de término"},{"pts":6,"t":"A.2: parseo TELEM y validación del checksum (NACK)"},{"pts":7,"t":"A.2: evaluación de umbrales (mayor/menor, crítico antes que alerta)"},{"pts":7,"t":"A.2: ACK y ALERT con formato correcto"},{"pts":6,"t":"A.3: socket, bind, listen con htons/INADDR_ANY"},{"pts":6,"t":"A.3: accept + fork, cierres correctos"},{"pts":3,"t":"A.3: evita zombis"}],"lang":"c","pruebas":{"compilar":[{"src":["servidor.c"],"out":"servidor"}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor","cmd":"./servidor","puerto":7070,"log":"servidor.out","critico":true},{"tipo":"python","nombre":"Protocolo SELENE contra tu servidor","archivo":"prueba/c01a.py","timeout":20}],"archivos":{"prueba/c01a.py":"\"\"\"Prueba del Control 01, parte A: un cliente que habla el protocolo SELENE con tu servidor.\"\"\"\nfrom cognition_prueba import *\ndef cs(v): return \"%02X\" % (sum(v.encode()) % 256)\ndef nivel(l):\n    l = l or \"\"\n    return 2 if (\"CRIT\" in l.upper() or \" 2 \" in l + \" \") else 1 if (\"ALERTA\" in l.upper() or \" 1 \" in l + \" \") else 0\ndef telem(c, id_, seq, v, malo=False):\n    c.enviar(\"TELEM %s %d %s %s\\n\" % (id_, seq, v, \"ZZ\" if malo else cs(v)))\n    a = c.leer(); b = c.leer(timeout=0.6)\n    return a, b\nc = Linea(conectar(7070)); c.enviar(\"CONNECT ARES-9\\n\"); r = c.leer()\ncheck(r == \"REJECT ARES-9\", \"CONNECT ARES-9 → REJECT ARES-9\", \"CONNECT ARES-9: esperaba 'REJECT ARES-9', recibí %r\" % r)\na = Linea(conectar(7070)); a.enviar(\"CONNECT ARES-2\\n\"); r = a.leer()\ncheck(r == \"HELLO ARES-2\", \"CONNECT ARES-2 → HELLO ARES-2\", \"CONNECT ARES-2: esperaba 'HELLO ARES-2', recibí %r\" % r)\nb = Linea(conectar(7070)); b.enviar(\"CONNECT ARES-4\\n\"); r = b.leer()\ncheck(r == \"HELLO ARES-4\", \"Atiende una segunda sonda mientras la primera sigue conectada (concurrencia con fork)\", \"Con una sonda conectada no atiende a otra: ¿hiciste fork() por cliente? Recibí %r\" % r)\nr1, r2 = telem(a, \"ARES-2\", 1, \"3.00\")\ncheck(r1 == \"ACK ARES-2 1\" and not r2, \"ARES-2 valor 3.00 → ACK sin alerta\", \"ARES-2 3.00: esperaba solo 'ACK ARES-2 1', recibí %r / %r\" % (r1, r2))\nr1, r2 = telem(a, \"ARES-2\", 2, \"4.50\")\ncheck(r1 == \"ACK ARES-2 2\" and nivel(r2) == 1 and (r2 or \"\").startswith(\"ALERT ARES-2\"), \"ARES-2 valor 4.50 → ACK + ALERT nivel ALERTA\", \"ARES-2 4.50 (> 3.5): esperaba ACK y ALERT de nivel ALERTA, recibí %r / %r\" % (r1, r2))\nr1, r2 = telem(a, \"ARES-2\", 3, \"6.50\")\ncheck(r1 == \"ACK ARES-2 3\" and nivel(r2) == 2, \"ARES-2 valor 6.50 → ALERT nivel CRITICO (revisa crítico antes que alerta)\", \"ARES-2 6.50 (> 6.0): esperaba ALERT CRITICO, recibí %r / %r\" % (r1, r2))\nr1, r2 = telem(a, \"ARES-2\", 4, \"1.00\", malo=True)\ncheck(r1 == \"NACK ARES-2 4\", \"Checksum incorrecto → NACK ARES-2 4\", \"Con checksum incorrecto esperaba 'NACK ARES-2 4', recibí %r\" % r1)\nr1, r2 = telem(b, \"ARES-4\", 1, \"50.00\")\ncheck(r1 == \"ACK ARES-4 1\" and not r2, \"ARES-4 (menor que) 50.00 → sin alerta\", \"ARES-4 50.00: no debería alertar, recibí %r / %r\" % (r1, r2))\nr1, r2 = telem(b, \"ARES-4\", 2, \"20.00\")\ncheck(nivel(r2) == 1, \"ARES-4 20.00 (< 30) → ALERTA\", \"ARES-4 20.00: esperaba ALERTA (umbral 'menor que'), recibí %r\" % r2)\nr1, r2 = telem(b, \"ARES-4\", 3, \"10.00\")\ncheck(nivel(r2) == 2, \"ARES-4 10.00 (< 15) → CRITICO\", \"ARES-4 10.00: esperaba CRITICO, recibí %r\" % r2)\nterminar()\n"}}},{"id":"C01B","group":"control","n":"Parte B","topic":"sockets","lvl":2,"min":20,"pts":45,"title":"Control 01 · Cliente sonda","statement":"<p>El cliente simula una sonda. Recibe su ID, la IP del servidor y el valor inicial por línea de comandos (<code>./sonda ARES-2 127.0.0.1 3.0</code>).</p><p><b>B.1</b> (15 pts) crear el socket TCP y conectar. <b>B.2</b> (12 pts) enviar CONNECT y manejar HELLO o REJECT. <b>B.3</b> (18 pts) 8 lecturas con seq 1–8, el valor varía en cada iteración; recibir e imprimir la respuesta; <code>sleep(1)</code> entre envíos.</p>","files":[{"name":"sonda.c","code":"/* sonda.c — cliente ARES (Control 01) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 7070\n#define BUF_SIZE 256\n\nchar *checksum(const char *valor, char out[3]) {\n    unsigned int s = 0;\n    for (int i = 0; valor[i]; i++) s += (unsigned char)valor[i];\n    snprintf(out, 3, \"%02X\", s % 256);\n    return out;\n}\n\nint main(int argc, char *argv[]) {\n    if (argc < 4) {\n        fprintf(stderr, \"Uso: ./sonda <ARES-N> <IP> <valor_inicial>\\n\");\n        return 1;\n    }\n    const char *id = argv[1];\n    const char *ip = argv[2];\n    float valor = atof(argv[3]);\n    char buf[BUF_SIZE];\n//@TODO B.1 | Crear el socket TCP y conectar al servidor\n    int fd = socket(AF_INET, SOCK_STREAM, 0); //§\n    if (fd < 0) { perror(\"socket\"); return 1; }\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET; //§\n    srv.sin_port = htons(PORT); //§\n    if (inet_pton(AF_INET, ip, &srv.sin_addr) != 1) { fprintf(stderr, \"IP inválida\\n\"); return 1; } //§\n    if (connect(fd, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; } //§\n//@END\n//@TODO B.2 | Enviar CONNECT y manejar HELLO / REJECT\n    snprintf(buf, sizeof buf, \"CONNECT %s\\n\", id); //§\n    send(fd, buf, strlen(buf), 0); //§\n    int n = recv(fd, buf, sizeof(buf) - 1, 0); //§\n    if (n <= 0) { close(fd); return 1; }\n    buf[n] = '\\0'; //§\n    if (strncmp(buf, \"HELLO\", 5) != 0) { //§\n        printf(\"Rechazado: %s\", buf);\n        close(fd); //§\n        return 1;\n    }\n    printf(\"Conectado: %s\", buf);\n//@END\n//@TODO B.3 | 8 lecturas TELEM con seq 1..8, imprimir respuesta, sleep(1)\n    for (int seq = 1; seq <= 8; seq++) { //§\n        char valstr[32], cs[3];\n        valor += 0.6f;                              /* el valor varía en cada iteración */ //§\n        snprintf(valstr, sizeof valstr, \"%.2f\", valor); //§\n        checksum(valstr, cs); //§\n        snprintf(buf, sizeof buf, \"TELEM %s %d %s %s\\n\", id, seq, valstr, cs); //§\n        send(fd, buf, strlen(buf), 0); //§\n        n = recv(fd, buf, sizeof(buf) - 1, 0); //§\n        if (n <= 0) break; //§\n        buf[n] = '\\0'; //§\n        printf(\"%s\", buf);\n        sleep(1); //§\n    }\n    close(fd); //§\n//@END\n    return 0;\n}\n"}],"out":"Conectado: HELLO ARES-2\nACK ARES-2 1\nALERT ARES-2 ALERTA valor=3.60\n...\nACK ARES-2 6\nALERT ARES-2 CRITICO valor=6.60","hints":["B.1: sockaddr_in con AF_INET, htons(PORT) e inet_pton para la IP en texto.","B.2: compara el inicio de la respuesta con strncmp(buf, \"HELLO\", 5).","B.3: primero convierte el valor a texto, luego calcula el checksum sobre ESE texto."],"think":["B.1: socket(AF_INET, SOCK_STREAM, 0); memset; sin_family, sin_port = htons(PORT); inet_pton(AF_INET, ip, &sin_addr); connect.","B.2: snprintf \"CONNECT %s\\n\", send, recv, buf[n] = 0, si no empieza con HELLO → cerrar y salir.","B.3: for seq 1..8: valor += algo; snprintf(valstr, \"%.2f\"); checksum(valstr, cs); snprintf \"TELEM %s %d %s %s\\n\"; send; recv + imprimir; sleep(1)."],"errors":["Olvidar htons en el puerto.","Calcular el checksum sobre un string distinto al que se envía.","Olvidar el \\n final del mensaje."],"rubric":[{"pts":5,"t":"B.1: socket()"},{"pts":5,"t":"B.1: sockaddr_in con htons e inet_pton"},{"pts":5,"t":"B.1: connect con manejo de error"},{"pts":5,"t":"B.2: envía CONNECT con formato exacto"},{"pts":7,"t":"B.2: distingue HELLO de REJECT y sale si es rechazo"},{"pts":6,"t":"B.3: loop seq 1..8 con valor variable"},{"pts":6,"t":"B.3: TELEM con checksum correcto"},{"pts":6,"t":"B.3: recv + imprimir + sleep(1) + close"}],"lang":"c","pruebas":{"compilar":[{"src":["ref/C01A/servidor.c"],"out":"servidor_ref"},{"src":["sonda.c"],"out":"sonda"}],"pasos":[{"tipo":"iniciar","nombre":"Servidor de referencia","cmd":"./servidor_ref","puerto":7070,"log":"servidor.out","critico":true},{"tipo":"ejecutar","nombre":"Tu sonda ARES-2 (8 lecturas)","cmd":"./sonda ARES-2 127.0.0.1 3.0","timeout":15,"espera":{"contiene":["HELLO ARES-2","ACK ARES-2 1","ACK ARES-2 8","ALERT ARES-2"],"noContiene":["NACK"]}},{"tipo":"ejecutar","nombre":"Tu sonda con un ID inválido","cmd":"./sonda ARES-9 127.0.0.1 1.0","timeout":5,"espera":{"contiene":["REJECT ARES-9"],"noContiene":["ACK"]}}],"archivos":{"ref/C01A/servidor.c":"/* servidor.c — Base SELENE (Control 01) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <sys/wait.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 7070\n#define BUF_SIZE 256\n\nchar *checksum(const char *valor, char out[3]) {\n    unsigned int s = 0;\n    for (int i = 0; valor[i]; i++) s += (unsigned char)valor[i];\n    snprintf(out, 3, \"%02X\", s % 256);\n    return out;\n}\n\ntypedef struct {\n    char id[8];\n    float alerta;\n    float critico;\n    int mayor;  /* 1: alerta si valor > umbral | 0: si valor < umbral */\n} Umbral;\n\nUmbral umbrales[] = {\n    {\"ARES-1\", -40, -30, 1},\n    {\"ARES-2\", 3.5, 6.0, 1},\n    {\"ARES-3\", 750, 900, 1},\n    {\"ARES-4\", 30, 15, 0},\n};\n\n//@TODO A.2 | (parte 1) evaluar(): 0 = normal, 1 = ALERTA, 2 = CRITICO\n/* C estándar no permite funciones anidadas: evaluar() va fuera de handle_sonda() */\nint evaluar(const Umbral *u, float v) {\n    if (u->mayor) {\n        if (v > u->critico) return 2; //§\n        if (v > u->alerta) return 1; //§\n    } else {\n        if (v < u->critico) return 2; //§\n        if (v < u->alerta) return 1; //§\n    }\n    return 0;\n}\n//@END\n\nvoid handle_sonda(int fd) {\n    char buf[BUF_SIZE];\n//@TODO A.1 | Recibir CONNECT, validar el ID y responder HELLO o REJECT\n    char id[16], resp[BUF_SIZE];\n    Umbral *u = NULL;\n    int n = recv(fd, buf, sizeof(buf) - 1, 0); //§\n    if (n <= 0) return; //§\n    buf[n] = '\\0'; //§\n    if (sscanf(buf, \"CONNECT %15s\", id) != 1) return; //§\n    for (int i = 0; i < 4; i++)\n        if (strcmp(umbrales[i].id, id) == 0) u = &umbrales[i]; //§\n    if (u == NULL) {\n        snprintf(resp, sizeof resp, \"REJECT %s\\n\", id); //§\n        send(fd, resp, strlen(resp), 0); //§\n        return;\n    }\n    snprintf(resp, sizeof resp, \"HELLO %s\\n\", id); //§\n    send(fd, resp, strlen(resp), 0); //§\n    printf(\"[BASE] %s conectada\\n\", id);\n//@END\n//@TODO A.2 | Loop TELEM: validar checksum, ACK/NACK, evaluar y ALERT\n    const char *nivel_txt[] = { \"NORMAL\", \"ALERTA\", \"CRITICO\" };\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        char tid[16], valor[32], cs[8], calc[3];\n        int seq;\n        if (sscanf(buf, \"TELEM %15s %d %31s %7s\", tid, &seq, valor, cs) != 4) continue; //§\n        if (strcmp(checksum(valor, calc), cs) != 0) { //§\n            snprintf(resp, sizeof resp, \"NACK %s %d\\n\", tid, seq); //§\n            send(fd, resp, strlen(resp), 0);\n            continue;\n        }\n        int nivel = evaluar(u, atof(valor)); //§\n        int len = snprintf(resp, sizeof resp, \"ACK %s %d\\n\", tid, seq); //§\n        if (nivel > 0) /* ACK + ALERT en un solo send: TCP no separa mensajes */\n            snprintf(resp + len, sizeof resp - len, \"ALERT %s %s valor=%s\\n\", tid, nivel_txt[nivel], valor); //§\n        send(fd, resp, strlen(resp), 0); //§\n        printf(\"[BASE] %s seq=%d valor=%s -> %s\\n\", tid, seq, valor, nivel_txt[nivel]);\n    }\n//@END\n}\n\nint main(void) {\n//@TODO A.3 | socket, bind, listen y fork() por cada sonda\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    int opt = 1;\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof opt);\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET; //§\n    addr.sin_addr.s_addr = INADDR_ANY; //§\n    addr.sin_port = htons(PORT); //§\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); exit(1); } //§\n    listen(srv, 8); //§\n    signal(SIGCHLD, SIG_IGN);                   /* evita zombis */ //§\n    printf(\"[BASE] escuchando en %d\\n\", PORT);\n    while (1) {\n        int cli = accept(srv, NULL, NULL); //§\n        if (cli < 0) continue;\n        fflush(stdout);\n        if (fork() == 0) { //§\n            close(srv);                         /* el hijo no acepta conexiones */ //§\n            handle_sonda(cli); //§\n            close(cli);\n            exit(0); //§\n        }\n        close(cli);                             /* el padre no habla con la sonda */ //§\n    }\n//@END\n    return 0;\n}\n"}}},{"id":"P1","group":"cert","n":"P1 ⭐","topic":"pipes","lvl":1,"min":12,"title":"Sensor de radiación — Canterbury","statement":"<p>Comunicación padre-hijo con un pipe. El hijo (sensor) genera 10 lecturas aleatorias entre 0.0 y 10.0, una por segundo, y las envía como <code>RAD &lt;valor&gt;\\n</code>. El padre imprime el nivel: NORMAL (&lt;3.0), ELEVADO (3.0–6.0), CRITICO (&gt;6.0). Al final espera al hijo con <code>wait()</code> e imprime el resumen.</p>","files":[{"name":"p1_canterbury.c","code":"/* p1_canterbury.c — sensor de radiación por pipe */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\n#define LECTURAS 10\n\nint main(void) {\n    int fd[2];\n//@TODO 1 | Crear el pipe y el proceso hijo\n    if (pipe(fd) < 0) { perror(\"pipe\"); return 1; } //§\n    pid_t pid = fork(); //§\n    if (pid < 0) { perror(\"fork\"); return 1; }\n//@END\n    if (pid == 0) {\n//@TODO 2 | HIJO (sensor): 10 lecturas \"RAD <valor>\\n\", una por segundo\n        close(fd[0]);                       /* el sensor solo escribe */ //§\n        srand(getpid());\n        for (int i = 0; i < LECTURAS; i++) {\n            float rad = (rand() % 1001) / 100.0f;     /* 0.00 a 10.00 */ //§\n            char msg[32];\n            int len = snprintf(msg, sizeof msg, \"RAD %.2f\\n\", rad); //§\n            printf(\"[SENSOR] Enviando RAD %.2f\\n\", rad);\n            fflush(stdout);\n            write(fd[1], msg, len); //§\n            sleep(1);\n        }\n        close(fd[1]);                       /* EOF para el padre */ //§\n        exit(0);\n//@END\n    }\n//@TODO 3 | PADRE (puente): leer líneas, clasificar, wait() y resumen\n    close(fd[1]);                           /* el puente solo lee */ //§\n    FILE *in = fdopen(fd[0], \"r\");          /* permite leer línea a línea con fgets */ //§\n    char linea[64];\n    int normal = 0, elevado = 0, critico = 0;\n    while (fgets(linea, sizeof linea, in) != NULL) { //§\n        float v;\n        if (sscanf(linea, \"RAD %f\", &v) != 1) continue; //§\n        const char *nivel;\n        if (v < 3.0f)       { nivel = \"NORMAL\";  normal++; } //§\n        else if (v <= 6.0f) { nivel = \"ELEVADO\"; elevado++; } //§\n        else                { nivel = \"CRITICO\"; critico++; } //§\n        printf(\"[PUENTE] RAD %.2f → %s\\n\", v, nivel);\n    }\n    fclose(in);\n    wait(NULL); //§\n    printf(\"[PUENTE] Resumen: NORMAL=%d ELEVADO=%d CRITICO=%d\\n\", normal, elevado, critico);\n//@END\n    return 0;\n}\n"}],"out":"[SENSOR] Enviando RAD 2.34\n[PUENTE] RAD 2.34 → NORMAL\n...\n[PUENTE] Resumen: NORMAL=3 ELEVADO=3 CRITICO=4","hints":["pipe() ANTES de fork(), para que ambos procesos hereden los descriptores.","fdopen(fd, \"r\") convierte el descriptor en FILE* y permite usar fgets línea a línea.","El padre sabe que terminó cuando fgets retorna NULL: eso ocurre cuando el hijo cierra fd[1]."],"think":["pipe(fd), fork().","Hijo: close(fd[0]); 10 veces snprintf + write; close(fd[1]); exit.","Padre: close(fd[1]) (si no lo cierra, nunca llega EOF); fdopen + fgets + sscanf; contadores; wait(NULL)."],"errors":["Que el padre no cierre fd[1]: fgets nunca retorna NULL y el programa se cuelga.","Leer con read() suponiendo que cada read trae exactamente una línea."],"rubric":[{"pts":2,"t":"pipe() antes de fork()"},{"pts":2,"t":"Cada proceso cierra el extremo que no usa"},{"pts":2,"t":"Hijo: 10 lecturas con formato y sleep(1)"},{"pts":2,"t":"Padre: lee líneas y clasifica bien los rangos"},{"pts":2,"t":"wait() y resumen"}],"lang":"c","pruebas":{"compilar":[{"src":["p1_canterbury.c"],"out":"p1"}],"pasos":[{"tipo":"ejecutar","nombre":"Ejecutar (10 lecturas, ~10 s)","cmd":"./p1","timeout":20,"guardar":"salida.txt"},{"tipo":"python","nombre":"Clasificación y resumen","archivo":"prueba/p1.py"}],"archivos":{"prueba/p1.py":"\"\"\"Revisa la salida del P1: cada RAD clasificado según su rango y el resumen.\"\"\"\nimport re\nfrom cognition_prueba import *\ns = leer_archivo(\"salida.txt\")\npares = re.findall(r\"RAD\\s+([\\d.]+)\\D*?(NORMAL|ELEVADO|CRITICO)\", s)\ncheck(len(pares) == 10, \"El puente clasificó 10 lecturas\", \"Esperaba 10 lecturas clasificadas, encontré %d\" % len(pares))\nmalos = [(v, n) for v, n in pares if n != (\"NORMAL\" if float(v) < 3 else \"ELEVADO\" if float(v) <= 6 else \"CRITICO\")]\ncheck(not malos, \"Todas las lecturas están en el nivel correcto\", \"Clasificación incorrecta: %s\" % malos[:3])\nm = re.search(r\"NORMAL=(\\d+)\\D+ELEVADO=(\\d+)\\D+CRITICO=(\\d+)\", s)\nif m:\n    cuenta = [sum(1 for _, n in pares if n == k) for k in (\"NORMAL\", \"ELEVADO\", \"CRITICO\")]\n    check([int(x) for x in m.groups()] == cuenta, \"El resumen coincide con las lecturas\", \"El resumen %s no coincide con lo contado %s\" % (m.groups(), cuenta))\nelse:\n    falla(\"No encontré el resumen 'NORMAL=.. ELEVADO=.. CRITICO=..'\")\nterminar()\n"}}},{"id":"P2","group":"cert","n":"P2 ⭐⭐","topic":"pipes","lvl":2,"min":15,"title":"Pipeline de telemetría — Rocinante","statement":"<p>Pipeline de 3 procesos con 2 pipes. A (sensor) escribe 15 <code>TEMP &lt;v&gt;</code> entre −50 y 300 °C en pipe1. B (filtro) deja pasar solo 20–200 °C como <code>TEMP_OK &lt;v&gt;</code> a pipe2 e imprime los descartados. C (puente) imprime \"Temperatura operacional\". Cada proceso cierra lo que no usa inmediatamente después del fork.</p>","files":[{"name":"p2_rocinante.c","code":"/* p2_rocinante.c — pipeline sensor -> filtro -> puente */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\nint pipe1[2], pipe2[2];\n\nvoid sensor(void) {                 /* proceso A */\n//@TODO 2 | A: cerrar lo que no usa y escribir 15 \"TEMP <v>\\n\" en pipe1\n    close(pipe1[0]); close(pipe2[0]); close(pipe2[1]); //§\n    srand(getpid());\n    for (int i = 0; i < 15; i++) {\n        float t = -50 + rand() % 351;          /* -50 a 300 °C */ //§\n        char msg[32];\n        int len = snprintf(msg, sizeof msg, \"TEMP %.1f\\n\", t); //§\n        write(pipe1[1], msg, len); //§\n    }\n    close(pipe1[1]); //§\n//@END\n    exit(0);\n}\n\nvoid filtro(void) {                 /* proceso B */\n//@TODO 3 | B: leer pipe1, pasar a pipe2 solo 20..200 como \"TEMP_OK <v>\\n\"\n    close(pipe1[1]); close(pipe2[0]); //§\n    FILE *in = fdopen(pipe1[0], \"r\"); //§\n    char linea[64];\n    float t;\n    while (fgets(linea, sizeof linea, in)) { //§\n        if (sscanf(linea, \"TEMP %f\", &t) != 1) continue;\n        if (t >= 20 && t <= 200) { //§\n            char msg[32];\n            int len = snprintf(msg, sizeof msg, \"TEMP_OK %.1f\\n\", t); //§\n            write(pipe2[1], msg, len); //§\n        } else {\n            printf(\"[FILTRO] Descartado: %.1f\\n\", t);\n        }\n    }\n    fclose(in);\n    close(pipe2[1]);                        /* EOF para el puente */ //§\n//@END\n    exit(0);\n}\n\nvoid puente(void) {                 /* proceso C */\n//@TODO 4 | C: leer pipe2 e imprimir\n    close(pipe2[1]); close(pipe1[0]); close(pipe1[1]); //§\n    FILE *in = fdopen(pipe2[0], \"r\"); //§\n    char linea[64];\n    float t;\n    while (fgets(linea, sizeof linea, in)) //§\n        if (sscanf(linea, \"TEMP_OK %f\", &t) == 1) //§\n            printf(\"[PUENTE] Temperatura operacional: %.1f°C\\n\", t);\n    fclose(in);\n//@END\n    exit(0);\n}\n\nint main(void) {\n//@TODO 1 | Crear los 2 pipes, los 3 procesos, y que el padre cierre todo y espere\n    pipe(pipe1); //§\n    pipe(pipe2); //§\n    setvbuf(stdout, NULL, _IOLBF, 0);\n    if (fork() == 0) sensor(); //§\n    if (fork() == 0) filtro(); //§\n    if (fork() == 0) puente(); //§\n    close(pipe1[0]); close(pipe1[1]); close(pipe2[0]); close(pipe2[1]); //§\n    for (int i = 0; i < 3; i++) wait(NULL); //§\n//@END\n    return 0;\n}\n"}],"hints":["Dibuja los 4 extremos (pipe1[0], pipe1[1], pipe2[0], pipe2[1]) y marca quién usa cada uno.","El padre también tiene copias de los 4 extremos: debe cerrarlos todos o C nunca verá EOF."],"think":["A usa solo pipe1[1]; B usa pipe1[0] y pipe2[1]; C usa solo pipe2[0].","B debe cerrar pipe2[1] al terminar, para que C reciba EOF.","El padre crea ambos pipes, hace los 3 fork, cierra los 4 extremos y espera 3 veces."],"errors":["El padre no cierra pipe2[1]: el puente se queda esperando para siempre.","Crear pipe2 después del primer fork: A y B no comparten el mismo pipe."],"rubric":[{"pts":2,"t":"Crea los 2 pipes antes de los fork"},{"pts":3,"t":"Cierres correctos en A, B, C y el padre"},{"pts":2,"t":"A genera 15 lecturas en el rango"},{"pts":2,"t":"B filtra 20–200 y reenvía con TEMP_OK"},{"pts":1,"t":"C imprime y el padre espera a los 3"}],"lang":"c","pruebas":{"compilar":[{"src":["p2_rocinante.c"],"out":"p2"}],"pasos":[{"tipo":"ejecutar","nombre":"Ejecutar el pipeline","cmd":"./p2","timeout":10,"guardar":"salida.txt"},{"tipo":"python","nombre":"Filtro y puente","archivo":"prueba/p2.py"}],"archivos":{"prueba/p2.py":"import re\nfrom cognition_prueba import *\ns = leer_archivo(\"salida.txt\")\nok_ = [float(x) for x in re.findall(r\"operacional:\\s*(-?[\\d.]+)\", s)]\ndesc = [float(x) for x in re.findall(r\"Descartado:\\s*(-?[\\d.]+)\", s)]\ncheck(len(ok_) + len(desc) == 15, \"Se procesaron las 15 lecturas (pasadas + descartadas)\", \"Esperaba 15 lecturas en total, vi %d operacionales y %d descartadas\" % (len(ok_), len(desc)))\ncheck(all(20 <= t <= 200 for t in ok_), \"El puente solo recibe temperaturas entre 20 y 200\", \"Llegaron al puente valores fuera de rango: %s\" % [t for t in ok_ if not 20 <= t <= 200][:3])\ncheck(all(not 20 <= t <= 200 for t in desc), \"El filtro solo descarta valores fuera de rango\", \"Se descartaron valores válidos: %s\" % [t for t in desc if 20 <= t <= 200][:3])\nterminar()\n"}}},{"id":"P3","group":"cert","n":"P3 ⭐⭐⭐","topic":"pipes","lvl":3,"min":20,"title":"Sistema de alertas — Tycho Station","statement":"<p>N=5 hijos (REACTOR, OXIGENO, AGUA, GRAVITON, HANGAR), cada uno con su pipe al padre. Cada hijo envía 5 <code>MODULO &lt;nombre&gt; STATUS &lt;OK|WARN|CRIT&gt;</code>. El padre usa <code>select()</code> sobre los 5 descriptores, imprime cada mensaje con hora (<code>time()</code>) y termina cuando todos cerraron su pipe, con un resumen por severidad y módulo.</p>","files":[{"name":"p3_tycho.c","code":"/* p3_tycho.c — N hijos, un pipe cada uno, select() en el padre */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <unistd.h>\n#include <sys/wait.h>\n#include <sys/select.h>\n\n#define N 5\n#define MSG_LEN 64      /* mensajes de largo fijo: cada read() trae uno completo */\n\nconst char *modulos[N] = { \"REACTOR\", \"OXIGENO\", \"AGUA\", \"GRAVITON\", \"HANGAR\" };\nconst char *niveles[3] = { \"OK\", \"WARN\", \"CRIT\" };\n\nvoid modulo(int i, int wfd) {\n    srand(getpid());\n    for (int k = 0; k < 5; k++) {\n        char msg[MSG_LEN] = {0};\n        snprintf(msg, MSG_LEN, \"MODULO %s STATUS %s\\n\", modulos[i], niveles[rand() % 3]);\n        write(wfd, msg, MSG_LEN);           /* MSG_LEN < PIPE_BUF: escritura atómica */\n        usleep((rand() % 500) * 1000);\n    }\n    close(wfd);\n    exit(0);\n}\n\nint main(void) {\n    int pipes[N][2];\n    int abiertos = N;\n    int conteo[N][3] = {{0}};\n//@TODO 1 | Crear N pipes y N hijos; cada hijo cierra lo que no usa\n    for (int i = 0; i < N; i++) pipe(pipes[i]); //§\n    for (int i = 0; i < N; i++) {\n        if (fork() == 0) {\n            for (int j = 0; j < N; j++) {\n                close(pipes[j][0]);                     /* ningún hijo lee */ //§\n                if (j != i) close(pipes[j][1]);         /* solo escribe en el suyo */ //§\n            }\n            modulo(i, pipes[i][1]);\n        }\n    }\n    for (int i = 0; i < N; i++) close(pipes[i][1]);     /* el padre solo lee */ //§\n//@END\n//@TODO 2 | Loop con select() hasta que todos los hijos cierren su pipe\n    while (abiertos > 0) { //§\n        fd_set rd;\n        int maxfd = -1;\n        FD_ZERO(&rd); //§\n        for (int i = 0; i < N; i++)\n            if (pipes[i][0] >= 0) { //§\n                FD_SET(pipes[i][0], &rd); //§\n                if (pipes[i][0] > maxfd) maxfd = pipes[i][0];\n            }\n        if (select(maxfd + 1, &rd, NULL, NULL, NULL) < 0) { perror(\"select\"); break; } //§\n        for (int i = 0; i < N; i++) {\n            if (pipes[i][0] < 0 || !FD_ISSET(pipes[i][0], &rd)) continue; //§\n            char msg[MSG_LEN];\n            int n = read(pipes[i][0], msg, MSG_LEN); //§\n            if (n <= 0) {                       /* EOF: el hijo terminó */ //§\n                close(pipes[i][0]);\n                pipes[i][0] = -1; //§\n                abiertos--; //§\n                continue;\n            }\n            char nombre[16], nivel[8];\n            if (sscanf(msg, \"MODULO %15s STATUS %7s\", nombre, nivel) != 2) continue; //§\n            for (int k = 0; k < 3; k++) if (strcmp(nivel, niveles[k]) == 0) conteo[i][k]++; //§\n            time_t t = time(NULL);\n            char hora[16];\n            strftime(hora, sizeof hora, \"%H:%M:%S\", localtime(&t));\n            printf(\"[%s] %s\", hora, msg);\n        }\n    }\n//@END\n    while (wait(NULL) > 0) ;\n    printf(\"\\nResumen por módulo:\\n\");\n    for (int i = 0; i < N; i++)\n        printf(\"  %-9s OK=%d WARN=%d CRIT=%d\\n\", modulos[i], conteo[i][0], conteo[i][1], conteo[i][2]);\n    return 0;\n}\n"}],"qs":[{"q":"El enunciado dice que termina cuando \"select() retorna 0 para todos\". ¿Es exacto?","a":"No del todo: select() con timeout NULL no retorna 0. Lo que indica que un hijo terminó es que su descriptor queda \"listo\" y <b>read() retorna 0 (EOF)</b>. Se cierra ese fd, se saca del conjunto y se termina cuando no queda ninguno abierto."},{"q":"¿Por qué la solución usa mensajes de largo fijo (64 bytes)?","a":"Un read() en un pipe puede traer varios mensajes juntos o uno cortado. Si todos los write() son de 64 bytes (menos que PIPE_BUF, así que son atómicos) y se lee exactamente 64, cada read() trae <b>un mensaje completo</b>. La alternativa es un buffer acumulador por descriptor."}],"hints":["select() modifica el fd_set: hay que reconstruirlo (FD_ZERO + FD_SET) en cada vuelta.","Necesitas el mayor fd + 1 como primer argumento.","Marca con −1 los pipes ya cerrados para no volver a agregarlos."],"think":["Crear 5 pipes, 5 fork. Cada hijo cierra todos los extremos de lectura y los de escritura ajenos.","Padre: cierra todos los de escritura.","Loop mientras haya abiertos: FD_ZERO, FD_SET de los abiertos, select, revisar FD_ISSET, read; si 0 → cerrar y abiertos--."],"errors":["No reconstruir el fd_set en cada iteración.","No cerrar en el padre los extremos de escritura: read nunca da 0."],"rubric":[{"pts":2,"t":"5 pipes + 5 hijos con cierres correctos"},{"pts":3,"t":"fd_set reconstruido y select() con maxfd + 1"},{"pts":2,"t":"Lee solo los fd listos y detecta EOF"},{"pts":2,"t":"Imprime con hora y cuenta por severidad"},{"pts":1,"t":"Termina cuando todos cierran y espera a los hijos"}],"lang":"c","pruebas":{"compilar":[{"src":["p3_tycho.c"],"out":"p3"}],"pasos":[{"tipo":"ejecutar","nombre":"Ejecutar los 5 módulos","cmd":"./p3","timeout":15,"guardar":"salida.txt"},{"tipo":"python","nombre":"Mensajes recibidos con select()","archivo":"prueba/p3.py"}],"archivos":{"prueba/p3.py":"import re\nfrom cognition_prueba import *\ns = leer_archivo(\"salida.txt\")\nmsgs = re.findall(r\"MODULO\\s+(\\w+)\\s+STATUS\\s+(OK|WARN|CRIT)\", s)\ncheck(len(msgs) == 25, \"El padre recibió los 25 mensajes (5 módulos × 5)\", \"Esperaba 25 mensajes, recibí %d\" % len(msgs))\nfor m in [\"REACTOR\", \"OXIGENO\", \"AGUA\", \"GRAVITON\", \"HANGAR\"]:\n    n = sum(1 for x, _ in msgs if x == m)\n    check(n == 5, \"%s: 5 mensajes\" % m, \"%s: esperaba 5 mensajes, recibí %d\" % (m, n))\nterminar()\n"}}},{"id":"S1","group":"cert","n":"S1 ⭐","topic":"sockets","lvl":1,"min":12,"title":"Relay OPA — transmisión básica","statement":"<p>Servidor TCP en el puerto 7001 que atiende <b>un</b> cliente: imprime \"[RELAY] Recibido: &lt;msg&gt;\" y responde <code>ACK &lt;msg&gt;\\n</code> hasta que recv() retorne 0. El cliente envía 5 <code>MSG nave_OPA_1 dato_&lt;i&gt;\\n</code> y espera el ACK de cada uno.</p>","files":[{"name":"s1_relay.c","code":"/* s1_relay.c — servidor TCP de 1 cliente, eco con ACK */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 7001\n\nint main(void) {\n//@TODO 1 | socket, SO_REUSEADDR, bind, listen, accept (1 cliente)\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET; //§\n    addr.sin_addr.s_addr = INADDR_ANY; //§\n    addr.sin_port = htons(PORT); //§\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; } //§\n    listen(srv, 1); //§\n    printf(\"[RELAY] escuchando en %d\\n\", PORT);\n    int cli = accept(srv, NULL, NULL); //§\n//@END\n//@TODO 2 | Loop: recv, imprimir, responder \"ACK <msg>\\n\"; terminar si recv <= 0\n    char buf[256], resp[300];\n    int n;\n    while ((n = recv(cli, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        buf[strcspn(buf, \"\\n\")] = '\\0';             /* quitar el \\n */ //§\n        printf(\"[RELAY] Recibido: %s\\n\", buf);\n        snprintf(resp, sizeof resp, \"ACK %s\\n\", buf); //§\n        send(cli, resp, strlen(resp), 0); //§\n    }\n    printf(\"[RELAY] cliente desconectado\\n\");\n    close(cli); //§\n    close(srv); //§\n//@END\n    return 0;\n}\n"},{"name":"s1_cliente.c","code":"/* s1_cliente.c — envía 5 mensajes y espera el ACK de cada uno */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 7001\n\nint main(int argc, char *argv[]) {\n    const char *ip = argc > 1 ? argv[1] : \"127.0.0.1\";\n//@TODO 1 | socket + connect\n    int fd = socket(AF_INET, SOCK_STREAM, 0); //§\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET; //§\n    srv.sin_port = htons(PORT); //§\n    inet_pton(AF_INET, ip, &srv.sin_addr); //§\n    if (connect(fd, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; } //§\n//@END\n//@TODO 2 | 5 mensajes \"MSG nave_OPA_1 dato_<i>\\n\", esperando ACK cada vez\n    char msg[64], buf[256];\n    for (int i = 1; i <= 5; i++) {\n        snprintf(msg, sizeof msg, \"MSG nave_OPA_1 dato_%d\\n\", i); //§\n        send(fd, msg, strlen(msg), 0); //§\n        int n = recv(fd, buf, sizeof(buf) - 1, 0); //§\n        if (n <= 0) break; //§\n        buf[n] = '\\0'; //§\n        printf(\"Servidor: %s\", buf);\n    }\n    close(fd); //§\n//@END\n    return 0;\n}\n"}],"hints":["Servidor: socket → setsockopt(SO_REUSEADDR) → bind → listen → accept.","accept() retorna un NUEVO descriptor: con ese hablas con el cliente.","strcspn(buf, \"\\n\") da la posición del salto de línea para quitarlo."],"think":["Servidor: el socket de escucha (srv) y el de conexión (cli) son distintos.","while ((n = recv(cli, ...)) > 0): null-terminar, quitar \\n, imprimir, enviar ACK.","Cliente: connect y luego 5 veces send + recv."],"errors":["Hacer recv sobre srv en vez de cli.","Olvidar htons(PORT)."],"rubric":[{"pts":3,"t":"Servidor: socket/bind/listen/accept"},{"pts":2,"t":"Loop recv con término en 0"},{"pts":2,"t":"Responde ACK <msg>"},{"pts":3,"t":"Cliente: connect + 5 envíos esperando ACK"}],"lang":"c","pruebas":{"compilar":[{"src":["s1_relay.c"],"out":"s1_relay"},{"src":["s1_cliente.c"],"out":"s1_cliente"}],"pasos":[{"tipo":"iniciar","nombre":"Tu relay","cmd":"./s1_relay","puerto":7001,"log":"relay.out","critico":true},{"tipo":"ejecutar","nombre":"Tu cliente envía 5 mensajes","cmd":"./s1_cliente","timeout":8,"espera":{"contiene":["ACK MSG nave_OPA_1 dato_1","ACK MSG nave_OPA_1 dato_5"]}}],"archivos":{}}},{"id":"S2","group":"cert","n":"S2 ⭐⭐","topic":"sockets","lvl":2,"min":15,"title":"Puerto Ceres — servidor concurrente","statement":"<p>Puerto 7002, <code>fork()</code> por cliente. Protocolo: <code>DOCK &lt;nave&gt; &lt;tipo_carga&gt;</code> → <code>ASIGNADO &lt;bahia&gt;</code> (AGUA→Bahia-A, SILICATOS→Bahia-B, OXIGENO→Bahia-C, COMBUSTIBLE→Bahia-D). Puede haber varios DOCK. <code>CAST_OFF</code> → <code>BYE</code> y cerrar. Sin zombis; el hijo cierra el socket del servidor apenas hace fork.</p>","files":[{"name":"s2_ceres.c","code":"/* s2_ceres.c — servidor concurrente de atraque */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 7002\n\nconst char *bahia_para(const char *carga) {\n//@TODO 1 | Tabla carga -> bahía\n    if (strcmp(carga, \"AGUA\") == 0)        return \"Bahia-A\"; //§\n    if (strcmp(carga, \"SILICATOS\") == 0)   return \"Bahia-B\"; //§\n    if (strcmp(carga, \"OXIGENO\") == 0)     return \"Bahia-C\"; //§\n    if (strcmp(carga, \"COMBUSTIBLE\") == 0) return \"Bahia-D\"; //§\n    return NULL; //§\n//@END\n}\n\nvoid atender_nave(int fd) {\n//@TODO 2 | Protocolo DOCK / CAST_OFF\n    char buf[256], nave[32], carga[32], resp[64];\n    int n;\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        if (strncmp(buf, \"CAST_OFF\", 8) == 0) { //§\n            send(fd, \"BYE\\n\", 4, 0); //§\n            break; //§\n        }\n        const char *b = NULL;\n        if (sscanf(buf, \"DOCK %31s %31s\", nave, carga) == 2) //§\n            b = bahia_para(carga); //§\n        if (b) {\n            snprintf(resp, sizeof resp, \"ASIGNADO %s\\n\", b); //§\n            printf(\"[CERES %d] %s con %s -> %s\\n\", getpid(), nave, carga, b);\n        } else {\n            snprintf(resp, sizeof resp, \"ERROR\\n\");\n        }\n        send(fd, resp, strlen(resp), 0); //§\n    }\n    close(fd); //§\n//@END\n}\n\nint main(void) {\n//@TODO 3 | Servidor concurrente: fork() por cliente y sin zombis\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT); //§\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; } //§\n    listen(srv, 10); //§\n    signal(SIGCHLD, SIG_IGN);                   /* sin zombis */ //§\n    printf(\"[CERES] escuchando en %d\\n\", PORT);\n    while (1) {\n        int cli = accept(srv, NULL, NULL); //§\n        if (cli < 0) continue;\n        fflush(stdout);\n        if (fork() == 0) { //§\n            close(srv);                         /* inmediatamente después del fork */ //§\n            atender_nave(cli); //§\n            exit(0); //§\n        }\n        close(cli); //§\n    }\n//@END\n}\n"}],"hints":["signal(SIGCHLD, SIG_IGN) antes del loop evita los zombis.","Tras el fork: el hijo cierra srv y el padre cierra cli."],"think":["Una función bahia_para(carga) con strcmp que retorna el nombre o NULL.","atender_nave: while recv; si empieza con CAST_OFF → BYE y break; si sscanf \"DOCK %s %s\" → ASIGNADO.","main: loop accept → fork."],"errors":["Que el hijo no termine con exit(): vuelve al loop de accept.","No cerrar cli en el padre: se agotan los descriptores."],"rubric":[{"pts":2,"t":"Tabla carga → bahía"},{"pts":2,"t":"Protocolo DOCK / CAST_OFF"},{"pts":3,"t":"fork por cliente con cierres correctos"},{"pts":2,"t":"Evita zombis"},{"pts":1,"t":"El hijo termina con exit()"}],"lang":"c","pruebas":{"compilar":[{"src":["s2_ceres.c"],"out":"s2"}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor Ceres","cmd":"./s2","puerto":7002,"log":"ceres.out","critico":true},{"tipo":"python","nombre":"Protocolo DOCK / CAST_OFF","archivo":"prueba/s2.py"}],"archivos":{"prueba/s2.py":"from cognition_prueba import *\na = Linea(conectar(7002)); b = Linea(conectar(7002))\nfor carga, bahia in [(\"AGUA\", \"Bahia-A\"), (\"SILICATOS\", \"Bahia-B\"), (\"OXIGENO\", \"Bahia-C\"), (\"COMBUSTIBLE\", \"Bahia-D\")]:\n    a.enviar(\"DOCK Rocinante %s\\n\" % carga); r = a.leer()\n    check(r == \"ASIGNADO \" + bahia, \"DOCK con %s → ASIGNADO %s\" % (carga, bahia), \"DOCK %s: esperaba 'ASIGNADO %s', recibí %r\" % (carga, bahia, r))\nb.enviar(\"DOCK Donnager AGUA\\n\"); r = b.leer()\ncheck(r == \"ASIGNADO Bahia-A\", \"Atiende a dos naves a la vez (fork por cliente)\", \"La segunda nave no recibió respuesta: %r\" % r)\na.enviar(\"CAST_OFF\\n\"); r = a.leer()\ncheck(r == \"BYE\", \"CAST_OFF → BYE\", \"CAST_OFF: esperaba BYE, recibí %r\" % r)\ncheck(a.leer(timeout=1) is None, \"Después de BYE el servidor cierra la conexión\", \"Después de BYE la conexión sigue respondiendo\")\nterminar()\n"}}},{"id":"S3","group":"cert","n":"S3 ⭐⭐⭐","topic":"sockets","lvl":3,"min":25,"title":"Intel MCRN — protocolo completo","statement":"<p>Puerto 7003. Mensajes: <code>REPORT &lt;agente&gt; &lt;dato&gt;</code> (guarda el último dato; máx. 10 agentes; responde STORED), <code>QUERY &lt;agente&gt;</code> (dato o UNKNOWN), <code>ALERT &lt;nivel&gt; &lt;mensaje&gt;</code> (imprime con hora, responde ACK_ALERT; nivel 3 desconecta), <code>STATUS</code> (<code>AGENTS &lt;n&gt;</code>). recv() puede traer mensajes parciales: implementa un <b>buffer acumulador</b> que procese solo las líneas completas.</p>","files":[{"name":"s3_mcrn.c","code":"/* s3_mcrn.c — protocolo REPORT/QUERY/ALERT/STATUS con buffer acumulador */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 7003\n#define MAX_AGENTES 10\n\n/* Atención: si usáramos fork() por cliente, cada hijo tendría su PROPIA copia de esta tabla.\n   Por eso el servidor es iterativo: un proceso, la tabla es compartida entre clientes sucesivos. */\ntypedef struct { char nombre[32]; char dato[128]; } Agente;\nAgente agentes[MAX_AGENTES];\nint n_agentes = 0;\n\n/* Retorna 1 si hay que desconectar al cliente */\nint procesar_mensaje(char *msg, int fd) {\n//@TODO 1 | Despachar los 4 tipos de mensaje\n    char a[32], resto[128], resp[200];\n    int nivel;\n    if (sscanf(msg, \"REPORT %31s %127[^\\n]\", a, resto) == 2) { //§\n        int i;\n        for (i = 0; i < n_agentes; i++) if (strcmp(agentes[i].nombre, a) == 0) break; //§\n        if (i == n_agentes && n_agentes < MAX_AGENTES) { //§\n            strcpy(agentes[i].nombre, a);\n            n_agentes++; //§\n        }\n        if (i < MAX_AGENTES) snprintf(agentes[i].dato, sizeof agentes[i].dato, \"%s\", resto); //§\n        snprintf(resp, sizeof resp, \"STORED\\n\");\n    } else if (sscanf(msg, \"QUERY %31s\", a) == 1) { //§\n        snprintf(resp, sizeof resp, \"UNKNOWN\\n\");\n        for (int i = 0; i < n_agentes; i++)\n            if (strcmp(agentes[i].nombre, a) == 0) snprintf(resp, sizeof resp, \"%s\\n\", agentes[i].dato); //§\n    } else if (sscanf(msg, \"ALERT %d %127[^\\n]\", &nivel, resto) == 2) { //§\n        time_t t = time(NULL);\n        char hora[16];\n        strftime(hora, sizeof hora, \"%H:%M:%S\", localtime(&t));\n        printf(\"[%s] ALERTA nivel %d: %s\\n\", hora, nivel, resto); //§\n        send(fd, \"ACK_ALERT\\n\", 10, 0); //§\n        return nivel == 3;              /* nivel 3: desconectar tras responder */ //§\n    } else if (strcmp(msg, \"STATUS\") == 0) { //§\n        snprintf(resp, sizeof resp, \"AGENTS %d\\n\", n_agentes); //§\n    } else {\n        snprintf(resp, sizeof resp, \"ERROR\\n\");\n    }\n    send(fd, resp, strlen(resp), 0); //§\n    return 0;\n//@END\n}\n\nvoid atender(int fd) {\n//@TODO 2 | Buffer acumulador: procesar solo líneas completas\n    char buf[4096];\n    int total = 0, n;\n    while ((n = recv(fd, buf + total, sizeof(buf) - total - 1, 0)) > 0) { //§\n        total += n; //§\n        buf[total] = '\\0'; //§\n        char *nl;\n        while ((nl = strchr(buf, '\\n')) != NULL) { //§\n            *nl = '\\0'; //§\n            if (nl > buf && nl[-1] == '\\r') nl[-1] = '\\0';\n            int salir = procesar_mensaje(buf, fd); //§\n            int usado = (nl - buf) + 1;\n            memmove(buf, nl + 1, total - usado + 1);    /* +1 copia el '\\0' */ //§\n            total -= usado; //§\n            if (salir) return;\n        }\n        if (total >= (int)sizeof(buf) - 1) total = 0;   /* línea demasiado larga: descartar */\n    }\n//@END\n}\n\nint main(void) {\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 10);\n    printf(\"[MCRN] escuchando en %d\\n\", PORT);\n    fflush(stdout);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n        atender(cli);\n        close(cli);\n    }\n}\n"}],"qs":[{"q":"¿Por qué la solución no usa fork() por cliente?","a":"Porque la tabla de agentes debe ser <b>compartida</b>: lo que un agente reporta otro lo consulta. Con fork() cada hijo tendría su propia copia y QUERY nunca vería los REPORT de otra conexión. Las opciones son un servidor iterativo, select() en un solo proceso, o mover el estado a memoria compartida o a un archivo con flock (como R3)."}],"hints":["Acumulas con recv(fd, buf + total, sizeof(buf) - total - 1, 0).","Mientras haya un \\n en el buffer: corta ahí, procesa esa línea y corre el resto con memmove.","%127[^\\n] lee \"el resto de la línea\", con espacios incluidos."],"think":["Buffer: total += n; buf[total] = 0; while (nl = strchr(buf, '\\n')) { *nl = 0; procesar(buf); memmove(buf, nl + 1, …); total -= …; }","procesar: un if/else por cada tipo de mensaje con sscanf.","ALERT nivel 3: responder primero y luego retornar \"desconectar\"."],"errors":["Suponer que cada recv() trae exactamente un mensaje.","Calcular mal cuántos bytes mover con memmove (perder el \\0 o dejar basura).","Usar fork() y perder el estado compartido."],"rubric":[{"pts":4,"t":"Buffer acumulador correcto (strchr + memmove)"},{"pts":2,"t":"REPORT con tabla de 10 agentes"},{"pts":1,"t":"QUERY con UNKNOWN"},{"pts":2,"t":"ALERT con hora y desconexión en nivel 3"},{"pts":1,"t":"STATUS"}],"lang":"c","pruebas":{"compilar":[{"src":["s3_mcrn.c"],"out":"s3"}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor MCRN","cmd":"./s3","puerto":7003,"log":"mcrn.out","critico":true},{"tipo":"python","nombre":"Mensajes partidos, pegados y los 4 comandos","archivo":"prueba/s3.py"}],"archivos":{"prueba/s3.py":"import time\nfrom cognition_prueba import *\nc = Linea(conectar(7003))\nc.enviar(\"REPORT Bobbie posicion Ma\"); time.sleep(0.2); c.enviar(\"rte\\nQUERY Bobbie\\n\")\nr1, r2 = c.leer(), c.leer()\ncheck(r1 == \"STORED\" and r2 == \"posicion Marte\", \"Mensaje partido en dos recv(): el buffer acumulador lo reconstruye\", \"Con un REPORT partido esperaba STORED y 'posicion Marte', recibí %r / %r\" % (r1, r2))\nc.enviar(\"QUERY Nadie\\nSTATUS\\n\")\nr1, r2 = c.leer(), c.leer()\ncheck(r1 == \"UNKNOWN\", \"QUERY de un agente desconocido → UNKNOWN\", \"Esperaba UNKNOWN, recibí %r\" % r1)\ncheck(r2 == \"AGENTS 1\", \"Dos mensajes pegados en un recv(): responde ambos (STATUS → AGENTS 1)\", \"Esperaba 'AGENTS 1', recibí %r\" % r2)\nc.enviar(\"ALERT 2 flota detectada\\n\"); r = c.leer()\ncheck(r == \"ACK_ALERT\", \"ALERT nivel 2 → ACK_ALERT\", \"Esperaba ACK_ALERT, recibí %r\" % r)\nc.enviar(\"ALERT 3 abortar\\n\"); r = c.leer(); fin = c.leer(timeout=1)\ncheck(r == \"ACK_ALERT\" and fin is None, \"ALERT nivel 3 → responde y desconecta\", \"Nivel 3: esperaba ACK_ALERT y luego cierre, recibí %r / %r\" % (r, fin))\nd = Linea(conectar(7003)); d.enviar(\"QUERY Bobbie\\n\"); r = d.leer()\ncheck(r == \"posicion Marte\", \"Un cliente nuevo ve lo que reportó otro (estado compartido)\", \"Un segundo cliente no ve el REPORT anterior (%r): ¿usaste fork()? Cada hijo tiene su copia de la tabla\" % r)\nterminar()\n"}}},{"id":"R1","group":"cert","n":"R1 ⭐","topic":"rpc","lvl":1,"min":12,"title":"Registro de naves — Ceres (RPC)","statement":"<p>RPC de una función: <code>get_estado(id_nave)</code>. Protocolo: <code>CALL get_estado &lt;id&gt;</code> → <code>RESULT &lt;estado&gt;</code>. Tabla: Rocinante=EN_VUELO, Canterbury=DESTRUIDA, Donnager=EN_PUERTO, Behemoth=EN_VUELO, Nauvoo=CONSTRUCCION; si no existe, DESCONOCIDA. El <b>stub</b> del cliente es una función C normal <code>char* get_estado(int sock, char* id)</code> que oculta el send/recv.</p>","files":[{"name":"r1_servidor.c","code":"/* r1_servidor.c — RPC get_estado(id_nave) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 8001\n\ntypedef struct { const char *nave; const char *estado; } Registro;\nRegistro tabla[] = {\n    {\"Rocinante\", \"EN_VUELO\"}, {\"Canterbury\", \"DESTRUIDA\"}, {\"Donnager\", \"EN_PUERTO\"},\n    {\"Behemoth\", \"EN_VUELO\"},  {\"Nauvoo\", \"CONSTRUCCION\"},\n};\n\n/* La función \"real\" que se ejecuta en el servidor */\nconst char *get_estado(const char *id) {\n//@TODO 1 | Buscar en la tabla\n    for (int i = 0; i < 5; i++)\n        if (strcmp(tabla[i].nave, id) == 0) return tabla[i].estado; //§\n    return \"DESCONOCIDA\"; //§\n//@END\n}\n\nvoid atender(int fd) {\n//@TODO 2 | Skeleton del servidor: parsear CALL, ejecutar y responder RESULT\n    char buf[256], fn[32], arg[64], resp[128];\n    int n;\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        if (sscanf(buf, \"CALL %31s %63s\", fn, arg) == 2 && strcmp(fn, \"get_estado\") == 0) //§\n            snprintf(resp, sizeof resp, \"RESULT %s\\n\", get_estado(arg)); //§\n        else\n            snprintf(resp, sizeof resp, \"ERROR\\n\");\n        send(fd, resp, strlen(resp), 0); //§\n    }\n//@END\n}\n\nint main(void) {\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 5);\n    signal(SIGCHLD, SIG_IGN);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n        if (fork() == 0) { close(srv); atender(cli); close(cli); exit(0); }\n        close(cli);\n    }\n}\n"},{"name":"r1_cliente.c","code":"/* r1_cliente.c — el stub oculta la red */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 8001\n\n/* STUB: para quien la llama parece una función local */\nchar *get_estado(int sock, char *id_nave) {\n//@TODO 1 | Serializar, enviar, recibir y deserializar\n    static char estado[64];                 /* static: sobrevive al return */ //§\n    char msg[128];\n    snprintf(msg, sizeof msg, \"CALL get_estado %s\\n\", id_nave); //§\n    send(sock, msg, strlen(msg), 0); //§\n    int n = recv(sock, msg, sizeof(msg) - 1, 0); //§\n    if (n <= 0) return NULL; //§\n    msg[n] = '\\0'; //§\n    if (sscanf(msg, \"RESULT %63s\", estado) != 1) return NULL; //§\n    return estado; //§\n//@END\n}\n\nint main(void) {\n    int sock = socket(AF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET;\n    srv.sin_port = htons(PORT);\n    inet_pton(AF_INET, \"127.0.0.1\", &srv.sin_addr);\n    if (connect(sock, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; }\n\n    char *naves[] = { \"Rocinante\", \"Canterbury\", \"Donnager\", \"Behemoth\", \"Nauvoo\", \"Anubis\" };\n    for (int i = 0; i < 6; i++) {\n        char *e = get_estado(sock, naves[i]);   /* ¡parece una llamada local! */\n        printf(\"%-10s -> %s\\n\", naves[i], e ? e : \"(error)\");\n    }\n    close(sock);\n    return 0;\n}\n"}],"qs":[{"q":"¿Qué es un stub y qué hace el skeleton del servidor?","a":"El <b>stub</b> (cliente) tiene la misma firma que la función remota: <b>serializa</b> los argumentos en un mensaje, lo envía, espera la respuesta y la <b>deserializa</b>. Para quien la llama parece una llamada local. El <b>skeleton</b> (servidor) hace lo inverso: parsea el CALL, llama a la función real y serializa el resultado como RESULT."}],"hints":["El stub retorna un char*: no puede ser un arreglo local (desaparece al retornar). Usa static.","sscanf(msg, \"RESULT %63s\", estado) extrae el estado."],"think":["Servidor: get_estado real con un for y strcmp sobre la tabla.","atender: sscanf \"CALL %s %s\", verificar el nombre de la función, responder RESULT.","Stub: snprintf CALL, send, recv, sscanf RESULT y retornar un buffer static."],"errors":["Retornar un char estado[64] local desde el stub (puntero colgante)."],"rubric":[{"pts":2,"t":"Tabla y búsqueda en el servidor"},{"pts":2,"t":"Parseo CALL y respuesta RESULT"},{"pts":4,"t":"Stub con send/recv/parseo y buffer static"},{"pts":2,"t":"Demostración con 5 naves + 1 inexistente"}],"lang":"c","pruebas":{"compilar":[{"src":["r1_servidor.c"],"out":"r1s"},{"src":["r1_cliente.c"],"out":"r1c"}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor RPC","cmd":"./r1s","puerto":8001,"log":"r1.out","critico":true},{"tipo":"python","nombre":"Llamadas CALL get_estado","archivo":"prueba/r1.py"},{"tipo":"ejecutar","nombre":"Tu cliente con el stub","cmd":"./r1c","timeout":5,"espera":{"contiene":["EN_VUELO","DESTRUIDA","EN_PUERTO","CONSTRUCCION","DESCONOCIDA"]}}],"archivos":{"prueba/r1.py":"from cognition_prueba import *\nc = Linea(conectar(8001))\nfor nave, est in [(\"Rocinante\", \"EN_VUELO\"), (\"Canterbury\", \"DESTRUIDA\"), (\"Nauvoo\", \"CONSTRUCCION\"), (\"Anubis\", \"DESCONOCIDA\")]:\n    c.enviar(\"CALL get_estado %s\\n\" % nave); r = c.leer()\n    check(r == \"RESULT \" + est, \"get_estado(%s) → RESULT %s\" % (nave, est), \"get_estado(%s): esperaba 'RESULT %s', recibí %r\" % (nave, est, r))\nterminar()\n"}}},{"id":"R2","group":"cert","n":"R2 ⭐⭐","topic":"rpc","lvl":2,"min":20,"title":"Navegación Nauvoo — dispatch table","statement":"<p>Servidor RPC en el puerto 8002 con 4 funciones (<code>CALL &lt;funcion&gt; &lt;args&gt;</code> → <code>RESULT &lt;valor&gt;</code>):</p><ul class=\"clean\"><li><code>calcular_quema(delta_v, masa)</code> = masa · (e^(delta_v/9800) − 1)</li><li><code>distancia_AU(origen, destino)</code> con Tierra 1.0, Marte 1.52, Ceres 2.77, Jupiter 5.2, Tycho 2.2</li><li><code>ruta_optima(origen, destino)</code>: secuencia de nodos más corta</li><li><code>estado_reactor(nave)</code>: OPTIMO, DEGRADADO o CRITICO con rand()</li></ul><p>Implementa una <b>dispatch table</b>: arreglo de <code>{char *nombre, handler_fn fn}</code>. Compilar con <code>-lm</code>.</p>","files":[{"name":"r2_nauvoo.c","code":"/* r2_nauvoo.c — servidor RPC con dispatch table (compilar con -lm) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <math.h>\n#include <time.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 8002\n#define NNODOS 5\n\nconst char *nodos[NNODOS] = { \"Tierra\", \"Marte\", \"Ceres\", \"Jupiter\", \"Tycho\" };\nconst double au[NNODOS]   = { 1.0, 1.52, 2.77, 5.2, 2.2 };\n/* Rutas directas disponibles (grafo no dirigido) */\nconst int ady[NNODOS][NNODOS] = {\n    /* Tie Mar Cer Jup Tyc */\n    {  0,  1,  0,  0,  0 },     /* Tierra  */\n    {  1,  0,  1,  0,  1 },     /* Marte   */\n    {  0,  1,  0,  1,  1 },     /* Ceres   */\n    {  0,  0,  1,  0,  1 },     /* Jupiter */\n    {  0,  1,  1,  1,  0 },     /* Tycho   */\n};\n\nint idx(const char *n) { for (int i = 0; i < NNODOS; i++) if (strcmp(nodos[i], n) == 0) return i; return -1; }\n\n/* Todas las funciones remotas tienen la misma firma: args en texto -> resultado en texto */\ntypedef void (*handler_fn)(const char *args, char *out, size_t n);\n\n//@TODO 1 | Implementar los 4 handlers\nvoid calcular_quema(const char *args, char *out, size_t n) {\n    double dv, masa;\n    if (sscanf(args, \"%lf %lf\", &dv, &masa) != 2) { snprintf(out, n, \"ERROR args\"); return; } //§\n    snprintf(out, n, \"%.2f\", masa * (exp(dv / 9800.0) - 1)); //§\n}\n\nvoid distancia_AU(const char *args, char *out, size_t n) {\n    char a[32], b[32];\n    if (sscanf(args, \"%31s %31s\", a, b) != 2 || idx(a) < 0 || idx(b) < 0) { snprintf(out, n, \"ERROR args\"); return; } //§\n    snprintf(out, n, \"%.2f\", fabs(au[idx(a)] - au[idx(b)])); //§\n}\n\nvoid ruta_optima(const char *args, char *out, size_t n) {\n    char a[32], b[32];\n    if (sscanf(args, \"%31s %31s\", a, b) != 2 || idx(a) < 0 || idx(b) < 0) { snprintf(out, n, \"ERROR args\"); return; }\n    int s = idx(a), t = idx(b), prev[NNODOS], cola[NNODOS], ini = 0, fin = 0;\n    for (int i = 0; i < NNODOS; i++) prev[i] = -2;\n    prev[s] = -1; cola[fin++] = s;\n    while (ini < fin) {                         /* BFS: menos saltos = ruta más corta */ //§\n        int u = cola[ini++];\n        for (int v = 0; v < NNODOS; v++)\n            if (ady[u][v] && prev[v] == -2) { prev[v] = u; cola[fin++] = v; } //§\n    }\n    if (prev[t] == -2) { snprintf(out, n, \"SIN_RUTA\"); return; }\n    int camino[NNODOS], k = 0;\n    for (int v = t; v != -1; v = prev[v]) camino[k++] = v; //§\n    out[0] = '\\0';\n    for (int i = k - 1; i >= 0; i--) {\n        strncat(out, nodos[camino[i]], n - strlen(out) - 1);\n        if (i > 0) strncat(out, \"->\", n - strlen(out) - 1);\n    }\n}\n\nvoid estado_reactor(const char *args, char *out, size_t n) {\n    (void)args;\n    const char *e[] = { \"OPTIMO\", \"DEGRADADO\", \"CRITICO\" };\n    snprintf(out, n, \"%s\", e[rand() % 3]); //§\n}\n//@END\n\n//@TODO 2 | La dispatch table: nombre -> función\ntypedef struct { const char *nombre; handler_fn fn; } Entrada;\nEntrada dispatch[] = {\n    { \"calcular_quema\", calcular_quema }, //§\n    { \"distancia_AU\",   distancia_AU }, //§\n    { \"ruta_optima\",    ruta_optima }, //§\n    { \"estado_reactor\", estado_reactor }, //§\n};\n#define NFUNC (sizeof(dispatch) / sizeof(dispatch[0]))\n//@END\n\nvoid atender(int fd) {\n//@TODO 3 | Parsear \"CALL <funcion> <args>\", buscar en la tabla y responder\n    char buf[256], fn[32], args[200], res[200], resp[256];\n    int n;\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0';\n        buf[strcspn(buf, \"\\r\\n\")] = '\\0';\n        args[0] = '\\0';\n        if (sscanf(buf, \"CALL %31s %199[^\\n]\", fn, args) < 1) { send(fd, \"ERROR\\n\", 6, 0); continue; } //§\n        snprintf(resp, sizeof resp, \"RESULT ERROR funcion_desconocida\\n\");\n        for (size_t i = 0; i < NFUNC; i++)\n            if (strcmp(dispatch[i].nombre, fn) == 0) { //§\n                dispatch[i].fn(args, res, sizeof res);      /* llamada por puntero */ //§\n                snprintf(resp, sizeof resp, \"RESULT %s\\n\", res); //§\n            }\n        send(fd, resp, strlen(resp), 0); //§\n    }\n//@END\n}\n\nint main(void) {\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 5);\n    signal(SIGCHLD, SIG_IGN);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n        if (fork() == 0) { close(srv); srand(getpid()); atender(cli); close(cli); exit(0); }\n        close(cli);\n    }\n}\n"}],"comandos":{"r2_nauvoo.c":"gcc -Wall -o r2_nauvoo r2_nauvoo.c -lm"},"qs":[{"q":"¿Qué ventaja tiene la dispatch table frente a un if/else por función?","a":"Agregar una función remota es agregar <b>una línea</b> a la tabla; el despacho (buscar por nombre y llamar por puntero) no cambia. Todas las funciones comparten la firma <code>handler_fn</code>, así que el servidor no necesita conocerlas una por una."},{"q":"El enunciado no define el grafo de rutas. ¿Qué supuso la solución?","a":"Un grafo de conexiones directas (Tierra–Marte, Marte–Ceres, Marte–Tycho, Ceres–Tycho, Ceres–Jupiter, Tycho–Jupiter) y <b>BFS</b> para el camino con menos saltos. En la prueba, declara tu supuesto por escrito."}],"hints":["typedef void (*handler_fn)(const char *args, char *out, size_t n); es un puntero a función.","%199[^\\n] captura todos los argumentos juntos y cada handler los parsea.","exp() y fabs() están en math.h: compila con -lm."],"think":["Definir los 4 handlers con la misma firma.","Tabla: Entrada dispatch[] = {{\"calcular_quema\", calcular_quema}, …}.","atender: sscanf CALL → for por la tabla, strcmp del nombre, dispatch[i].fn(args, res, …), RESULT."],"errors":["Firmas distintas entre handlers (no compila en la tabla).","Olvidar -lm al compilar."],"rubric":[{"pts":2,"t":"Typedef de puntero a función y tabla"},{"pts":3,"t":"Los 4 handlers"},{"pts":3,"t":"Despacho por nombre y llamada por puntero"},{"pts":2,"t":"Formato RESULT y error para función desconocida"}],"lang":"c","pruebas":{"compilar":[{"src":["r2_nauvoo.c"],"out":"r2","flags":["-lm"]}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor Nauvoo","cmd":"./r2","puerto":8002,"log":"r2.out","critico":true},{"tipo":"python","nombre":"Las 4 funciones de la dispatch table","archivo":"prueba/r2.py"}],"archivos":{"prueba/r2.py":"from cognition_prueba import *\nc = Linea(conectar(8002))\ndef call(x): c.enviar(\"CALL %s\\n\" % x); return c.leer() or \"\"\nr = call(\"calcular_quema 4900 1000\")\ntry: v = float(r.split()[1])\nexcept Exception: v = None\ncheck(v is not None and abs(v - 648.72) < 0.5, \"calcular_quema(4900, 1000) ≈ 648.72\", \"calcular_quema(4900, 1000): esperaba ~648.72, recibí %r\" % r)\nr = call(\"distancia_AU Tierra Jupiter\")\ncheck(r.replace(\" \", \"\") in (\"RESULT4.20\", \"RESULT4.2\"), \"distancia_AU(Tierra, Jupiter) = 4.20\", \"distancia_AU: esperaba 4.20, recibí %r\" % r)\nr = call(\"ruta_optima Tierra Jupiter\")\ncheck(r.startswith(\"RESULT Tierra\") and r.rstrip().endswith(\"Jupiter\"), \"ruta_optima empieza en Tierra y termina en Jupiter\", \"ruta_optima: recibí %r\" % r)\nr = call(\"estado_reactor Rocinante\")\ncheck(r in (\"RESULT OPTIMO\", \"RESULT DEGRADADO\", \"RESULT CRITICO\"), \"estado_reactor → uno de los 3 estados\", \"estado_reactor: recibí %r\" % r)\nr = call(\"volar Marte\")\ncheck(\"ERROR\" in r.upper(), \"Una función que no existe responde con error\", \"Función inexistente: esperaba un error, recibí %r\" % r)\nterminar()\n"}}},{"id":"R3","group":"cert","n":"R3 ⭐⭐⭐","topic":"rpc","lvl":3,"min":25,"title":"Lab de Protomolécula — RPC concurrente + flock","statement":"<p>Puerto 8003, <code>fork()</code> por cliente. El estado se guarda en <code>experimento.dat</code>: fase_actual, num_muestras y hasta 50 muestras {id, valor}. Funciones: <code>registrar_muestra(id, valor)</code>, <code>leer_estado()</code>, <code>incrementar_fase()</code> y <code>obtener_fase()</code>. Usa <code>flock()</code>: LOCK_EX para escribir y LOCK_SH para leer. Simula 3 clientes concurrentes: uno registra, otro lee cada segundo y otro incrementa la fase al llegar a 10 muestras.</p>","files":[{"name":"r3_ilus.c","code":"/* r3_ilus.c — RPC concurrente con estado en archivo protegido por flock() */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <fcntl.h>\n#include <sys/file.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 8003\n#define ARCHIVO \"experimento.dat\"\n#define MAX_MUESTRAS 50\n\ntypedef struct { int id; float valor; } Muestra;\ntypedef struct {\n    int fase_actual;\n    int num_muestras;\n    Muestra muestras[MAX_MUESTRAS];\n} Estado;\n\n/* Lee o escribe el estado completo, con el lock adecuado */\n//@TODO 1 | Acceso al archivo con flock(): LOCK_SH para leer, LOCK_EX para modificar\nvoid leer_estado_archivo(Estado *e) {\n    int fd = open(ARCHIVO, O_RDONLY); //§\n    flock(fd, LOCK_SH);                 /* varios lectores a la vez */ //§\n    read(fd, e, sizeof *e); //§\n    flock(fd, LOCK_UN); //§\n    close(fd);\n}\n\n/* Modificación atómica: leer + cambiar + escribir bajo el MISMO LOCK_EX */\nint fd_bloquear_ex(Estado *e) {\n    int fd = open(ARCHIVO, O_RDWR); //§\n    flock(fd, LOCK_EX);                 /* exclusivo: nadie más lee ni escribe */ //§\n    lseek(fd, 0, SEEK_SET);\n    read(fd, e, sizeof *e); //§\n    return fd;\n}\n\nvoid fd_guardar_y_soltar(int fd, const Estado *e) {\n    lseek(fd, 0, SEEK_SET); //§\n    write(fd, e, sizeof *e); //§\n    flock(fd, LOCK_UN); //§\n    close(fd);\n}\n//@END\n\nvoid atender(int sock) {\n//@TODO 2 | Las 4 funciones RPC\n    char buf[256], fn[32], resp[128];\n    int n;\n    while ((n = recv(sock, buf, sizeof(buf) - 1, 0)) > 0) {\n        buf[n] = '\\0';\n        int id;\n        float valor;\n        Estado e;\n        fn[0] = '\\0';\n        sscanf(buf, \"CALL %31s\", fn);                   /* primero: ¿qué función piden? */ //§\n        if (strcmp(fn, \"registrar_muestra\") == 0 && sscanf(buf, \"CALL %*s %d %f\", &id, &valor) == 2) { //§\n            int fd = fd_bloquear_ex(&e); //§\n            if (e.num_muestras < MAX_MUESTRAS) {\n                e.muestras[e.num_muestras].id = id; //§\n                e.muestras[e.num_muestras].valor = valor; //§\n                e.num_muestras++; //§\n            }\n            fd_guardar_y_soltar(fd, &e); //§\n            snprintf(resp, sizeof resp, \"RESULT OK %d\\n\", e.num_muestras);\n        } else if (strcmp(fn, \"incrementar_fase\") == 0) {\n            int fd = fd_bloquear_ex(&e); //§\n            e.fase_actual++; //§\n            fd_guardar_y_soltar(fd, &e); //§\n            snprintf(resp, sizeof resp, \"RESULT %d\\n\", e.fase_actual);\n        } else if (strcmp(fn, \"leer_estado\") == 0) {\n            leer_estado_archivo(&e); //§\n            snprintf(resp, sizeof resp, \"RESULT fase=%d muestras=%d\\n\", e.fase_actual, e.num_muestras); //§\n        } else if (strcmp(fn, \"obtener_fase\") == 0) {\n            leer_estado_archivo(&e); //§\n            snprintf(resp, sizeof resp, \"RESULT %d\\n\", e.fase_actual); //§\n        } else {\n            snprintf(resp, sizeof resp, \"RESULT ERROR\\n\");\n        }\n        send(sock, resp, strlen(resp), 0);\n    }\n//@END\n}\n\nint main(void) {\n    /* Crear el archivo vacío si no existe */\n    int fd = open(ARCHIVO, O_RDWR | O_CREAT, 0644);\n    flock(fd, LOCK_EX);\n    if (lseek(fd, 0, SEEK_END) < (off_t)sizeof(Estado)) {\n        Estado vacio;\n        memset(&vacio, 0, sizeof vacio);\n        lseek(fd, 0, SEEK_SET);\n        write(fd, &vacio, sizeof vacio);\n    }\n    flock(fd, LOCK_UN);\n    close(fd);\n\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 10);\n    signal(SIGCHLD, SIG_IGN);\n    printf(\"[ILUS] escuchando en %d\\n\", PORT);\n    fflush(stdout);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n        if (fork() == 0) { close(srv); atender(cli); close(cli); exit(0); }\n        close(cli);\n    }\n}\n"},{"name":"r3_cliente.c","code":"/* r3_cliente.c — ./r3_cliente registrar | lector | fase */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 8003\n\nint sock;\n\n/* Stub genérico: envía una línea CALL y deja el resultado en out */\nint rpc(const char *llamada, char *out, int n) {\n    char msg[128];\n    snprintf(msg, sizeof msg, \"CALL %s\\n\", llamada);\n    send(sock, msg, strlen(msg), 0);\n    int r = recv(sock, out, n - 1, 0);\n    if (r <= 0) return -1;\n    out[r] = '\\0';\n    out[strcspn(out, \"\\n\")] = '\\0';\n    return 0;\n}\n\nint main(int argc, char *argv[]) {\n    if (argc < 2) { fprintf(stderr, \"Uso: %s registrar|lector|fase\\n\", argv[0]); return 1; }\n    sock = socket(AF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET;\n    srv.sin_port = htons(PORT);\n    inet_pton(AF_INET, \"127.0.0.1\", &srv.sin_addr);\n    if (connect(sock, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; }\n\n    char res[128], call[64];\n    if (strcmp(argv[1], \"registrar\") == 0) {\n        for (int i = 1; i <= 12; i++) {\n            snprintf(call, sizeof call, \"registrar_muestra %d %.2f\", i, i * 1.5);\n            rpc(call, res, sizeof res);\n            printf(\"[registrar] muestra %d -> %s\\n\", i, res);\n            usleep(300000);\n        }\n    } else if (strcmp(argv[1], \"lector\") == 0) {\n        for (int i = 0; i < 5; i++) { rpc(\"leer_estado\", res, sizeof res); printf(\"[lector] %s\\n\", res); sleep(1); }\n    } else {\n        int m = 0;\n        while (m < 10) { rpc(\"leer_estado\", res, sizeof res); sscanf(res, \"RESULT fase=%*d muestras=%d\", &m); usleep(200000); }\n        rpc(\"incrementar_fase\", res, sizeof res);\n        printf(\"[fase] 10 muestras alcanzadas, nueva fase -> %s\\n\", res);\n    }\n    close(sock);\n    return 0;\n}\n"}],"qs":[{"q":"¿Por qué el estado va en un archivo y no en una variable global?","a":"Con fork() cada hijo tiene su propia memoria: una variable global <b>no se comparte</b> entre clientes. El archivo sí es compartido. Para que no se pisen los cambios, se protege con flock."},{"q":"¿Por qué la modificación lee y escribe bajo el MISMO LOCK_EX?","a":"Para que \"leer → modificar → escribir\" sea <b>atómico</b>. Si lees con LOCK_SH, sueltas y luego escribes con LOCK_EX, otro proceso puede escribir en medio y una de las dos actualizaciones se pierde (<b>lost update</b>)."}],"hints":["LOCK_SH permite varios lectores a la vez; LOCK_EX es exclusivo.","Antes de reescribir el archivo, vuelve al inicio con lseek(fd, 0, SEEK_SET).","Crea el archivo con un Estado vacío al iniciar el servidor."],"think":["Lectura: open, flock(LOCK_SH), read del struct, flock(LOCK_UN).","Escritura: open O_RDWR, flock(LOCK_EX), read, modificar, lseek a 0, write, flock(LOCK_UN).","Despacho: primero sscanf del nombre de la función y después sus argumentos."],"errors":["Soltar el lock entre leer y escribir.","Olvidar lseek antes de write (escribe al final del archivo)."],"rubric":[{"pts":2,"t":"Archivo inicializado y estructura Estado"},{"pts":3,"t":"LOCK_SH para leer y LOCK_EX para modificar"},{"pts":2,"t":"Leer + modificar + escribir atómico"},{"pts":2,"t":"Las 4 funciones RPC"},{"pts":1,"t":"Clientes concurrentes de prueba"}],"lang":"c","pruebas":{"compilar":[{"src":["r3_ilus.c"],"out":"r3"}],"pasos":[{"tipo":"iniciar","nombre":"Tu servidor Ilus","cmd":"./r3","puerto":8003,"log":"r3.out","critico":true},{"tipo":"python","nombre":"3 clientes concurrentes con flock()","archivo":"prueba/r3.py","timeout":20}],"archivos":{"prueba/r3.py":"\"\"\"3 clientes registran muestras a la vez: si el lock no es atómico se pierden actualizaciones.\"\"\"\nimport threading, re\nfrom cognition_prueba import *\ndef registrar(base):\n    c = Linea(conectar(8003))\n    for i in range(8):\n        c.enviar(\"CALL registrar_muestra %d %.1f\\n\" % (base + i, i * 1.5)); c.leer()\nhs = [threading.Thread(target=registrar, args=(b,)) for b in (100, 200, 300)]\nfor h in hs: h.start()\nfor h in hs: h.join()\nc = Linea(conectar(8003))\nc.enviar(\"CALL leer_estado\\n\"); r = c.leer() or \"\"\nnums = [int(x) for x in re.findall(r\"\\d+\", r)]\ncheck(24 in nums, \"24 muestras registradas por 3 clientes concurrentes: no se perdió ninguna\", \"Esperaba 24 muestras tras 3 clientes concurrentes, leer_estado dice %r. ¿Lees y escribes bajo el mismo LOCK_EX?\" % r)\nc.enviar(\"CALL obtener_fase\\n\"); f0 = c.leer()\nc.enviar(\"CALL incrementar_fase\\n\"); c.leer()\nc.enviar(\"CALL obtener_fase\\n\"); f1 = c.leer()\ntry: ok_ = int(f1.split()[-1]) == int(f0.split()[-1]) + 1\nexcept Exception: ok_ = False\ncheck(ok_, \"incrementar_fase sube la fase en 1\", \"incrementar_fase: antes %r, después %r\" % (f0, f1))\nterminar()\n"}}},{"id":"I1","group":"cert","n":"I1 ⭐⭐","topic":"integracion","lvl":2,"min":25,"title":"Soporte vital — pipe + socket","statement":"<p>A (sensor) genera cada 2 s <code>VITAL O2=&lt;v&gt; CO2=&lt;v&gt; TEMP=&lt;v&gt;</code> (O2 80–100 %, CO2 0–5 %, TEMP 15–25 °C) y lo envía por pipe. B (procesador) decide las alertas: O2&lt;85 → ALERTA_O2, CO2&gt;3 → ALERTA_CO2, TEMP&gt;22 → ALERTA_TEMP, y envía <b>solo las alertas</b> por TCP a la base (puerto 6001), que las registra con hora y responde ACK_ALERTA. El procesador cierra el pipe al cerrar la conexión.</p>","files":[{"name":"i1_base.c","code":"/* i1_base.c — base Ceres: registra alertas con timestamp */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\n#define PORT 6001\n\nvoid atender(int fd) {\n//@TODO 1 | Recibir alertas, registrarlas con hora y responder ACK_ALERTA\n    char buf[256];\n    int n;\n    while ((n = recv(fd, buf, sizeof(buf) - 1, 0)) > 0) { //§\n        buf[n] = '\\0'; //§\n        buf[strcspn(buf, \"\\n\")] = '\\0';\n        time_t t = time(NULL); //§\n        char hora[16];\n        strftime(hora, sizeof hora, \"%H:%M:%S\", localtime(&t)); //§\n        printf(\"[BASE CERES %s] %s\\n\", hora, buf); //§\n        fflush(stdout);\n        send(fd, \"ACK_ALERTA\\n\", 11, 0); //§\n    }\n//@END\n}\n\nint main(void) {\n    int srv = socket(AF_INET, SOCK_STREAM, 0);\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &(int){1}, sizeof(int));\n    struct sockaddr_in addr;\n    memset(&addr, 0, sizeof addr);\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT);\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; }\n    listen(srv, 5);\n    signal(SIGCHLD, SIG_IGN);\n    printf(\"[BASE CERES] escuchando en %d\\n\", PORT);\n    fflush(stdout);\n    while (1) {\n        int cli = accept(srv, NULL, NULL);\n        if (cli < 0) continue;\n        if (fork() == 0) { close(srv); atender(cli); close(cli); exit(0); }\n        close(cli);\n    }\n}\n"},{"name":"i1_procesador.c","code":"/* i1_procesador.c — sensor (pipe) -> procesador -> base Ceres (socket) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/wait.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 6001\n#ifndef PERIODO\n#define PERIODO 2               /* segundos entre lecturas */\n#endif\n#define LECTURAS 8\n\nvoid sensor(int wfd) {\n//@TODO 1 | Proceso A: lecturas \"VITAL O2=<v> CO2=<v> TEMP=<v>\\n\" cada 2 s\n    srand(getpid());\n    for (int i = 0; i < LECTURAS; i++) {\n        float o2 = 80 + rand() % 2001 / 100.0f;     /* 80-100 % */ //§\n        float co2 = rand() % 501 / 100.0f;          /* 0-5 %   */ //§\n        float temp = 15 + rand() % 1001 / 100.0f;   /* 15-25 °C */ //§\n        char msg[80];\n        int len = snprintf(msg, sizeof msg, \"VITAL O2=%.2f CO2=%.2f TEMP=%.2f\\n\", o2, co2, temp); //§\n        write(wfd, msg, len); //§\n        sleep(PERIODO);\n    }\n    close(wfd);\n//@END\n    exit(0);\n}\n\n/* Envía una alerta y espera el ACK de la base */\nvoid alertar(int sock, const char *tipo, float v) {\n    char msg[64], buf[64];\n    snprintf(msg, sizeof msg, \"%s %.2f\\n\", tipo, v);\n    send(sock, msg, strlen(msg), 0);\n    int n = recv(sock, buf, sizeof(buf) - 1, 0);\n    if (n > 0) { buf[n] = '\\0'; printf(\"[PROCESADOR] %s %.2f -> %s\", tipo, v, buf); }\n}\n\nint main(int argc, char *argv[]) {\n    const char *ip = argc > 1 ? argv[1] : \"127.0.0.1\";\n    int p[2];\n//@TODO 2 | pipe + fork del sensor; el padre cierra el extremo de escritura\n    pipe(p); //§\n    if (fork() == 0) { close(p[0]); sensor(p[1]); } //§\n    close(p[1]); //§\n//@END\n//@TODO 3 | Conectar a la base y reenviar solo las alertas\n    int sock = socket(AF_INET, SOCK_STREAM, 0); //§\n    struct sockaddr_in srv;\n    memset(&srv, 0, sizeof srv);\n    srv.sin_family = AF_INET;\n    srv.sin_port = htons(PORT);\n    inet_pton(AF_INET, ip, &srv.sin_addr);\n    if (connect(sock, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; } //§\n\n    FILE *in = fdopen(p[0], \"r\"); //§\n    char linea[128];\n    float o2, co2, temp;\n    while (fgets(linea, sizeof linea, in)) { //§\n        if (sscanf(linea, \"VITAL O2=%f CO2=%f TEMP=%f\", &o2, &co2, &temp) != 3) continue; //§\n        printf(\"[PROCESADOR] %s\", linea);\n        if (o2 < 85)   alertar(sock, \"ALERTA_O2\", o2); //§\n        if (co2 > 3)   alertar(sock, \"ALERTA_CO2\", co2); //§\n        if (temp > 22) alertar(sock, \"ALERTA_TEMP\", temp); //§\n    }\n    close(sock);                /* al cerrar la conexión con la base... */ //§\n    fclose(in);                 /* ...también cierra el extremo de lectura del pipe */ //§\n    wait(NULL); //§\n//@END\n    return 0;\n}\n"}],"hints":["El procesador es el padre: crea el pipe, hace fork del sensor y después se conecta a la base.","Una lectura puede disparar varias alertas: un if por cada una, no else-if."],"think":["Procesador: pipe; fork (hijo = sensor, cierra p[0]); el padre cierra p[1], hace connect y lee el pipe con fdopen + fgets.","sscanf \"VITAL O2=%f CO2=%f TEMP=%f\"; por cada umbral cruzado, send + recv del ACK.","Base: servidor TCP común que imprime con strftime y responde ACK_ALERTA."],"errors":["Usar else-if y perder alertas simultáneas.","Conectarse a la base antes del fork: el hijo her
