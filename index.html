<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Dirección: cuaderno cuadriculado de ingeniería. Tinta azul sobre papel frío; bolígrafo rojo para corregir.
   Layout: cabecera fija con nivel/XP, navegación por pestañas, una columna central de 960px. */
:root{
  --paper:#f4f7fb; --grid:#dfe7f2; --card:#ffffff; --card-2:#eef3fa; --line:#cdd7e6;
  --ink:#13213c; --ink-soft:#4b5b7a; --accent:#2849d6; --accent-ink:#ffffff; --accent-soft:#e2e9ff;
  --good:#17804a; --good-soft:#dff3e8; --bad:#c42b3a; --bad-soft:#fbe4e7; --warn:#a56500; --warn-soft:#fff0d3;
  --code-bg:#eef2f9; --shadow:0 1px 0 rgba(19,33,60,.05),0 6px 18px -10px rgba(19,33,60,.25);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1426; --grid:#18233f; --card:#141e36; --card-2:#1a2646; --line:#2a3960;
  --ink:#e7edfb; --ink-soft:#9fadcc; --accent:#7ea2ff; --accent-ink:#0a1228; --accent-soft:#1e2c55;
  --good:#52c98c; --good-soft:#12301f; --bad:#ff7d8a; --bad-soft:#3a1820; --warn:#e8b866; --warn-soft:#33270f;
  --code-bg:#0a1122; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0d1426; --grid:#18233f; --card:#141e36; --card-2:#1a2646; --line:#2a3960;
  --ink:#e7edfb; --ink-soft:#9fadcc; --accent:#7ea2ff; --accent-ink:#0a1228; --accent-soft:#1e2c55;
  --good:#52c98c; --good-soft:#12301f; --bad:#ff7d8a; --bad-soft:#3a1820; --warn:#e8b866; --warn-soft:#33270f;
  --code-bg:#0a1122; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.55 var(--f-body);min-height:100%}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0 0 .5em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.08rem;font-weight:700}
p{margin:.5em 0} code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:.08em .35em;border-radius:4px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;flex:1 1 200px}
.brand small{display:block;font:500 .72rem var(--f-body);color:var(--ink-soft);letter-spacing:.02em}
.stats{display:flex;align-items:center;gap:14px;flex:0 1 auto}
.lvl{font-size:.8rem;line-height:1.2}.lvl b{display:block;font-family:var(--f-display);font-size:.95rem}
.xpbar{width:130px;height:8px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.streak{font:600 .8rem var(--f-mono);padding:4px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
nav.tabs{max-width:960px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-soft);font-weight:600;padding:7px 14px;border-radius:99px;border:1px solid transparent;font-size:.95rem;display:flex;gap:7px;align-items:center}
nav.tabs a:hover{background:var(--card-2)}
nav.tabs a.on{background:var(--ink);color:var(--paper)}
nav.tabs .badge{font:600 .72rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:20px 16px 80px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.muted{color:var(--ink-soft)}.small{font-size:.86rem}
.eyebrow{font:600 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;transition:transform .08s,background .15s}
.btn:hover{background:var(--card-2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.88rem}.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font:600 .74rem var(--f-mono);padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--paper)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
.bar{height:10px;background:var(--card-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Hoy */
.hero h1 span{color:var(--accent)}
.plan .card{display:flex;flex-direction:column;gap:8px}.plan .big{font:800 2.4rem var(--f-display);line-height:1}
.dom{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0}
.dom .bar i.hi{background:var(--good)}.dom .bar i.mid{background:var(--warn)}.dom .bar i.lo{background:var(--bad)}
@media(max-width:520px){.dom{grid-template-columns:110px 1fr 46px}}

/* Diagramas */
.diag-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
svg.diag{display:block;max-width:none}
.diag .lane{stroke:var(--line);stroke-width:2;stroke-dasharray:2 5}.diag .lbl{fill:var(--ink-soft);font:600 12px var(--f-mono)}
.diag .msg{stroke:var(--ink-soft);stroke-width:1.6;fill:none}.diag .arrow-head{fill:var(--ink-soft)}
.diag .ev circle{fill:var(--card);stroke:var(--ink);stroke-width:2}.diag .ev text{fill:var(--ink);font:700 12px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.diag .ev.given circle{fill:var(--accent-soft);stroke:var(--accent)}
.diag .ev.ok circle{fill:var(--good-soft);stroke:var(--good)}.diag .ev.bad circle{fill:var(--bad-soft);stroke:var(--bad)}
.diag .ev.sel circle{fill:var(--warn-soft);stroke:var(--warn);stroke-width:3}
.diag .ev.click{cursor:pointer}.diag .ev.click:hover circle{stroke:var(--accent)}
.diag .val{fill:var(--accent);font:700 12.5px var(--f-mono);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.diag .val.v{font-size:10.5px}.diag .val.bad{fill:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ans{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ans .evl{font:700 .95rem var(--f-mono);min-width:2.2ch}.ans .evl small{display:block;font:500 .66rem var(--f-body);color:var(--ink-soft)}
.ans input{width:100%;min-width:0;font-family:var(--f-mono)}
.ans.ok{border-color:var(--good);background:var(--good-soft)}.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans .fix{font:700 .8rem var(--f-mono);color:var(--bad);white-space:nowrap}
.ans.given{background:var(--accent-soft);border-color:var(--accent)}
.steps{margin:0;padding-left:1.2em}.steps li{margin:.25em 0;font-size:.93rem}
.pairrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pairrow .pr{font:700 1.05rem var(--f-mono);min-width:7ch}
.pairrow.ok{border-color:var(--good);background:var(--good-soft)}.pairrow.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Código */
pre.code{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font:13.2px/1.55 var(--f-mono);tab-size:4}
.tk-c{color:var(--ink-soft);font-style:italic}.tk-s{color:var(--good)}.tk-p{color:var(--warn)}.tk-k{color:var(--accent);font-weight:600}.tk-n{color:var(--bad)}
.ex-list .card{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}.ex-list .card:hover{border-color:var(--accent)}
.timer{font:700 1.5rem var(--f-mono)}.timer.over{color:var(--bad)}
.rubric label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.rubric input{margin-top:.35em;width:18px;height:18px;accent-color:var(--accent)}
.rubric .pts{margin-left:auto;font:700 .85rem var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.score{font:800 2.2rem var(--f-display)}
ul.clean{margin:.3em 0;padding-left:1.2em}ul.clean li{margin:.25em 0}

/* Tarjetas */
.fc{min-height:230px;display:flex;flex-direction:column;gap:12px}.fc .q{font:700 1.3rem/1.3 var(--f-display)}
.fc .a{border-top:2px dashed var(--line);padding-top:12px}
.rate{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.rate button{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px}.rate small{font:500 .74rem var(--f-mono);color:var(--ink-soft)}
.logbox{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--ink);min-width:34px;font:700 .95rem var(--f-mono);background:var(--card)}
.logbox small{font:500 .65rem var(--f-mono);color:var(--ink-soft);border-bottom:1px solid var(--line);width:100%;text-align:center;background:var(--card-2)}
.logrow{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
table.t{border-collapse:collapse;width:100%}table.t td,table.t th{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:.92rem}table.t th{background:var(--card-2)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:99px;font:700 .9rem var(--f-mono);opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.diag .ev.ask circle{fill:var(--card);stroke:var(--bad);stroke-dasharray:4 3}.diag .ev.ask text{fill:var(--bad)}
.diag .ev.bad circle{stroke:var(--bad);stroke-width:2.5}.diag .ev.bad text{fill:var(--bad)}
.diag .evk{fill:var(--ink-soft)!important;font:600 11px var(--f-mono)!important}.diag .mlbl{fill:var(--accent);font:600 11px var(--f-mono)}
.tabsf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.qa{border-top:1px dashed var(--line);padding:10px 0}.qa:first-of-type{border-top:0}.qa .qq{font-weight:600;margin-bottom:4px}
.grp h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.grp h2 small{font:500 .85rem var(--f-body);color:var(--ink-soft)}
.syncchip{font:600 .74rem var(--f-mono);padding:3px 9px;border-radius:99px;background:var(--card-2);color:var(--ink-soft);white-space:nowrap;border:1px solid var(--line)}
.syncchip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}.syncchip.err{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.code-big{font:700 1.35rem var(--f-mono);letter-spacing:.06em;background:var(--code-bg);padding:6px 12px;border-radius:8px;border:1px dashed var(--line)}
.fldopt{display:flex;gap:6px;flex-wrap:wrap}

/* Editor en pantalla */
.editor{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);height:min(62vh,560px)}
.editor .gutter{font:13.2px/1.55 var(--f-mono);color:var(--ink-soft);text-align:right;padding:12px 8px 12px 12px;white-space:pre;overflow:hidden;user-select:none;border-right:1px solid var(--line);background:var(--card-2)}
.editor textarea{font:13.2px/1.55 var(--f-mono);border:0;border-radius:0;background:transparent;padding:12px;resize:none;width:100%;height:100%;max-width:none;tab-size:4;white-space:pre;overflow:auto;color:var(--ink)}
.editor textarea:focus{outline:none}.editor:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.resumen{padding:10px 14px;border-radius:8px;font-size:.95rem}.resumen.ok{background:var(--good-soft);color:var(--good)}.resumen.bad{background:var(--bad-soft);color:var(--bad)}
.paso{border-top:1px dashed var(--line);padding:8px 0}.checks{list-style:none;margin:6px 0 0;padding:0}.checks li{padding:2px 0;font-size:.92rem}
.res{display:inline-block;width:1.3em;font-weight:800}.res.ok{color:var(--good)}.res.bad{color:var(--bad)}
pre.code.out{max-height:260px;font-size:12.5px;margin-top:6px;white-space:pre-wrap}
.cmdrow{display:flex;gap:8px;align-items:center;margin:6px 0}.cmdrow pre.cmd{flex:1;padding:8px 10px;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
.mono{font-family:var(--f-mono)}

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const CURSOS = [{"id":"redes","nombre":"Taller de Ciencia de Redes","lema":"Escribir código <span>sin red de seguridad</span>","intro":"El control y el certamen son en papel. Aquí practicas justo eso: recuperar el patrón de memoria, escribirlo a mano y corregirte con una rúbrica. Lo que fallas vuelve en pocos días.","lenguaje":"c","comando":"gcc -Wall -o {base} {archivo}","solucionesProbadas":true,"textoEjercicios":"Todos los ejercicios de tus guías, resueltos y explicados. Cada solución en C fue compilada y probada. Intenta primero en papel; la solución aparece solo cuando la pides.","titulos":["Becario de telemetría","Operador de enlace","Ingeniero de réplicas","Arquitecto de quórums","Líder electo","Maestro del consenso"],"examenes":[{"key":"control","label":"Control 3"},{"key":"certamen","label":"Certamen 2"}],"grupos":[{"id":"lamport","nombre":"Guía de relojes de Lamport","sub":"Prioridad para el Control 3 y el Certamen 2"},{"id":"extra","nombre":"Extras de la Unidad 2","sub":"Quórum, 2PC, heartbeats y Raft también se programan"},{"id":"control","nombre":"Control 01","sub":"El formato real de la evaluación: esqueleto con TODO y puntaje"},{"id":"cert","nombre":"Guía del Certamen 01","sub":"Pipes, sockets y RPC: la base de todo lo demás"}],"temas":[{"id":"pipes","n":"Pipes y fork"},{"id":"sockets","n":"Sockets TCP"},{"id":"rpc","n":"RPC"},{"id":"integracion","n":"Integración IPC"},{"id":"lamport","n":"Lamport y orden"},{"id":"vector","n":"Vector clocks"},{"id":"consistencia","n":"Modelos de consistencia"},{"id":"cap","n":"CAP, PACELC y 2PC"},{"id":"replicacion","n":"Replicación"},{"id":"fallos","n":"Fallos, heartbeats y quórum"},{"id":"raft","n":"Consenso y Raft"}],"modulos":["relojes","drills"],"ejercicios":[{"id":"L01","group":"lamport","n":"Ej. 1","topic":"lamport","lvl":1,"min":8,"title":"Completar los relojes","statement":"<p>El diagrama muestra tres procesos con eventos marcados por letras. Las flechas son mensajes. Completa los timestamps de Lamport de los eventos con <b>?</b>.</p>","diagram":{"procs":["P1","P2","P3"],"evs":[{"k":"a","p":0,"x":120,"v":"1"},{"k":"b","p":0,"x":230,"v":"2"},{"k":"c","p":0,"x":420,"v":"?"},{"k":"d","p":0,"x":560,"v":"?"},{"k":"e","p":1,"x":160,"v":"1"},{"k":"f","p":1,"x":300,"v":"?"},{"k":"g","p":1,"x":440,"v":"?"},{"k":"h","p":2,"x":200,"v":"1"},{"k":"i","p":2,"x":350,"v":"?"},{"k":"j","p":2,"x":510,"v":"?"}],"msgs":[["b","f","m1"],["i","c","m2"],["g","j","m3"]]},"fields":[{"k":"c","label":"c · P1 · recepción m2","ans":["3"]},{"k":"d","label":"d · P1 · interno","ans":["4"]},{"k":"f","label":"f · P2 · recepción m1","ans":["3"]},{"k":"g","label":"g · P2 · envío m3","ans":["4"]},{"k":"i","label":"i · P3 · envío m2","ans":["2"]},{"k":"j","label":"j · P3 · recepción m3","ans":["5"]}],"hints":["Avanza por proceso de izquierda a derecha, pero una recepción solo se puede calcular cuando ya conoces el timestamp del envío.","i es un envío después de h (C=1): solo suma 1.","Recepción: max(reloj local, ts del mensaje) + 1."],"think":["P3: h=1, i (envío m2) = 2.","P2: e=1, f recibe m1 (ts 2): max(1,2)+1 = 3. g envía m3: 4.","P1: b=2, c recibe m2 (ts 2): max(2,2)+1 = 3. d interno: 4.","P3: j recibe m3 (ts 4): max(2,4)+1 = 5."],"errors":["Calcular c como 2+1 sin mirar el ts del mensaje (aquí da igual por casualidad, pero no siempre).","Olvidar el +1 después del max.","Calcular j como i+1 ignorando que m3 trae ts 4."]},{"id":"L02","group":"lamport","n":"Ej. 2","topic":"lamport","lvl":1,"min":8,"title":"Happens-before y concurrencia","statement":"<p>El diagrama tiene los timestamps del enunciado. Clasifica cada par con la relación happens-before. <b>Ojo:</b> decide por caminos de flechas y líneas de proceso, no por los números.</p>","diagram":{"procs":["P1","P2"],"evs":[{"k":"A","p":0,"x":130,"v":"1"},{"k":"B","p":0,"x":250,"v":"2"},{"k":"D","p":0,"x":500,"v":"6"},{"k":"C","p":1,"x":190,"v":"1"},{"k":"E","p":1,"x":370,"v":"3"},{"k":"F","p":1,"x":560,"v":"7"}],"msgs":[["B","E","m1"],["E","D","m2"]]},"fields":[{"k":"AB","label":"A, B","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"AC","label":"A, C","type":"opt","opts":["→","←","∥"],"ans":["∥"]},{"k":"BE","label":"B, E","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"BF","label":"B, F","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"CD","label":"C, D","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"ED","label":"E, D","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"AF","label":"A, F","type":"opt","opts":["→","←","∥"],"ans":["→"]},{"k":"CF","label":"C, F","type":"opt","opts":["→","←","∥"],"ans":["→"]}],"hints":["X → Y si hay un camino que va de X a Y avanzando por la línea de un proceso o siguiendo una flecha.","E es a la vez la recepción de m1 y el envío de m2.","Dos eventos del mismo proceso nunca son concurrentes."],"think":["A→B y C→F: mismo proceso.","B→E por m1; E→D por m2; B→F por B→E→F.","C→D por C→E→D (C está antes de E en P2).","A→F por A→B→E→F.","A ∥ C: no hay ningún camino entre ellos.","Nota: con las reglas, D debería valer max(2,3)+1 = 4 y F = 4. Los valores 6 y 7 del enunciado no rompen la garantía (son mayores), pero no siguen la regla al pie de la letra; si sale en la prueba, pregúntale al profesor."],"errors":["Decir A ∥ F porque están en procesos distintos: hay camino A→B→E→F.","Usar C(X) < C(Y) para concluir X → Y."]},{"id":"L03","group":"lamport","n":"Ej. 3","topic":"lamport","lvl":1,"min":6,"title":"Ordenamiento total (C, PID)","statement":"<p>Ordena los eventos con la regla <b>(C, PID)</b>: menor timestamp primero y menor PID para desempatar.</p>\n <table class=\"t\"><tr><th>Evento</th><th>Proceso</th><th>C</th></tr><tr><td>α</td><td>P2</td><td>4</td></tr><tr><td>β</td><td>P1</td><td>4</td></tr><tr><td>γ</td><td>P3</td><td>1</td></tr><tr><td>δ</td><td>P1</td><td>7</td></tr><tr><td>ε</td><td>P3</td><td>4</td></tr><tr><td>ζ</td><td>P2</td><td>9</td></tr><tr><td>η</td><td>P1</td><td>2</td></tr><tr><td>θ</td><td>P3</td><td>6</td></tr></table>\n <p>Escribe la <b>posición</b> (1 a 8) de cada evento.</p>","fields":[{"k":"α","label":"α","ans":["4"]},{"k":"β","label":"β","ans":["3"]},{"k":"γ","label":"γ","ans":["1"]},{"k":"δ","label":"δ","ans":["7"]},{"k":"ε","label":"ε","ans":["5"]},{"k":"ζ","label":"ζ","ans":["8"]},{"k":"η","label":"η","ans":["2"]},{"k":"θ","label":"θ","ans":["6"]}],"qs":[{"q":"Hay tres eventos con C=4. ¿Qué implica eso respecto a su relación causal?","a":"Que <b>ninguno precede causalmente a otro</b>: si X→Y entonces C(X)&lt;C(Y), así que con C igual no puede haber relación. Son concurrentes entre sí."},{"q":"¿El ordenamiento total obtenido es único? Justifica.","a":"Con la regla (C, PID) fija, <b>sí</b>: es determinístico (todos los nodos obtienen el mismo). Pero no es el único orden válido: con otra regla de desempate se obtendría otro orden total igual de consistente con la causalidad, porque α, β y ε son concurrentes."}],"hints":["Primero ordena por C. Después, dentro de cada empate, ordena por número de proceso.","Los tres eventos con C=4 son β (P1), α (P2) y ε (P3)."],"think":["Por C: γ(1), η(2), {α,β,ε}(4), θ(6), δ(7), ζ(9).","Empate en 4 por PID: β(P1), α(P2), ε(P3).","Orden: γ, η, β, α, ε, θ, δ, ζ."],"errors":["Desempatar por letra del evento en vez de por PID.","Pensar que el orden total refleja el tiempo real."]},{"id":"L04","group":"lamport","n":"Ej. 4","topic":"lamport","lvl":1,"min":6,"title":"Detectar el error","statement":"<p>El diagrama contiene exactamente un timestamp incorrecto. Identifícalo y corrígelo.</p>","diagram":{"procs":["Pa","Pb"],"evs":[{"k":"X","p":0,"x":120,"v":"1"},{"k":"Y","p":0,"x":280,"v":"2"},{"k":"Z","p":0,"x":480,"v":"3"},{"k":"W","p":1,"x":180,"v":"1"},{"k":"Q","p":1,"x":370,"v":"2","cls":"bad"},{"k":"V","p":1,"x":540,"v":"6"}],"msgs":[["Y","Q","m1"],["Z","V","m2"]]},"fields":[{"k":"ev","label":"Evento con error","type":"opt","opts":["X","Y","Z","W","Q","V"],"ans":["Q"]},{"k":"regla","label":"Regla violada","type":"opt","opts":["Local/envío (C+1)","Recepción max(C,T)+1"],"ans":["Recepción max(C,T)+1"]},{"k":"val","label":"Valor correcto","ans":["3"]}],"qs":[{"q":"¿Qué consecuencia tiene sobre el ordenamiento total si no se detecta?","a":"Q (2) quedaría <b>empatado con su causa</b> Y (2). Al desempatar por PID, la recepción podría ordenarse <b>antes</b> que el envío del mismo mensaje: el orden total violaría la causalidad (un efecto antes que su causa), justo lo que Lamport debe impedir."}],"hints":["Revisa primero las recepciones: ahí es donde más se equivoca.","Q recibe m1, que lleva el timestamp de Y."],"think":["Q recibe m1 con T=2 y su reloj local era 1: max(1,2)+1 = <b>3</b>, no 2.","Se viola la regla de recepción (y la garantía Y→Q ⇒ C(Y) &lt; C(Q)).","Nota: con Q=3, V debería ser max(3,3)+1 = 4. El 6 del enunciado no rompe la garantía, pero el error \"pedido\" es Q."],"errors":["Marcar V porque \"6 parece raro\": V no viola ninguna garantía (6 > 3)."]},{"id":"L05","group":"lamport","n":"Ej. 5","topic":"lamport","lvl":2,"min":10,"title":"Diseño libre: sensores del reactor","statement":"<p>Tres sensores (S1, S2, S3) monitorean un reactor:</p><ul class=\"clean\">\n <li>S1 toma una lectura (e1), luego envía una alerta a S2.</li><li>S2 recibe la alerta (e2), hace su propia lectura (e3) y envía un reporte a S3.</li>\n <li>S3 toma una lectura independiente (e4) antes de recibir el reporte de S2.</li><li>S3 recibe el reporte (e5) y envía una confirmación a S1 (e6).</li><li>S1 recibe la confirmación (e7).</li></ul>\n <p><b>1.</b> Dibuja el diagrama espacio-tiempo en tu hoja. <b>2.</b> Calcula los relojes (la tabla trata \"lectura + envío\" como un solo evento).</p>","fields":[{"k":"e1","label":"e1","ans":["1"]},{"k":"e2","label":"e2","ans":["2"]},{"k":"e3","label":"e3","ans":["3"]},{"k":"e4","label":"e4","ans":["1"]},{"k":"e5","label":"e5","ans":["4"]},{"k":"e6","label":"e6","ans":["5"]},{"k":"e7","label":"e7","ans":["6"]},{"k":"q1","label":"¿e4 ∥ e1?","type":"opt","opts":["Sí","No"],"ans":["Sí"]},{"k":"q2","label":"¿e4 ∥ e2?","type":"opt","opts":["Sí","No"],"ans":["Sí"]}],"solDiagram":{"procs":["S1","S2","S3"],"evs":[{"k":"e1","p":0,"x":100,"v":"1"},{"k":"e7","p":0,"x":560,"v":"6"},{"k":"e2","p":1,"x":210,"v":"2"},{"k":"e3","p":1,"x":310,"v":"3"},{"k":"e4","p":2,"x":160,"v":"1"},{"k":"e5","p":2,"x":400,"v":"4"},{"k":"e6","p":2,"x":480,"v":"5"}],"msgs":[["e1","e2","alerta"],["e3","e5","reporte"],["e6","e7","conf."]]},"qs":[{"q":"¿Es e4 concurrente con e1? ¿Y con e2? Justifica formalmente.","a":"<b>Sí en ambos casos.</b> Para e1→e4 haría falta un camino de S1 a S3 que llegue antes de e4, pero lo primero que S3 recibe es e5, después de e4. Tampoco e4→e1 ni e4→e2: nada sale de S3 antes de e6. Ninguna de las tres reglas de happens-before se cumple, así que e4 ∥ e1 y e4 ∥ e2."},{"q":"¿Podría Lamport detectar que e4 ocurrió antes que e2 en tiempo real? ¿Por qué?","a":"<b>No.</b> Lamport solo captura causalidad, no tiempo físico. C(e4)=1 &lt; C(e2)=2, pero eso <b>no implica</b> e4→e2 (son concurrentes) ni dice nada del tiempo real. Para eso harían falta relojes físicos sincronizados."}],"hints":["Cada sensor es una línea horizontal; dibuja las flechas alerta, reporte y confirmación.","e4 es el primer evento de S3: vale 1.","e5 = max(1, 3) + 1."],"think":["S1: e1 = 1 (envía con ts 1).","S2: e2 = max(0,1)+1 = 2; e3 = 3 (envía con ts 3).","S3: e4 = 1; e5 = max(1,3)+1 = 4; e6 = 5.","S1: e7 = max(1,5)+1 = 6."],"errors":["Hacer e4 = 4 o 5 pensando que \"ocurre después\" en el relato: en S3 es el primer evento.","Responder que e4 → e2 porque C(e4) < C(e2)."]},{"id":"L06","group":"lamport","n":"Ej. 6","topic":"lamport","lvl":1,"min":8,"title":"Completar las funciones de Lamport","statement":"<p>Completa <code>lamport_local()</code>, <code>lamport_send()</code> y <code>lamport_recv()</code> según las reglas, y escribe la salida exacta del programa.</p>","files":[{"name":"reloj.c","code":"/* reloj.c — nodo con reloj de Lamport */\n#include <stdio.h>\n\ntypedef struct {\n    int clock;\n    char id[8];\n} Node;\n\nvoid lamport_local(Node *n) {\n//@TODO 1 | Evento interno: C <- C + 1\n    n->clock++; //§\n//@END\n}\n\nvoid lamport_send(Node *n, int *ts) {\n//@TODO 2 | Envío: incrementar y guardar en *ts el timestamp a enviar\n    n->clock++; //§\n    *ts = n->clock; //§\n//@END\n}\n\nvoid lamport_recv(Node *n, int ts_recv) {\n//@TODO 3 | Recepción: C <- max(C, T) + 1\n    if (ts_recv > n->clock) //§\n        n->clock = ts_recv; //§\n    n->clock++; //§\n//@END\n}\n\nint main(void) {\n    Node p1 = { 0, \"P1\" };\n    Node p2 = { 0, \"P2\" };\n    int ts;\n\n    lamport_local(&p1);           /* a: evento interno P1 */\n    lamport_send(&p1, &ts);       /* b: P1 envía m1 */\n    printf(\"%s envía m1 ts=%d\\n\", p1.id, ts);\n\n    lamport_local(&p2);           /* c: evento interno P2 */\n    lamport_recv(&p2, ts);        /* d: P2 recibe m1 */\n    printf(\"%s recibe m1 clock=%d\\n\", p2.id, p2.clock);\n\n    lamport_send(&p2, &ts);       /* e: P2 envía m2 */\n    lamport_recv(&p1, ts);        /* f: P1 recibe m2 */\n    printf(\"%s recibe m2 clock=%d\\n\", p1.id, p1.clock);\n    return 0;\n}\n"}],"out":"P1 envía m1 ts=2\nP2 recibe m1 clock=3\nP1 recibe m2 clock=5","qs":[{"q":"Si en lamport_recv usaras n->clock = ts_recv + 1 (sin el max), ¿en qué escenario falla? Ejemplo concreto.","a":"Falla cuando el reloj local ya está <b>adelante</b> del mensaje. Ej.: P2 hizo 10 eventos (clock=10) y recibe un mensaje con ts=3: quedaría en 4, <b>retrocediendo</b>. Un evento posterior en P2 tendría menor timestamp que uno anterior del mismo proceso, y se rompe \"X→Y ⇒ C(X) &lt; C(Y)\"."}],"hints":["Local y envío hacen lo mismo con el reloj; el envío además entrega el valor.","En C no existe max() para int: usa un if."],"think":["Local: clock++.","Envío: clock++ y *ts = clock (el mensaje lleva el reloj ya incrementado).","Recepción: si ts_recv > clock, clock = ts_recv; luego clock++.","Traza: a=1, b=2 (ts=2); c=1 en P2, d=max(1,2)+1=3; e=4, f=max(2,4)+1=5."],"errors":["Asignar *ts antes de incrementar.","Usar ts_recv + 1 sin max."],"rubric":[{"pts":2,"t":"lamport_local incrementa en 1"},{"pts":3,"t":"lamport_send incrementa y luego guarda en *ts"},{"pts":3,"t":"lamport_recv usa max(clock, ts_recv) + 1"},{"pts":2,"t":"Salida exacta correcta"},{"pts":2,"t":"Escenario de falla sin max bien explicado"}],"lang":"c","pruebas":{"compilar":[{"src":["reloj.c"],"out":"reloj"},{"src":["prueba/l06.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Tu programa produce la salida esperada","cmd":"./reloj","espera":{"salida":"P1 envía m1 ts=2\nP2 recibe m1 clock=3\nP1 recibe m2 clock=5"}},{"tipo":"ejecutar","nombre":"Casos extra de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/l06.c":"/* Prueba extra del Ej. 6: casos que el main del enunciado no cubre */\n#include <stdio.h>\n#define main main_estudiante        /* tu main queda con otro nombre */\n#include \"../reloj.c\"\n#undef main\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\nint main(void) {\n    Node n = { 10, \"P\" };\n    lamport_recv(&n, 3);\n    CHECK(n.clock == 11, \"Recibir ts=3 con reloj 10 deja el reloj en 11: max(10,3)+1 (el reloj no retrocede)\");\n    n.clock = 2; lamport_recv(&n, 7);\n    CHECK(n.clock == 8, \"Recibir ts=7 con reloj 2 deja el reloj en 8: max(2,7)+1\");\n    int ts = -1; n.clock = 4; lamport_send(&n, &ts);\n    CHECK(n.clock == 5 && ts == 5, \"Enviar con reloj 4: el reloj y el ts del mensaje quedan en 5\");\n    n.clock = 0; lamport_local(&n); lamport_local(&n);\n    CHECK(n.clock == 2, \"Dos eventos internos desde 0 dejan el reloj en 2\");\n    return 0;\n}\n"}}},{"id":"L07","group":"lamport","n":"Ej. 7","topic":"lamport","lvl":1,"min":8,"title":"Comparador de orden total (qsort)","statement":"<p>Implementa <code>total_order_cmp()</code> para <code>qsort</code>: primero por timestamp y desempate por PID. Escribe la salida.</p>","files":[{"name":"order.c","code":"/* order.c */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct {\n    char proc[4];\n    int ts;\n    char name[8];\n} Event;\n\nint total_order_cmp(const void *a, const void *b) {\n//@TODO 1 | <0 si a va primero, >0 si b va primero\n    const Event *x = (const Event *)a; //§\n    const Event *y = (const Event *)b; //§\n    if (x->ts != y->ts) //§\n        return x->ts - y->ts; //§\n    return strcmp(x->proc, y->proc); //§\n//@END\n}\n\nEvent events[] = {\n    {\"P2\",4,\"α\"}, {\"P1\",4,\"β\"}, {\"P3\",1,\"γ\"}, {\"P1\",7,\"δ\"},\n    {\"P3\",4,\"ε\"}, {\"P2\",9,\"ζ\"}, {\"P1\",2,\"η\"}, {\"P3\",6,\"θ\"},\n};\n#define N (sizeof(events)/sizeof(events[0]))\n\nint main(void) {\n    qsort(events, N, sizeof(Event), total_order_cmp);\n    for (int i = 0; i < (int)N; i++)\n        printf(\"%d. [%s ts=%d] %s\\n\", i+1, events[i].proc, events[i].ts, events[i].name);\n    return 0;\n}\n"}],"out":"1. [P3 ts=1] γ\n2. [P1 ts=2] η\n3. [P1 ts=4] β\n4. [P2 ts=4] α\n5. [P3 ts=4] ε\n6. [P3 ts=6] θ\n7. [P1 ts=7] δ\n8. [P2 ts=9] ζ","qs":[{"q":"Tres eventos tienen C=4. ¿Podrían los tres estar causalmente relacionados?","a":"<b>No.</b> Si X→Y, Lamport garantiza C(X) &lt; C(Y) estrictamente. Con el mismo C ninguno puede preceder a otro: son concurrentes."}],"hints":["qsort entrega void*: conviértelos a const Event*.","Para comparar strings usa strcmp, nunca ==."],"think":["Castear a y b.","Si ts difiere, retornar la resta (da el signo correcto).","Si empatan, strcmp(proc) (\"P1\" < \"P2\" < \"P3\")."],"errors":["Comparar x->proc == y->proc (compara punteros).","Olvidar el cast desde void*."],"rubric":[{"pts":2,"t":"Cast correcto de void*"},{"pts":3,"t":"Ordena por ts con signo correcto"},{"pts":3,"t":"Desempata con strcmp"},{"pts":2,"t":"Salida correcta y respuesta sobre C=4"}],"lang":"c","pruebas":{"compilar":[{"src":["order.c"],"out":"order"}],"pasos":[{"tipo":"ejecutar","nombre":"Tu programa produce la salida esperada","cmd":"./order","espera":{"salida":"1. [P3 ts=1] γ\n2. [P1 ts=2] η\n3. [P1 ts=4] β\n4. [P2 ts=4] α\n5. [P3 ts=4] ε\n6. [P3 ts=6] θ\n7. [P1 ts=7] δ\n8. [P2 ts=9] ζ"}}],"archivos":{}}},{"id":"L08","group":"lamport","n":"Ej. 8","topic":"lamport","lvl":1,"min":8,"title":"Replay de log","statement":"<p>Completa la columna C manualmente e implementa <code>replay()</code>, que imprime <code>evento N: C=valor</code>.</p>\n <table class=\"t\"><tr><th>#</th><th>Tipo</th><th>ts_recv</th></tr><tr><td>1</td><td>LOCAL</td><td>—</td></tr><tr><td>2</td><td>LOCAL</td><td>—</td></tr><tr><td>3</td><td>SEND</td><td>—</td></tr><tr><td>4</td><td>RECV</td><td>7</td></tr><tr><td>5</td><td>LOCAL</td><td>—</td></tr><tr><td>6</td><td>RECV</td><td>5</td></tr><tr><td>7</td><td>SEND</td><td>—</td></tr><tr><td>8</td><td>RECV</td><td>12</td></tr></table>","files":[{"name":"replay.c","code":"/* replay.c */\n#include <stdio.h>\n\ntypedef enum { LOCAL, SEND, RECV } EvType;\n\ntypedef struct {\n    EvType type;\n    int ts_recv;    /* válido solo si type == RECV */\n} LogEntry;\n\nLogEntry log_[] = {\n    {LOCAL,0}, {LOCAL,0}, {SEND,0}, {RECV,7},\n    {LOCAL,0}, {RECV,5},  {SEND,0}, {RECV,12},\n};\n#define N (sizeof(log_)/sizeof(log_[0]))\n\nvoid replay(int *clock, LogEntry *log, int n) {\n//@TODO 1 | Itera el log aplicando Lamport e imprime \"evento N: C=valor\"\n    for (int i = 0; i < n; i++) {\n        if (log[i].type == RECV && log[i].ts_recv > *clock) //§\n            *clock = log[i].ts_recv; //§\n        (*clock)++; //§\n        printf(\"evento %d: C=%d\\n\", i + 1, *clock); //§\n    }\n//@END\n}\n\nint main(void) {\n    int clock = 0;\n    replay(&clock, log_, N);\n    return 0;\n}\n"}],"out":"evento 1: C=1\nevento 2: C=2\nevento 3: C=3\nevento 4: C=8\nevento 5: C=9\nevento 6: C=10\nevento 7: C=11\nevento 8: C=13","qs":[{"q":"En el evento 6 llega ts_recv=5, pero el reloj ya es mayor. ¿Qué valor queda y por qué no retrocede?","a":"Queda <b>10</b>: max(9, 5) + 1. El max conserva el reloj local porque un reloj lógico <b>nunca retrocede</b>; si lo hiciera, el evento 6 tendría menor C que el 5, que ocurrió antes en el mismo proceso."}],"hints":["Los tres tipos terminan con +1; solo RECV tiene un paso antes.","El reloj llega por puntero: (*clock)++ con paréntesis."],"think":["Un for por las n entradas.","Si es RECV y ts_recv > *clock: *clock = ts_recv.","Siempre (*clock)++ y luego printf."],"errors":["Escribir *clock++ (incrementa el puntero).","Imprimir antes de actualizar."],"rubric":[{"pts":2,"t":"Recorre el log"},{"pts":3,"t":"RECV con máximo"},{"pts":2,"t":"(*clock)++ con paréntesis"},{"pts":3,"t":"Tabla/salida y respuesta del evento 6 correctas"}],"lang":"c","pruebas":{"compilar":[{"src":["replay.c"],"out":"replay"}],"pasos":[{"tipo":"ejecutar","nombre":"Tu programa produce la salida esperada","cmd":"./replay","espera":{"salida":"evento 1: C=1\nevento 2: C=2\nevento 3: C=3\nevento 4: C=8\nevento 5: C=9\nevento 6: C=10\nevento 7: C=11\nevento 8: C=13"}}],"archivos":{}}},{"id":"L09","group":"lamport","n":"Ej. 9","topic":"lamport","lvl":2,"min":12,"title":"Lamport sobre sockets TCP","statement":"<p>Un servidor recibe mensajes con un campo <code>ts</code> y mantiene un reloj global. Completa los 4 TODO.</p>","files":[{"name":"server_lamport.c","code":"/* server_lamport.c — fragmento (servidor y cliente) */\n#include <stdio.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n\ntypedef struct {\n    int ts;\n    char payload[64];\n} Msg;\n\nstatic int global_clock = 0;\n\nvoid handle_client(int fd) {\n    Msg msg, resp;\n    while (recv(fd, &msg, sizeof(msg), 0) > 0) {\n        /* 1. Actualizar reloj al recibir */\n//@TODO 1 | Regla de recepción\n        if (msg.ts > global_clock) //§\n            global_clock = msg.ts; //§\n        global_clock++; //§\n//@END\n        printf(\"[srv clock=%d] recibido '%s'\\n\", global_clock, msg.payload);\n\n        /* 2. Evento interno de procesamiento */\n//@TODO 2 | Evento interno\n        global_clock++; //§\n//@END\n\n        /* 3. Preparar respuesta con timestamp */\n        snprintf(resp.payload, sizeof(resp.payload), \"ACK\");\n//@TODO 3 | Guardar timestamp en resp.ts (enviar también es un evento)\n        global_clock++; //§\n        resp.ts = global_clock; //§\n//@END\n        send(fd, &resp, sizeof(resp), 0);\n    }\n}\n\n/* Fragmento del cliente */\nvoid client_send(int fd, int *clock, const char *text) {\n    Msg msg;\n//@TODO 4 | Incrementar reloj y adjuntar timestamp\n    (*clock)++; //§\n    msg.ts = *clock; //§\n//@END\n    snprintf(msg.payload, sizeof(msg.payload), \"%s\", text);\n    send(fd, &msg, sizeof(msg), 0);\n}\n"}],"qs":[{"q":"El servidor usa global_clock sin mutex. Si se usa fork() para manejar clientes (como en el Control 01), ¿se comparte este reloj? ¿Qué problema genera y cómo lo resolverías?","a":"<b>No se comparte.</b> fork() copia la memoria: cada hijo tiene su propio global_clock, así que los relojes de cada conexión divergen y ya no existe un reloj único del servidor. Soluciones: (1) que los hijos envíen los eventos a <b>un proceso</b> que mantenga el reloj (pipe hijo→padre, como en el Ej. 12); o (2) <b>memoria compartida</b> (mmap/shmget) protegida con un semáforo."},{"q":"Si se usan hilos (pthread) en vez de fork(), ¿cambia el problema? ¿Qué mecanismo usarías?","a":"Con hilos la variable <b>sí se comparte</b>, pero aparece una <b>condición de carrera</b>: dos hilos pueden leer y escribir global_clock a la vez y perder actualizaciones. Se protege con un <code>pthread_mutex_t</code> (lock antes de actualizar, unlock después)."}],"hints":["Paso 1 es la regla de recepción. Paso 2 es un evento interno. Paso 3 adjunta el reloj.","En el cliente, el reloj llega como puntero."],"think":["Recepción: global_clock = max(global_clock, msg.ts) + 1.","Interno: global_clock++.","Respuesta: enviar también es un evento, así que global_clock++ y resp.ts = global_clock. Si tu profesor considera el paso 2 como parte del envío, basta con resp.ts = global_clock; lo importante es justificarlo.","Cliente: (*clock)++ y msg.ts = *clock."],"errors":["Pensar que fork() comparte variables globales.","(*clock)++ sin paréntesis."],"rubric":[{"pts":3,"t":"TODO 1: recepción con max + 1"},{"pts":1,"t":"TODO 2: evento interno"},{"pts":2,"t":"TODO 3: resp.ts con el reloj actual"},{"pts":2,"t":"TODO 4: cliente incrementa y adjunta"},{"pts":2,"t":"Respuesta fork()"},{"pts":2,"t":"Respuesta hilos + mutex"}],"lang":"c","pruebas":{"compilar":[{"src":["prueba/l09.c"],"out":"pruebas_bin"}],"pasos":[{"tipo":"ejecutar","nombre":"Pruebas de tus funciones","cmd":"./pruebas_bin"}],"archivos":{"prueba/l09.c":"/* Prueba del Ej. 9: tu servidor y tu cliente hablan por un socketpair */\n#include <stdio.h>\n#include <stdlib.h>\n#include <sys/wait.h>\n#include \"../server_lamport.c\"\n#define CHECK(c, msg) printf((c) ? \"OK: %s\\n\" : \"FALLA: %s\\n\", msg)\n\nint main(void) {\n    int sv[2];\n    socketpair(AF_UNIX, SOCK_STREAM, 0, sv);\n    setvbuf(stdout, NULL, _IONBF, 0);\n    if (fork() == 0) { close(sv[0]); handle_client(sv[1]); exit(0); }\n    close(sv[1]);\n    int clock = 0;\n    Msg r;\n    client_send(sv[0], &clock, \"hola\");\n    CHECK(clock == 1, \"client_send incrementa el reloj del cliente (0 -> 1)\");\n    recv(sv[0], &r, sizeof r, 0);\n    printf(\"   respuesta 1: ts=%d\\n\", r.ts);\n    CHECK(r.ts == 3 || r.ts == 4, \"Respuesta 1: max(0,1)+1 = 2, +1 interno = 3 (o 4 si cuentas el envío)\");\n    int prev = r.ts;\n    clock = 99;\n    client_send(sv[0], &clock, \"salto\");\n    CHECK(clock == 100, \"client_send usa el puntero: el reloj queda en 100\");\n    recv(sv[0], &r, sizeof r, 0);\n    printf(\"   respuesta 2 (mensaje con ts=100): ts=%d\\n\", r.ts);\n    CHECK(r.ts == 102 || r.ts == 103, \"Recepción con ts=100: el servidor salta a max(...,100)+1 = 101 y luego avanza\");\n    clock = 0;\n    client_send(sv[0], &clock, \"viejo\");\n    recv(sv[0], &r, sizeof r, 0);\n    printf(\"   respuesta 3 (mensaje con ts=1): ts=%d\\n\", r.ts);\n    CHECK(r.ts > 102, \"Un mensaje con ts pequeño NO hace retroceder el reloj del servidor (usa max)\");\n    (void)prev;\n    close(sv[0]);\n    wait(NULL);\n    return 0;\n}\n"}}},{"id":"L10","group":"lamport","n":"Ej. 10","topic":"vector","lvl":2,"min":12,"title":"Extender Lamport: relojes vectoriales","statement":"<p>Lamport no distingue \"A antes de B\" de \"A y B concurrentes\". Implementa las 5 funciones de un reloj vectorial y escribe la salida.</p>","files":[{"name":"vclock.c","code":"/* vclock.c — relojes vectoriales */\n#include <stdio.h>\n#include <string.h>\n\n#define NPROC 3\n\ntypedef struct {\n    int v[NPROC];   /* v[i] = conocimiento sobre Pi */\n    int pid;\n} VNode;\n\nvoid vc_local(VNode *n) {\n//@TODO 1 | Incrementa solo la propia entrada\n    n->v[n->pid]++; //§\n//@END\n}\n\nvoid vc_send(VNode *n, int out[NPROC]) {\n//@TODO 2 | Incrementa y copia el vector a out\n    n->v[n->pid]++; //§\n    for (int i = 0; i < NPROC; i++) //§\n        out[i] = n->v[i]; //§\n//@END\n}\n\nvoid vc_recv(VNode *n, const int rcv[NPROC]) {\n//@TODO 3 | Máximo componente a componente, luego incrementa\n    for (int i = 0; i < NPROC; i++) //§\n        if (rcv[i] > n->v[i]) n->v[i] = rcv[i]; //§\n    n->v[n->pid]++; //§\n//@END\n}\n\n/* a → b sii ∀i: a[i] ≤ b[i] y ∃j: a[j] < b[j] */\nint vc_happens_before(const int a[NPROC], const int b[NPROC]) {\n//@TODO 4 | Comparación de vectores\n    int alguno_menor = 0; //§\n    for (int i = 0; i < NPROC; i++) {\n        if (a[i] > b[i]) return 0; //§\n        if (a[i] < b[i]) alguno_menor = 1; //§\n    }\n    return alguno_menor; //§\n//@END\n}\n\nint vc_concurrent(const int a[NPROC], const int b[NPROC]) {\n//@TODO 5 | Usa vc_happens_before\n    return !vc_happens_before(a, b) && !vc_happens_before(b, a); //§\n//@END\n}\n\nvoid print_vc(const char *label, const int v[NPROC]) {\n    printf(\"%s: [%d,%d,%d]\\n\", label, v[0], v[1], v[2]);\n}\n\nint main(void) {\n    VNode p0 = {{0,0,0}, 0};\n    VNode p1 = {{0,0,0}, 1};\n    VNode p2 = {{0,0,0}, 2};\n    int ts[NPROC], snap_a[NPROC], snap_b[NPROC];\n\n    vc_local(&p0);                      /* evento a */\n    memcpy(snap_a, p0.v, sizeof(ts));\n    print_vc(\"P0 tras a\", p0.v);\n\n    vc_local(&p2);                      /* evento b — independiente */\n    memcpy(snap_b, p2.v, sizeof(ts));\n    print_vc(\"P2 tras b\", p2.v);\n\n    vc_send(&p0, ts);                   /* P0 envía m1 */\n    vc_recv(&p1, ts);                   /* P1 recibe m1 */\n    print_vc(\"P1 tras recv m1\", p1.v);\n\n    printf(\"a → P1_actual: %s\\n\", vc_happens_before(snap_a, p1.v) ? \"SÍ\" : \"NO\");\n    printf(\"a ∥ b: %s\\n\", vc_concurrent(snap_a, snap_b) ? \"SÍ\" : \"NO\");\n    return 0;\n}\n"}],"out":"P0 tras a: [1,0,0]\nP2 tras b: [0,0,1]\nP1 tras recv m1: [2,1,0]\na → P1_actual: SÍ\na ∥ b: SÍ","qs":[{"q":"¿Qué información entrega el vector que Lamport escalar no puede dar?","a":"Permite <b>detectar concurrencia</b>: A→B ⟺ V(A) &lt; V(B). Con Lamport, C(A) &lt; C(B) no dice si hay causalidad o si son concurrentes. Además, cada componente dice cuántos eventos de cada proceso \"conoce\" el nodo."},{"q":"¿Por qué la recepción toma el máximo componente a componente y no sobrescribe con el vector recibido?","a":"Porque el receptor puede saber <b>más</b> que el emisor sobre algunos procesos (incluido él mismo). Sobrescribir borraría ese conocimiento: el reloj retrocedería en esas componentes y se perdería causalidad ya registrada."}],"hints":["v[pid] es tu propia componente.","happens_before: ningún a[i] mayor que b[i], y al menos uno estrictamente menor.","concurrent: ni a→b ni b→a."],"think":["local: v[pid]++. send: v[pid]++ y copiar a out.","recv: para todo i, v[i] = max(v[i], rcv[i]); luego v[pid]++.","Traza: p0 [1,0,0]; p2 [0,0,1]; p0 envía [2,0,0]; p1 recibe → [2,0,0] y luego +1 propio = [2,1,0]."],"errors":["Comparar solo una componente.","En concurrent, olvidar uno de los dos sentidos."],"rubric":[{"pts":2,"t":"vc_local"},{"pts":2,"t":"vc_send incrementa y copia"},{"pts":3,"t":"vc_recv: máximo y luego +1 propio"},{"pts":3,"t":"vc_happens_before correcto (∀ ≤ y ∃ <)"},{"pts":2,"t":"vc_concurrent usando happens_before"},{"pts":2,"t":"Salida y respuestas teóricas"}],"lang":"c","pruebas":{"compilar":[{"src":["vclock.c"],"out":"vclock"}],"pasos":[{"tipo":"ejecutar","nombre":"Tu programa produce la salida esperada","cmd":"./vclock","espera":{"salida":"P0 tras a: [1,0,0]\nP2 tras b: [0,0,1]\nP1 tras recv m1: [2,1,0]\na → P1_actual: SÍ\na ∥ b: SÍ"}}],"archivos":{}}},{"id":"L11","group":"lamport","n":"Ej. 11","topic":"lamport","lvl":3,"min":35,"title":"Exclusión mutua distribuida con pipes","statement":"<p>P0, P1 y P2 comparten <code>log.txt</code>; solo uno escribe a la vez. Se comunican por pipes (sin servidor central) con el algoritmo de exclusión mutua de Lamport:</p>\n <ol><li>Para entrar: enviar REQUEST(ts, pid) a todos.</li><li>Al recibir un REQUEST: responder REPLY(ts, pid).</li><li>Entrar solo con REPLY de todos y siendo el REQUEST de menor (ts, pid).</li><li>Al salir: RELEASE(ts, pid) a todos.</li></ol>\n <p>Cada proceso hace 2 ciclos request → enter → escribir \"P&lt;pid&gt; ts=&lt;C&gt; escribe\" → release.</p>","files":[{"name":"mutex_lamport.c","code":"/* mutex_lamport.c — exclusión mutua de Lamport con pipes */\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <fcntl.h>\n#include <sys/wait.h>\n#include <sys/select.h>\n\n#define NPROC  3\n#define CICLOS 2\n\ntypedef enum { REQUEST, REPLY, RELEASE } MsgType;\n\ntypedef struct {\n    MsgType type;\n    int ts;     /* timestamp Lamport del emisor */\n    int pid;    /* PID lógico del emisor */\n} Msg;\n\n/* fds[i][j] = pipe para que el proceso i ESCRIBA al proceso j.\n   fds[i][j][0] = extremo de lectura (lo usa j), fds[i][j][1] = escritura (lo usa i). */\nint fds[NPROC][NPROC][2];\n\nint me;                 /* mi PID lógico */\nint reloj = 0;          /* reloj de Lamport */\nint cola_ts[NPROC];     /* ts de la solicitud pendiente de cada proceso (-1 = ninguna) */\nint replies = 0;        /* REPLY recibidos para mi solicitud actual */\nint releases = 0;       /* RELEASE recibidos en total */\n\nvoid enviar(int dest, MsgType t, int ts) {\n    Msg m = { t, ts, me };\n    write(fds[me][dest][1], &m, sizeof m);\n}\n\n/* ¿la solicitud (ta, pa) va antes que (tb, pb)? Orden total (ts, pid). */\nint va_antes(int ta, int pa, int tb, int pb) {\n    return ta < tb || (ta == tb && pa < pb);\n}\n\nvoid procesar(const Msg *m) {\n//@TODO 1 | Recepción: actualizar reloj y reaccionar según el tipo\n    reloj = (m->ts > reloj ? m->ts : reloj) + 1; //§\n    if (m->type == REQUEST) {\n        cola_ts[m->pid] = m->ts; //§\n        reloj++; //§\n        enviar(m->pid, REPLY, reloj); //§\n    } else if (m->type == REPLY) {\n        replies++; //§\n    } else { /* RELEASE */\n        cola_ts[m->pid] = -1; //§\n        releases++; //§\n    }\n//@END\n}\n\n/* Espera un mensaje de cualquiera de los otros procesos (select) y lo procesa. */\nvoid recibir_uno(void) {\n//@TODO 2 | select() sobre las pipes de entrada\n    fd_set rd;\n    int maxfd = -1;\n    FD_ZERO(&rd); //§\n    for (int j = 0; j < NPROC; j++) {\n        if (j == me) continue;\n        FD_SET(fds[j][me][0], &rd); //§\n        if (fds[j][me][0] > maxfd) maxfd = fds[j][me][0];\n    }\n    select(maxfd + 1, &rd, NULL, NULL, NULL); //§\n    for (int j = 0; j < NPROC; j++) {\n        if (j == me || !FD_ISSET(fds[j][me][0], &rd)) continue; //§\n        Msg m;\n        int n = read(fds[j][me][0], &m, sizeof m); //§\n        if (n == 0) {   /* el otro extremo se cerró: P_j murió */\n            fprintf(stderr, \"[P%d] P%d se cayó (read() = 0)\\n\", me, j); //§\n            exit(1);\n        }\n        procesar(&m); //§\n    }\n//@END\n}\n\nvoid request_cs(void) {\n//@TODO 3 | Enviar REQUEST(ts, pid) a todos (mismo ts para todos)\n    reloj++; //§\n    cola_ts[me] = reloj; //§\n    replies = 0; //§\n    for (int j = 0; j < NPROC; j++)\n        if (j != me) enviar(j, REQUEST, cola_ts[me]); //§\n//@END\n}\n\nint puedo_entrar(void) {\n//@TODO 4 | REPLY de todos y mi solicitud es la menor (ts, pid)\n    if (replies < NPROC - 1) return 0; //§\n    for (int j = 0; j < NPROC; j++)\n        if (j != me && cola_ts[j] != -1 && va_antes(cola_ts[j], j, cola_ts[me], me)) //§\n            return 0;\n    return 1; //§\n//@END\n}\n\nvoid enter_cs(void) {\n    while (!puedo_entrar())\n        recibir_uno();\n}\n\nvoid release_cs(void) {\n//@TODO 5 | Salir: quitar mi solicitud y avisar RELEASE a todos\n    cola_ts[me] = -1; //§\n    reloj++; //§\n    for (int j = 0; j < NPROC; j++)\n        if (j != me) enviar(j, RELEASE, reloj); //§\n//@END\n}\n\n/* Sección crítica: escribe lento, a propósito, para que se note si dos procesos se mezclan */\nvoid escribir_log(void) {\n    char linea[64];\n    int len = snprintf(linea, sizeof linea, \"P%d ts=%d escribe\\n\", me, cola_ts[me]);\n    int f = open(\"log.txt\", O_WRONLY | O_CREAT | O_APPEND, 0644);\n    for (int i = 0; i < len; i++) { write(f, &linea[i], 1); usleep(3000); }\n    close(f);\n}\n\nvoid proceso(int id) {\n    me = id;\n    for (int j = 0; j < NPROC; j++) cola_ts[j] = -1;\n//@TODO 6 | Cerrar los extremos que este proceso no usa\n    for (int a = 0; a < NPROC; a++)\n        for (int b = 0; b < NPROC; b++) {\n            if (a == b) continue;\n            if (a != me) close(fds[a][b][1]); //§\n            if (b != me) close(fds[a][b][0]); //§\n        }\n//@END\n    for (int c = 0; c < CICLOS; c++) {\n        request_cs();\n        enter_cs();\n        escribir_log();\n        release_cs();\n    }\n    /* Seguir respondiendo hasta que los demás terminen sus ciclos */\n    while (releases < CICLOS * (NPROC - 1))\n        recibir_uno();\n    exit(0);\n}\n\nint main(void) {\n    unlink(\"log.txt\");\n//@TODO 7 | Crear las 6 pipes ANTES de fork() y lanzar los 3 procesos\n    for (int i = 0; i < NPROC; i++)\n        for (int j = 0; j < NPROC; j++)\n            if (i != j) pipe(fds[i][j]); //§\n    for (int i = 0; i < NPROC; i++)\n        if (fork() == 0) proceso(i); //§\n    for (int i = 0; i < NPROC; i++)\n        for (int j = 0; j < NPROC; j++)\n            if (i != j) { close(fds[i][j][0]); close(fds[i][j][1]); } //§\n    for (int i = 0; i < NPROC; i++) wait(NULL); //§\n//@END\n    printf(\"Listo. Revisa log.txt\\n\");\n    return 0;\n}\n"}],"out":"P0 ts=1 escribe\nP1 ts=1 escribe\nP2 ts=1 escribe\nP0 ts=9 escribe\nP1 ts=11 escribe\nP2 ts=14 escribe\n(los ts de la segunda ronda varían entre ejecuciones)","qs":[{"q":"Topología: ¿cuántas pipes necesitas para 3 procesos con comunicación bidireccional?","a":"Una pipe es <b>unidireccional</b>, así que hace falta una por cada par ordenado (i, j): N·(N−1) = <b>6 pipes</b> y 12 descriptores. Cada proceso conserva 2 extremos de escritura (hacia los otros) y 2 de lectura (desde los otros), y cierra los otros 8."},{"q":"¿Por qué es necesario el desempate por PID y no basta con el timestamp? Escenario con 3 procesos.","a":"Al inicio los tres piden con el reloj en 0: los tres REQUEST llevan <b>ts=1</b>. Sin desempate, cada uno vería que nadie tiene un ts menor y los tres entrarían a la vez. Con (ts, pid) el orden es total: entra P0, luego P1, luego P2. Es exactamente lo que se ve en la primera ronda del log."},{"q":"Si un proceso se cae antes de enviar RELEASE, ¿qué ocurre? ¿Cómo lo detectas con las pipes?","a":"Su REQUEST queda en la cola de los demás para siempre y <b>nadie más puede entrar</b> (bloqueo). Si murió, el SO cierra sus extremos: un <code>read()</code> en la pipe desde él retorna <b>0</b> (EOF). Al detectarlo, se puede borrar su solicitud de la cola y seguir, o abortar avisando el fallo (en la solución se imprime y termina)."}],"hints":["Guarda en cola_ts[j] el ts de la solicitud pendiente de cada proceso (−1 si no tiene).","Mientras esperas entrar, sigue atendiendo mensajes (si no, nadie recibe tus REPLY y hay deadlock).","Usa select() sobre las 2 pipes de entrada para no bloquearte en una sola."],"think":["Topología: fds[i][j] = pipe de i hacia j. Tras fork, el proceso i solo conserva fds[i][*][1] y fds[*][i][0].","request: clock++, cola_ts[me] = clock y REQUEST con ese MISMO ts a todos.","procesar: regla de recepción; REQUEST → guardar en cola y responder REPLY; REPLY → contar; RELEASE → quitar de la cola.","puedo_entrar: replies == N−1 y ninguna solicitud ajena con (ts, pid) menor.","Después de los 2 ciclos, seguir atendiendo hasta recibir todos los RELEASE (los demás aún necesitan tus REPLY).","La escritura carácter por carácter con usleep es a propósito: si la exclusión fallara, verías líneas mezcladas."],"errors":["No cerrar los extremos que no usas: read() nunca devuelve 0 y no detectas caídas.","Incrementar el reloj por cada destinatario (los REQUEST deben llevar el mismo ts).","Bloquearse en read() de una sola pipe mientras otro proceso espera tu REPLY: deadlock.","Terminar el proceso apenas acaba sus ciclos, dejando a otros sin REPLY."],"rubric":[{"pts":3,"t":"Crea N·(N−1) pipes antes de fork() y cierra extremos no usados"},{"pts":3,"t":"request_cs con el mismo ts a todos"},{"pts":4,"t":"Recepción: Lamport + manejo de REQUEST/REPLY/RELEASE"},{"pts":4,"t":"Condición de entrada: todos los REPLY y (ts, pid) mínimo"},{"pts":2,"t":"release_cs quita la solicitud y avisa"},{"pts":2,"t":"Sigue atendiendo mensajes mientras espera y al terminar"},{"pts":2,"t":"Desempate por PID explicado con escenario"},{"pts":2,"t":"Detección de caída con read() == 0"}],"lang":"c","pruebas":{"compilar":[{"src":["mutex_lamport.c"],"out":"mutex_lamport"}],"pasos":[{"tipo":"ejecutar","nombre":"Ejecutar los 3 procesos","cmd":"./mutex_lamport","timeout":25},{"tipo":"python","nombre":"Revisar log.txt","archivo":"prueba/l11.py"}],"archivos":{"prueba/l11.py":"import re\nfrom cognition_prueba import *\nlineas = leer_archivo(\"log.txt\").splitlines()\ncheck(len(lineas) == 6, \"log.txt tiene 6 líneas (3 procesos × 2 ciclos)\", \"Esperaba 6 líneas en log.txt, hay %d\" % len(lineas))\nbien = [l for l in lineas if re.fullmatch(r\"P[0-2] ts=\\d+ escribe\", l)]\ncheck(len(bien) == len(lineas) and lineas, \"Ninguna línea quedó mezclada: la exclusión mutua funciona\", \"Hay líneas mezcladas o con otro formato: %s\" % [l for l in lineas if l not in bien][:3])\nfor p in range(3):\n    n = sum(1 for l in bien if l.startswith(\"P%d \" % p))\n    check(n == 2, \"P%d entró 2 veces\" % p, \"P%d entró %d veces (esperaba 2)\" % (p, n))\nterminar()\n"}}},{"id":"L12","group":"lamport","n":"Ej. 12","topic":"lamport","lvl":3,"min":35,"title":"Concentrador de telemetría con orden causal","statement":"<p>Red SELENE: un concentrador TCP (puerto 9090, <code>fork()</code> por sonda) recibe <code>TELEM &lt;id&gt; &lt;seq&gt; &lt;val&gt; &lt;ts&gt;</code> y <code>RELAY &lt;origen&gt; &lt;destino&gt; &lt;val&gt; &lt;ts&gt;</code>, y debe escribirlos en <code>registro.log</code> en <b>orden causal</b>, no en el de llegada. Cada 2 s vacía su buffer ordenado por (ts, pid). Mantiene su propio reloj Lamport.</p>\n <p>Implementa el concentrador y una sonda que incremente su reloj en cada envío.</p>","files":[{"name":"concentrador.c","code":"/* concentrador.c — telemetría con orden causal (Lamport) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <time.h>\n#include <sys/socket.h>\n#include <sys/select.h>\n#include <netinet/in.h>\n\n#define PORT     9090\n#define MAX_BUF  128\n#define MAX_PEND 64\n\ntypedef struct {\n    int ts;\n    int pid;                /* id numérico de la sonda */\n    char line[MAX_BUF];     /* línea completa para el log */\n} PendingEvent;\n\nPendingEvent pend[MAX_PEND];\nint npend = 0;\nint reloj = 0;              /* reloj Lamport del concentrador */\n\n/* HIJO: atiende una sonda y manda cada evento al padre por la pipe */\nvoid atender_sonda(int fd, int pfd) {\n//@TODO 1 | Recibir líneas (buffer acumulador), parsear ts y enviar al padre\n    char buf[512];\n    int total = 0, n;\n    while ((n = recv(fd, buf + total, sizeof(buf) - total - 1, 0)) > 0) { //§\n        total += n;\n        buf[total] = '\\0';\n        char *nl;\n        while ((nl = strchr(buf, '\\n')) != NULL) { //§\n            *nl = '\\0';\n            PendingEvent ev;\n            char id[16], dst[16];\n            int seq;\n            float val;\n            memset(&ev, 0, sizeof ev);\n            if (sscanf(buf, \"TELEM %15s %d %f %d\", id, &seq, &val, &ev.ts) == 4 || //§\n                sscanf(buf, \"RELAY %15s %15s %f %d\", id, dst, &val, &ev.ts) == 4) { //§\n                sscanf(id, \"ARES-%d\", &ev.pid); //§\n                snprintf(ev.line, sizeof ev.line, \"%.120s\", buf);\n                write(pfd, &ev, sizeof ev);   /* < PIPE_BUF: escritura atómica */ //§\n            }\n            int usado = (nl - buf) + 1;\n            memmove(buf, nl + 1, total - usado + 1); //§\n            total -= usado; //§\n        }\n    }\n//@END\n}\n\nint cmp_ev(const void *a, const void *b) {\n    const PendingEvent *x = a, *y = b;\n    if (x->ts != y->ts) return x->ts - y->ts;\n    return x->pid - y->pid;\n}\n\n/* PADRE: escribe los pendientes ordenados por (ts, pid) */\nvoid flush_log(void) {\n//@TODO 2 | Ordenar y escribir en registro.log\n    if (npend == 0) return;\n    qsort(pend, npend, sizeof(PendingEvent), cmp_ev); //§\n    FILE *f = fopen(\"registro.log\", \"a\"); //§\n    for (int i = 0; i < npend; i++)\n        fprintf(f, \"ts=%d P%d | %s\\n\", pend[i].ts, pend[i].pid, pend[i].line); //§\n    fclose(f);\n    printf(\"[concentrador L=%d] %d eventos escritos en el log\\n\", reloj, npend);\n    npend = 0; //§\n//@END\n}\n\nint main(void) {\n    int p[2];\n//@TODO 3 | Socket servidor, pipe hijos→padre y loop con select()\n    int srv = socket(AF_INET, SOCK_STREAM, 0); //§\n    int opt = 1;\n    setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof opt);\n    struct sockaddr_in addr = {0};\n    addr.sin_family = AF_INET;\n    addr.sin_addr.s_addr = INADDR_ANY;\n    addr.sin_port = htons(PORT); //§\n    if (bind(srv, (struct sockaddr *)&addr, sizeof addr) < 0) { perror(\"bind\"); return 1; } //§\n    listen(srv, 8); //§\n    pipe(p); //§\n    signal(SIGCHLD, SIG_IGN);\n    printf(\"[concentrador] escuchando en %d\\n\", PORT);\n\n    time_t ultimo = time(NULL);\n    while (1) {\n        fd_set rd;\n        FD_ZERO(&rd);\n        FD_SET(srv, &rd); //§\n        FD_SET(p[0], &rd); //§\n        int maxfd = srv > p[0] ? srv : p[0];\n        struct timeval tv = {1, 0};             /* despertar cada 1 s */\n        select(maxfd + 1, &rd, NULL, NULL, &tv); //§\n\n        if (FD_ISSET(srv, &rd)) {\n            int cli = accept(srv, NULL, NULL); //§\n            fflush(stdout);                     /* evita duplicar el buffer en el hijo */\n            if (fork() == 0) { //§\n                close(srv); //§\n                close(p[0]); //§\n                atender_sonda(cli, p[1]);\n                close(cli);\n                exit(0);\n            }\n            close(cli); //§\n        }\n        if (FD_ISSET(p[0], &rd)) {\n            PendingEvent ev;\n            if (read(p[0], &ev, sizeof ev) == sizeof ev && npend < MAX_PEND) { //§\n                reloj = (ev.ts > reloj ? ev.ts : reloj) + 1;   /* regla de recepción */ //§\n                pend[npend++] = ev; //§\n            }\n        }\n        if (time(NULL) - ultimo >= 2) { //§\n            flush_log(); //§\n            ultimo = time(NULL);\n        }\n    }\n//@END\n    return 0;\n}\n"},{"name":"sonda.c","code":"/* sonda.c — sonda modificada: TELEM <id> <seq> <val> <ts> */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 9090\n\nint main(int argc, char *argv[]) {\n    if (argc < 4) {\n        fprintf(stderr, \"Uso: ./sonda <ARES-N> <IP> <valor_inicial> [ARES-destino]\\n\");\n        return 1;\n    }\n    const char *id = argv[1];\n    float valor = atof(argv[3]);\n    int reloj = 0;\n    char msg[128];\n\n    int fd = socket(AF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in srv = {0};\n    srv.sin_family = AF_INET;\n    srv.sin_port = htons(PORT);\n    inet_pton(AF_INET, argv[2], &srv.sin_addr);\n    if (connect(fd, (struct sockaddr *)&srv, sizeof srv) < 0) { perror(\"connect\"); return 1; }\n\n    for (int seq = 1; seq <= 5; seq++) {\n        valor += 0.5f;\n//@TODO 1 | Regla de envío: incrementar el reloj y adjuntar ts\n        reloj++; //§\n        snprintf(msg, sizeof msg, \"TELEM %s %d %.2f %d\\n\", id, seq, valor, reloj); //§\n//@END\n        send(fd, msg, strlen(msg), 0);\n        printf(\"[%s] envía %s\", id, msg);\n        usleep(300000);\n    }\n    if (argc >= 5) {            /* opcional: un RELAY hacia otra sonda */\n        reloj++;\n        snprintf(msg, sizeof msg, \"RELAY %s %s %.2f %d\\n\", id, argv[4], valor, reloj);\n        send(fd, msg, strlen(msg), 0);\n    }\n    close(fd);\n    return 0;\n}\n"}],"qs":[{"q":"Elige un mecanismo IPC para comunicar los hijos con el proceso que escribe el log. Justifica.","a":"<b>Pipe hijo → padre</b>: el padre la crea antes de los fork y todos los hijos heredan el extremo de escritura. Si cada evento se escribe con un solo <code>write()</code> de tamaño fijo menor a PIPE_BUF, la escritura es <b>atómica</b> y no se mezclan eventos de distintos hijos. El padre la vigila con select() junto al socket de escucha. <b>Memoria compartida + semáforo</b> obliga a gestionar el buffer y el lock a mano (más errores). Una <b>cola de mensajes</b> funcionaría, pero es más API para lo mismo."},{"q":"¿Basta esperar 2 segundos para garantizar que llegaron todos los mensajes anteriores a un timestamp T? ¿Qué supone sobre la red?","a":"<b>No.</b> Supone una red <b>síncrona</b>, con latencia máxima menor a 2 s. Una sonda lenta o una red congestionada puede entregar un mensaje con ts &lt; T después del flush, y el log quedaría desordenado."},{"q":"Propón una mejora que no dependa de un timeout fijo.","a":"Aprovechar que TCP entrega <b>en orden</b> por conexión y que cada sonda tiene un reloj creciente. El concentrador guarda el <b>último ts recibido de cada sonda</b>. Un evento con timestamp T es seguro de escribir cuando <b>todas</b> las sondas ya enviaron algo con ts ≥ T: min(último_ts[i]) ≥ T. Para que una sonda inactiva no bloquee, envía <b>heartbeats con su ts</b>. Es el criterio de estabilidad del algoritmo de Lamport."}],"hints":["El padre no puede leer de cada socket: lo hacen los hijos. Necesitas IPC hijo → padre.","Un struct de tamaño fijo por evento, escrito con un write(), no se mezcla en la pipe.","El padre hace select() con un timeout para poder hacer el flush aunque no lleguen eventos."],"think":["Padre: socket, bind, listen y pipe(p) ANTES de aceptar clientes.","Loop: select(srv, p[0], timeout 1 s). Socket listo → accept y fork (el hijo cierra srv y p[0]). Pipe lista → read de un PendingEvent, reloj = max(reloj, ts) + 1, guardar.","Cada 2 s: qsort por (ts, pid) y append a registro.log.","Hijo: buffer acumulador por líneas, sscanf de TELEM o RELAY, pid desde \"ARES-%d\", write a la pipe.","Sonda: reloj++ antes de cada send y adjuntar el ts."],"errors":["Guardar los eventos en un arreglo del HIJO (el padre nunca los ve).","Olvidar fflush(stdout) antes de fork(): el hijo repite lo que había en el buffer.","Bloquearse en read(p[0]) y no aceptar nuevas sondas (por eso select)."],"rubric":[{"pts":3,"t":"Justifica la IPC elegida"},{"pts":4,"t":"Hijo: parsea líneas y envía el evento al padre"},{"pts":4,"t":"Padre: select() entre el socket y la pipe"},{"pts":2,"t":"Reloj del concentrador con max + 1"},{"pts":3,"t":"Flush cada 2 s ordenado por (ts, pid)"},{"pts":2,"t":"Sonda incrementa y adjunta ts"},{"pts":2,"t":"Responde la suposición sobre la red"},{"pts":2,"t":"Mejora sin timeout (mínimo ts por sonda)"}],"lang":"c","pruebas":{"compilar":[{"src":["concentrador.c"],"out":"concentrador"},{"src":["sonda.c"],"out":"sonda"}],"pasos":[{"tipo":"iniciar","nombre":"Tu concentrador","cmd":"./concentrador","puerto":9090,"log":"concentrador.out","critico":true},{"tipo":"python","nombre":"3 sondas tuyas y orden de registro.log","archivo":"prueba/l12.py","timeout":30}],"archivos":{"prueba/l12.py":"\"\"\"Lanza 3 sondas tuyas contra tu concentrador y revisa el orden de registro.log.\"\"\"\nimport re, subprocess, time\nfrom cognition_prueba import *\nps = [subprocess.Popen([\"./sonda\", \"ARES-%d\" % i, \"127.0.0.1\", str(v)] + ([\"ARES-1\"] if i == 2 else []), stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\n      for i, v in [(1, 10), (2, 3), (3, 700)]]\nfor p in ps: p.wait(timeout=15)\ntime.sleep(4.5)\nlog = leer_archivo(\"registro.log\").splitlines()\neventos = []\nfor l in log:\n    m = re.search(r\"(TELEM\\s+ARES-(\\d+)\\s+\\d+\\s+[-\\d.]+\\s+(\\d+)|RELAY\\s+ARES-(\\d+)\\s+\\S+\\s+[-\\d.]+\\s+(\\d+))\", l)\n    if m: eventos.append((int(m.group(3) or m.group(5)), int(m.group(2) or m.group(4))))\ncheck(len(eventos) >= 15, \"registro.log tiene los eventos de las 3 sondas (%d)\" % len(eventos), \"Esperaba al menos 15 eventos en registro.log, hay %d. ¿El padre recibe lo que leen los hijos?\" % len(eventos))\ncheck(eventos == sorted(eventos), \"Los eventos están ordenados por (ts, pid)\", \"registro.log no está ordenado por (ts, pid): %s\" % eventos[:8])\nterminar()\n"}}},{"id":"L13","group":"lamport","n":"Ej. 13","topic":"lamport","lvl":3,"min":35,"title":"Snapshot consistente (Chandy-Lamport)","statement":"<p>3 procesos conectados por pipes (todos con todos). Cada uno parte con <code>counter = 100</code> y de vez en cuando hace TRANSFER(cantidad, ts) a otro (el emisor resta y el receptor suma). P0 inicia un snapshot: registra su estado y envía MARKER(ts) por todas sus pipes. Quien recibe el primer MARKER registra su estado y reenvía MARKER. Los mensajes que llegan por un canal después de registrar el estado y antes del MARKER de ese canal están <b>en tránsito</b>. La suma del snapshot debe ser 300.</p>","files":[{"name":"snapshot.c","code":"/* snapshot.c — snapshot consistente (Chandy-Lamport simplificado) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <signal.h>\n#include <sys/wait.h>\n#include <sys/select.h>\n\n#define NPROC 3\n#define ITER  30            /* 30 iteraciones de 100 ms = 3 s */\n\ntypedef enum { TRANSFER, MARKER } MsgType;\n\ntypedef struct {\n    MsgType type;\n    int ts;         /* timestamp Lamport */\n    int from;       /* pid del emisor */\n    int amount;     /* solo para TRANSFER */\n} Msg;\n\ntypedef struct {\n    int clock;\n    int pid;\n    int counter;            /* estado local del proceso */\n    int snap_counter;       /* estado capturado al snapshot */\n    int snap_taken;         /* ¿ya tomé mi snapshot? */\n    int snap_clock;         /* reloj al tomar el snapshot */\n    int marker_from[NPROC]; /* ¿recibí MARKER de Pi? */\n    int transito[NPROC];    /* suma de TRANSFER en tránsito por canal j -> yo */\n    int n_transito;         /* cantidad de mensajes en tránsito registrados */\n} Process;\n\ntypedef struct { int pid, snap_counter, transito, n_transito, snap_clock; } Resultado;\n\nint fds[NPROC][NPROC][2];   /* fds[i][j]: pipe de i hacia j */\nint res_pipe[2];            /* hijos -> padre: resultados */\nProcess P;\n\nvoid enviar(int dest, MsgType t, int amount) {\n    Msg m = { t, P.clock, P.pid, amount };\n    write(fds[P.pid][dest][1], &m, sizeof m);\n}\n\nint snapshot_completo(void) {\n    for (int j = 0; j < NPROC; j++)\n        if (j != P.pid && !P.marker_from[j]) return 0;\n    return P.snap_taken;\n}\n\nvoid tomar_snapshot(void) {\n//@TODO 1 | Registrar mi estado y enviar MARKER por todas mis pipes\n    P.snap_counter = P.counter; //§\n    P.snap_taken = 1; //§\n    P.snap_clock = P.clock;\n    P.clock++;                      /* enviar es un evento */ //§\n    for (int j = 0; j < NPROC; j++)\n        if (j != P.pid) enviar(j, MARKER, 0); //§\n//@END\n}\n\nvoid recibir(const Msg *m) {\n//@TODO 2 | Lamport + TRANSFER / MARKER\n    P.clock = (m->ts > P.clock ? m->ts : P.clock) + 1; //§\n    if (m->type == TRANSFER) {\n        P.counter += m->amount; //§\n        if (P.snap_taken && !P.marker_from[m->from]) { /* llegó tras mi snapshot y antes del MARKER de ese canal */ //§\n            P.transito[m->from] += m->amount; //§\n            P.n_transito++;\n        }\n    } else { /* MARKER */\n        if (!P.snap_taken) tomar_snapshot(); //§\n        P.marker_from[m->from] = 1; //§\n    }\n//@END\n}\n\n/* Lee todo lo disponible sin bloquear (select con timeout 0) */\nvoid leer_pipes(void) {\n    while (1) {\n        fd_set rd;\n        int maxfd = -1;\n        FD_ZERO(&rd);\n        for (int j = 0; j < NPROC; j++) {\n            if (j == P.pid || fds[j][P.pid][0] < 0) continue;\n            FD_SET(fds[j][P.pid][0], &rd);\n            if (fds[j][P.pid][0] > maxfd) maxfd = fds[j][P.pid][0];\n        }\n        struct timeval tv = {0, 0};\n        if (maxfd < 0 || select(maxfd + 1, &rd, NULL, NULL, &tv) <= 0) return;\n        for (int j = 0; j < NPROC; j++) {\n            if (j == P.pid || fds[j][P.pid][0] < 0 || !FD_ISSET(fds[j][P.pid][0], &rd)) continue;\n            Msg m;\n            if (read(fds[j][P.pid][0], &m, sizeof m) <= 0) { close(fds[j][P.pid][0]); fds[j][P.pid][0] = -1; continue; }\n            recibir(&m);\n        }\n    }\n}\n\nvoid proceso(int id) {\n    memset(&P, 0, sizeof P);\n    P.pid = id;\n    P.counter = 100;\n    srand(getpid());\n    for (int a = 0; a < NPROC; a++)\n        for (int b = 0; b < NPROC; b++) {\n            if (a == b) continue;\n            if (a != id) close(fds[a][b][1]);\n            if (b != id) close(fds[a][b][0]);\n        }\n    close(res_pipe[0]);\n\n//@TODO 3 | Loop principal: evento local, TRANSFER aleatorio, leer pipes, P0 inicia\n    for (int it = 0; it < ITER || !snapshot_completo(); it++) {\n        usleep(100000);\n        P.clock++;                              /* evento local */ //§\n        if (it < ITER && rand() % 2 == 0 && P.counter >= 10) {\n            int dest = (id + 1 + rand() % (NPROC - 1)) % NPROC; //§\n            int cant = 1 + rand() % 10;\n            P.counter -= cant;                  /* el emisor resta */ //§\n            P.clock++; //§\n            enviar(dest, TRANSFER, cant); //§\n        }\n        leer_pipes(); //§\n        if (id == 0 && it == 10 && !P.snap_taken) //§\n            tomar_snapshot(); //§\n    }\n//@END\n    int total_tr = 0;\n    for (int j = 0; j < NPROC; j++) total_tr += P.transito[j];\n    Resultado r = { id, P.snap_counter, total_tr, P.n_transito, P.snap_clock };\n    write(res_pipe[1], &r, sizeof r);\n    exit(0);\n}\n\nint main(void) {\n    signal(SIGPIPE, SIG_IGN);       /* un proceso puede terminar antes que otro */\n    for (int i = 0; i < NPROC; i++)\n        for (int j = 0; j < NPROC; j++)\n            if (i != j) pipe(fds[i][j]);\n    pipe(res_pipe);\n    for (int i = 0; i < NPROC; i++)\n        if (fork() == 0) proceso(i);\n    for (int i = 0; i < NPROC; i++)\n        for (int j = 0; j < NPROC; j++)\n            if (i != j) { close(fds[i][j][0]); close(fds[i][j][1]); }\n    close(res_pipe[1]);\n\n    int suma = 0;\n    Resultado r;\n    while (read(res_pipe[0], &r, sizeof r) == sizeof r) {\n        printf(\"P%d: snap_counter=%d  en tránsito=%d (%d msgs)  reloj al snapshot=%d\\n\",\n               r.pid, r.snap_counter, r.transito, r.n_transito, r.snap_clock);\n        suma += r.snap_counter + r.transito;\n    }\n    while (wait(NULL) > 0) ;\n    printf(\"TOTAL del snapshot = %d (debe ser %d)\\n\", suma, 100 * NPROC);\n    return 0;\n}\n"}],"out":"P1: snap_counter=106  en tránsito=0 (0 msgs)  reloj al snapshot=29\nP0: snap_counter=101  en tránsito=0 (0 msgs)  reloj al snapshot=27\nP2: snap_counter=93  en tránsito=0 (0 msgs)  reloj al snapshot=29\nTOTAL del snapshot = 300 (debe ser 300)","qs":[{"q":"¿Qué rol juegan los timestamps de Lamport en los MARKER? ¿Podría funcionar sin ellos?","a":"<b>Sí funcionaría sin ellos.</b> Lo que define el corte consistente es el <b>MARKER</b> y que las pipes son FIFO. Los timestamps ayudan a <b>razonar y verificar</b> la causalidad del corte (todo lo registrado es causalmente anterior al MARKER que lo cierra) y a ordenar o depurar los eventos, pero no son necesarios para el algoritmo."},{"q":"¿Por qué hay que capturar los mensajes en tránsito? Escenario.","a":"P0 tiene 100 y transfiere 10 a P1 (P0 = 90). <b>Luego</b> P0 toma su snapshot (90) y envía MARKER. P1 toma su snapshot antes de recibir esos 10 (100). Suma: 190 + 100 de P2 = 290. <b>Se perdieron 10</b>: estaban en la pipe. Contarlos como \"en tránsito\" en el canal P0→P1 devuelve 300. Al revés, contar un mensaje en el emisor y en el receptor lo <b>duplica</b>."},{"q":"P1 recibe un TRANSFER de P0 después de que P0 tomó su snapshot pero antes del MARKER de P0. ¿Dónde se contabiliza?","a":"Las pipes son FIFO y P0 envía el MARKER <b>apenas</b> toma su snapshot. Un TRANSFER enviado <b>después</b> del snapshot de P0 llega detrás del MARKER, así que pertenece al \"después\" y <b>no se cuenta</b>. Uno enviado <b>antes</b> del snapshot de P0 llega antes del MARKER: si P1 ya había tomado su snapshot (por un MARKER de P2), se registra como <b>en tránsito</b> del canal P0→P1; si no, ya está en el contador de P1 al registrarlo."},{"q":"¿Pueden dos ejecuciones dar snapshots distintos pero ambos consistentes?","a":"<b>Sí.</b> El snapshot no captura el estado real en un instante, sino un <b>corte consistente</b>. Cambian el momento del snapshot, la planificación y los TRANSFER aleatorios, así que los valores cambian, pero en todos se conserva la suma (300) y ningún mensaje queda recibido sin haber sido enviado."}],"hints":["Por cada canal entrante necesitas saber si ya llegó su MARKER (marker_from[j]).","Un TRANSFER va a \"en tránsito\" solo si yo ya tomé el snapshot Y el MARKER de ese canal aún no llega.","Para leer sin bloquearte: select() con timeout 0."],"think":["tomar_snapshot: snap_counter = counter, snap_taken = 1, clock++ y MARKER a todos.","Recibir TRANSFER: counter += amount; si snap_taken && !marker_from[from] → transito[from] += amount.","Recibir MARKER: si no tengo snapshot, lo tomo; marker_from[from] = 1.","Completo: snapshot tomado y MARKER de los otros dos.","El enunciado pide \"incrementar counter\" en cada iteración, pero eso cambiaría la suma total. En la solución el evento periódico solo avanza el reloj Lamport, para que la suma se conserve."],"errors":["Registrar un TRANSFER como en tránsito después de recibir el MARKER de ese canal.","Olvidar que el primer MARKER también cierra su propio canal (estado vacío).","Pipes bloqueantes sin select(): el proceso se queda pegado."],"rubric":[{"pts":2,"t":"Crea las 6 pipes y cierra extremos"},{"pts":3,"t":"tomar_snapshot registra estado y envía MARKER"},{"pts":4,"t":"Registra en tránsito solo en la ventana correcta"},{"pts":2,"t":"Recepción con Lamport"},{"pts":2,"t":"Lectura no bloqueante (select)"},{"pts":2,"t":"Suma = 300 e impresión de resultados"},{"pts":5,"t":"Preguntas teóricas 2 a 5"}],"lang":"c","pruebas":{"compilar":[{"src":["snapshot.c"],"out":"snapshot"}],"pasos":[{"tipo":"ejecutar","nombre":"El snapshot conserva la suma","cmd":"./snapshot","timeout":20,"espera":{"contiene":["TOTAL del snapshot = 300"]}}],"archivos":{}}},{"id":"C01A","group":"control","n":"Parte A","topic":"sockets","lvl":2,"min":25,"pts":55,"title":"Control 01 · Servidor SELENE","statement":"<p>La Base Lunar SELENE recibe telemetría de 4 sondas por TCP (puerto 7070). Texto plano y cada mensaje termina en <code>\\n</code>. <code>&lt;cs&gt;</code> lo calcula <code>checksum()</code> (ya implementada).</p>\n<table class=\"t\"><tr><th>Dirección</th><th>Mensaje</th></tr><tr><td>Sonda → Servidor</td><td><code>CONNECT &lt;id&gt;</code></td></tr><tr><td>Servidor → Sonda</td><td><code>HELLO &lt;id&gt;</code> | <code>REJECT &lt;id&gt;</code></td></tr><tr><td>Sonda → Servidor</td><td><code>TELEM &lt;id&gt; &lt;seq&gt; &lt;valor&gt; &lt;cs&gt;</code></td></tr><tr><td>Servidor → Sonda</td><td><code>ACK &lt;id&gt; &lt;seq&gt;</code> | <code>NACK &lt;id&gt; &lt;seq&gt;</code> | <code>ALERT &lt;id&gt; &lt;nivel&gt; &lt;detalle&gt;</code></td></tr></table>\n<table class=\"t\"><tr><th>Sonda</th><th>Métrica</th><th>ALERTA</th><th>CRÍTICO</th></tr><tr><td>ARES-1</td><td>Temperatura °C</td><td>&gt; −40</td><td>&gt; −30</td></tr><tr><td>ARES-2</td><td>Radiación mSv/h</td><td>&gt; 3.5</td><td>&gt; 6.0</td></tr><tr><td>ARES-3</td><td>Viento solar km/s</td><td>&gt; 750</td><td>&gt; 900</td></tr><tr><td>ARES-4</td><td>Energía panel %</td><td>&lt; 30</td><td>&lt; 15</td></tr></table><p>Completa <code>handle_sonda()</code> y <code>main()</code>. <b>A.1</b> (15 pts) conexión inicial; <b>A.2</b> (25 pts) loop de telemetría con checksum, respuesta, evaluación de umbrales y alertas; <b>A.3</b> (15 pts) inicialización y concurrencia.</p>","files":[{"name":"servidor.c","code":"/* servidor.c — Base SELENE (Control 01) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\n#include <signal.h>\n#include <sys/socket.h>\n#include <sys/wait.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n\n#define PORT 7070\n#define BUF_SIZE 256\n\nchar *checksum(const char *valor, char out[3]) {\n    unsigned int s = 0;\n    for (int i = 0; valor[i]; i++) s += (unsigned char)valor[i];\n    snprintf(out, 3, \"%02X\", s % 256);\n    return out;\n}\n\ntypedef struct {\n    char id[8];\n    float alerta;\n    float critico;\n    int mayor;  /* 1: alerta si valor > umbral | 0: si valor < umbral */\n} Umbral;\n\nUmbral umbrales[] = {\n    {\"ARES-1\", -40, -30, 1},\n    {\"ARES-2\", 3.5, 6.0, 1},\n    {\"ARES-3\", 750, 900, 1},\n    {\"ARES-4\", 30, 15, 0},\n};\n\n//@TODO A.2 | (parte 1) evaluar(): 0 = normal, 1 = ALERTA, 2 = CRITICO\n/* C estándar no permite funciones anidadas: evaluar() va fuera de handle_sonda() */\nint evaluar(const Umbral *u, float v) {\n    if (u->mayor) {\n        if (v > u->critico) return 2; //§\n        if (v > u->alerta) return 1; //§\n    } else {\n        if (v < u->crit
